<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="./icon-192.png">

<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="16班工作台">
<title>高三16班 · 班级工作台</title>
<style>
:root{
  --c1:#1e3a8a; --c2:#6d28d9; --bg:#eef2f7; --card:#ffffff; --ink:#1a2233; --mut:#64748b;
  --yi:#43a047; --ben:#1e88e5; --up:#FFD54F; --down:#FF8A65; --no:#cfd8dc;
  --red:#e53935; --ok:#2e7d32;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f7f9fc 0%,#eef2f8 46%,#e9eef6 100%);background-attachment:fixed;color:var(--ink);min-height:100vh}
/* ---------- 头部（紧凑版：一行标题+信息横滑+子导航单行横滑） ---------- */
header{background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 100%);color:#fff;padding:calc(11px + env(safe-area-inset-top,0px)) 13px 11px;position:sticky;top:0;z-index:30;box-shadow:0 4px 20px rgba(30,58,138,.35);overflow:hidden}
header::after{content:"";position:absolute;top:-40%;right:-12%;width:62%;height:180%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 62%);pointer-events:none}
header::before{content:"";position:absolute;bottom:-55%;left:-8%;width:52%;height:165%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 60%);pointer-events:none}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd-title{min-width:0;flex:1}
header .t1{font-size:clamp(15px,4.3vw,17px);font-weight:800;letter-spacing:.5px;line-height:1.2;white-space:nowrap}
header .t2{display:flex;gap:4px;margin-top:5px;overflow-x:auto;scrollbar-width:none;min-width:0}
header .t2::-webkit-scrollbar{display:none}
.hchip{flex-shrink:0;font-size:10.5px;line-height:1;padding:3.5px 8px;border-radius:999px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.28);white-space:nowrap}
.hd-date{flex-shrink:0;text-align:right;padding-left:4px}
.hd-d1{font-size:13px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.hd-d2{margin-top:4px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:3.5px 8px;border-radius:999px;display:inline-block;white-space:nowrap}
.hd-d2 b{font-size:12.5px;font-weight:900}
/* 分组子切换：单行横滑，不换行不占两行 */
#subnav{display:none;gap:7px;margin-top:10px;position:relative;z-index:1;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#subnav::-webkit-scrollbar{display:none}
#subnav button{flex-shrink:0;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;padding:5.5px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.2s;white-space:nowrap}
#subnav button:active{transform:scale(.95)}
#subnav button.on{background:#fff;color:var(--c1);font-weight:800;border-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
/* 底部固定 Tab 栏 */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:rgba(255,255,255,.94);border-top:.5px solid rgba(15,23,42,.10);box-shadow:0 -1px 0 rgba(15,23,42,.04),0 -10px 26px -8px rgba(15,23,42,.12);padding:5px 4px calc(7px + env(safe-area-inset-bottom));max-width:920px;margin:0 auto;isolation:isolate}
#tabbar button{flex:1;border:none;background:transparent;color:#94a3b8;padding:4px 2px;border-radius:12px;font-size:11px;cursor:pointer;transition:transform .12s ease,background .2s ease,color .2s ease;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15;position:relative;-webkit-tap-highlight-color:transparent}
#tabbar button .tic{position:relative;display:inline-flex}
#tabbar button .ic{font-size:21px;line-height:1;transition:transform .15s ease}
#tabbar button.on{color:var(--c1);background:linear-gradient(135deg,rgba(30,58,138,.10),rgba(109,40,217,.10));box-shadow:0 1px 5px rgba(30,58,138,.12)}
#tabbar button.on .ic{transform:translateY(-2px)}
.tbadge{position:absolute;top:-5px;right:-11px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#ff3b30;color:#fff;font-size:10px;font-weight:800;line-height:17px;text-align:center;box-shadow:0 0 0 2px rgba(255,255,255,.92);font-family:-apple-system,system-ui,sans-serif;pointer-events:none}
.tbadge:empty{display:none}
#examBar{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none;position:relative;z-index:1}
#examBar::-webkit-scrollbar{display:none}
#examBar button{flex-shrink:0;border:none;background:rgba(255,255,255,.16);color:#fff;padding:5px 13px;border-radius:999px;font-size:12px;cursor:pointer;transition:.2s;white-space:nowrap;border:1.5px solid transparent}
#examBar button:active{transform:scale(.95)}
#examBar button.on{background:#fff;color:var(--c1);font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.15)}
main{max-width:920px;margin:0 auto;padding:12px 12px 92px}
/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card h3::before{content:"";width:4px;height:17px;border-radius:3px;background:linear-gradient(var(--c1),var(--c2));box-shadow:0 0 7px rgba(30,58,138,.35)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{position:relative;overflow:hidden;background:linear-gradient(180deg,#ffffff,#f7f9fd);border-radius:18px;padding:15px 10px;text-align:center;box-shadow:0 1px 2px rgba(15,23,42,.05),0 10px 24px -14px rgba(30,58,138,.18)}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.kpi .v{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--mut);margin-top:3px}
.kpi .d{font-size:11px;margin-top:2px;color:var(--ok);font-weight:700}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;margin:3px;cursor:pointer;border:1.5px solid transparent;transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
.chip:active{transform:scale(.94)}
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:7px;margin-top:10px}
.bigbtn{min-height:46px;padding:10px 14px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;border:2px solid #e2e8f0;background:#fff;color:var(--ink);flex:1;text-align:center;min-width:104px;box-shadow:0 2px 0 #eef2f7;transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
.bigbtn:active{transform:translateY(1px) scale(.99);box-shadow:0 0 0 #eef2f7;background:#f8fafc}
.bar{height:10px;border-radius:5px;background:#e8edf5;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .6s}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1.5px solid #e8edf5;white-space:nowrap;font-size:12px}
td{padding:9px 6px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
tr.rowc{cursor:pointer;transition:.15s}
tr.rowc:hover{background:#f5f7ff}
tr.rowc:active{background:#eef2ff}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;color:#123}
.wb{display:inline-block;width:17px;height:17px;line-height:15px;text-align:center;border-radius:4px;font-size:10px;font-weight:800;color:#fff;margin-right:3px}
.tag-up{color:var(--ok);font-weight:800}
.tag-down{color:var(--red);font-weight:800}
input.sel,select.sel,textarea.sel{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;background:#fff;width:100%;font-family:inherit}
input.sel:focus,select.sel:focus,textarea.sel:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(30,58,138,.12);outline:none}
select.sel{min-width:96px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
/* 操作按钮（导出 / 导入 / 恢复）：统一图标按钮系统，精致一致 */
.act-btn{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:700;letter-spacing:.01em;cursor:pointer;border:1.5px solid #e6ebf2;background:#fff;color:var(--ink);white-space:nowrap;transition:transform .14s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease)}
.act-btn .ic{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:8px;background:linear-gradient(135deg,rgba(30,58,138,.12),rgba(109,40,217,.12));color:var(--c1);transition:background .22s var(--ease),color .22s var(--ease)}
.act-btn .ic svg{display:block}
.act-btn .lb{line-height:1}
.act-btn.imp .ic{background:linear-gradient(135deg,rgba(46,125,50,.14),rgba(67,160,71,.12));color:var(--ok)}
@media(hover:hover){.act-btn:hover{transform:translateY(-1px);border-color:var(--c1);box-shadow:0 6px 16px -6px rgba(30,58,138,.5)}.act-btn:hover .ic{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}.act-btn.imp:hover{border-color:var(--ok);box-shadow:0 6px 16px -6px rgba(46,125,50,.5)}.act-btn.imp:hover .ic{background:var(--ok);color:#fff}}
.act-btn:active{transform:translateY(1px) scale(.98)}
/* 成绩搜索工具栏吸顶：输入时随结果滚动始终钉在头部下方，避免 iOS 键盘弹起 / 结果表重排导致输入框被顶飞、页面乱跳 */
.sc-toolbar{position:sticky;top:58px;z-index:6;background:linear-gradient(180deg,#f6f9fd 78%,rgba(246,249,253,0));padding:2px 0 9px;margin-bottom:4px}
.toolbar input,.toolbar select{flex:1;min-width:120px}
.toolbar label.sel{white-space:nowrap}
.toolbar label.sel input[type="checkbox"]{width:auto;min-width:0;flex:0 0 auto;accent-color:var(--c1)}
.sec-title{font-size:13px;color:var(--mut);margin:14px 2px 8px;font-weight:700}
.empty{color:#9aa7b8;text-align:center;padding:40px 16px 34px;font-size:13.5px;line-height:1.7}
.empty::before{content:"";display:block;width:48px;height:48px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#eef2f7,#e2e8f0);box-shadow:inset 0 1px 2px rgba(255,255,255,.8)}
.note{font-size:12px;color:var(--mut);line-height:1.6}
.hw-hint{font-size:12px;color:var(--mut);line-height:1.5;margin-top:8px;padding:7px 10px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px}
/* 座位 */
/* iOS Safari / 微信内置浏览器：固定元素带 backdrop-filter、滚动容器加 mask-image、
   或内层网格/表格用 width:max-content;min-width:100% 都会被解析为"满宽无溢出"导致滑不动。
   故：底栏用半透明实底（无 backdrop-filter）、滚动容器不加 mask、内层内容只用 width:max-content（去掉 min-width:100%），
   并额外加 JS 触摸拖拽兜底（bindDragScroll）直接驱动 scrollLeft，确保真机必可横滑。 */
.seat-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;will-change:scroll-position;padding:8px 4px 4px}
.seat-grid2{display:grid;grid-template-columns:36px repeat(9,54px);gap:5px;width:max-content}
.seat-label{display:flex;align-items:center;justify-content:center;background:#4f4f4f;color:#fff;font-weight:700;font-size:11px;border-radius:6px;min-height:56px}
.podium-span{grid-column:span 7;background:#334155;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:8px;font-size:14px;min-height:44px}
.seat{border-radius:9px;padding:6px 2px;text-align:center;cursor:pointer;border:2px solid #b8c4d6;position:relative;min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.seat.focus{border-color:var(--red)}
/* 住校生：饱和粗橙框 + 白内描边（与橙黄底色隔离）+「住」角标；"重"的红点/红框仍保留 */
.seat.bz{border:3.5px solid #ff6a00!important;box-shadow:inset 0 0 0 2px #fff,0 2px 6px rgba(255,106,0,.25)}
.bz-tag{position:absolute;top:-7px;right:-6px;left:auto;z-index:2;background:#ff6a00;color:#fff;font-size:10px;font-weight:800;width:19px;height:19px;line-height:19px;border-radius:5px;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.seat .nm{font-size:12.5px;font-weight:800;line-height:1.15;white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seat .wk{font-size:9.5px;letter-spacing:2px;line-height:1;min-height:10px;color:#52607a}
.seat .dot{position:absolute;bottom:4px;right:4px;width:7px;height:7px;background:var(--red);border-radius:50%}
.seat.empty-s{border:1.5px dashed #d7dee8;background:#f8fafc;color:#a8b4c4;font-size:11px;cursor:default}
.g-badge{position:absolute;top:2px;left:2px;z-index:2;display:flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;color:#fff;box-shadow:0 0 0 1.5px #fff,0 1px 2px rgba(15,23,42,.25)}
.g-badge.gf{background:#ec4899}
.g-badge.gm{background:#2563eb}
.g-badge.gu{background:#f1f5f9;color:#94a3b8;border:1.5px dashed #94a3b8;box-shadow:0 0 0 1.5px #fff}
.g-badge svg{display:block}
.front-seat{min-height:44px}
.blackboard{text-align:center;color:#64748b;font-size:12px;margin-top:8px;letter-spacing:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:3px;border:1px solid #94a3b8}
/* 座位：编辑工具栏 / 选中态 / 打印 */
.seat-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.seat-toolbar button{flex:1;min-width:92px;padding:9px 4px;border:none;border-radius:10px;font-size:13px;font-weight:800;background:#eef2f7;color:#1f2d3d;cursor:pointer}
.seat-toolbar button.on{background:var(--yi);color:#fff}
.seat-toolbar button.bzon{background:#ff6a00;color:#fff}   /* 住校生开关选中：与橙框同色，语义一致 */
.seat-toolbar button.ghost{background:#fbe9e7;color:#b3261e}
.seat.sel{border-color:var(--yi)!important;box-shadow:0 0 0 3px rgba(67,160,71,.30);outline:2px dashed var(--yi)}
.seat.edit{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-touch-callout:none}
.seat-hint{font-size:12px;color:var(--yi);font-weight:700;margin:2px 0 4px}
.seat-print-head{display:none}
/* ---------- 周末课表 ---------- */
.we-range{font-size:11px;font-weight:700;color:var(--mut);background:#f1f5f9;padding:2px 8px;border-radius:8px;margin-left:auto}
.we-state{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:linear-gradient(135deg,#eff6ff,#f8fafc);border:1px solid #dbeafe;border-radius:12px;padding:9px 11px;margin-bottom:10px;font-size:12px;line-height:1.5}
.we-state b{font-size:12.5px;color:var(--c1)}
.we-days{display:flex;gap:8px;margin-bottom:9px}
.we-day{flex:1;min-height:42px;border:1.5px solid #e2e8f0;border-radius:10px;background:#fff;font-size:13px;font-weight:800;color:var(--mut);cursor:pointer;position:relative}
.we-day.on{background:var(--c1);border-color:var(--c1);color:#fff;box-shadow:0 3px 10px rgba(30,58,138,.22)}
.we-day .today{position:absolute;top:-7px;right:6px;background:#f97316;color:#fff;font-size:9px;padding:1px 5px;border-radius:5px;font-weight:800;font-style:normal}
.we-note{font-size:11.5px;color:#b45309;background:#fffbeb;border:1px dashed #fcd34d;border-radius:8px;padding:6px 9px;margin-bottom:9px}
.we-rows{border:1px solid #e6ebf2;border-radius:12px;overflow:hidden}
.we-row{display:grid;grid-template-columns:82px 56px minmax(0,1fr);align-items:stretch;border-bottom:1px solid #eef2f7}
.we-row:last-child{border-bottom:0}
.we-row.we-head{background:#f8fafc;font-size:11px;color:var(--mut);font-weight:700;min-height:27px}
.we-row>span,.we-row>div{padding:6px;display:flex;align-items:center;font-size:12px;min-width:0}
.we-row .we-t{justify-content:center;color:var(--mut);font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.we-row .we-p{justify-content:center;font-weight:800;color:#475569;font-size:11px;white-space:nowrap}
.we-cellwrap{display:flex!important;align-items:center;gap:5px;flex-wrap:wrap;padding:4px 6px!important}
.we-cell{display:inline-flex;align-items:baseline;gap:6px;border-radius:8px;color:#fff;font-weight:800;font-size:12.5px;padding:6px 9px;box-shadow:0 1px 3px rgba(15,23,42,.12);white-space:nowrap}
.we-cell small{font-size:10px;font-weight:600;opacity:.92}
.we-tag{font-style:normal;font-size:10px;font-weight:800;color:#b45309;background:#fef3c7;padding:2px 5px;border-radius:5px;white-space:nowrap}
.we-live{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:#ef4444;padding:2px 5px;border-radius:5px;white-space:normal}
.we-state .we-live{background:#f97316}
.we-row.now{background:#fff7ed;box-shadow:inset 3px 0 0 #f97316}
.we-row.past{opacity:.52}
.we-row.rest .we-cell{background:#e2e8f0!important;color:#64748b;box-shadow:none}
.we-foot{font-size:11px;color:var(--mut);line-height:1.65;margin-top:9px}
.we-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.we-toolbar button{flex:1;min-width:120px;min-height:44px;border:1.5px solid #e2e8f0;background:#fff;border-radius:10px;font-size:13px;font-weight:700;color:var(--c1);cursor:pointer}
@page{size:A4 landscape;margin:5mm}
@media print{
  html,body{background:#fff!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  #app>header,#tabbar,#foot,#subnav,#examBar,#toast,.seat-toolbar,.seat-hint,.we-toolbar{display:none!important}
  .sc-fade{display:none!important}
  .wx-card{display:none!important}
  .act-btn{display:none!important}
  .nw-card{display:none!important}
  .modal{display:none!important}
  .we-cell,.we-row.now{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  #main{padding:0!important;overflow:visible!important;max-width:none!important;margin-left:0!important}
  .card{box-shadow:none!important;border:1px solid #e2e8f0!important;padding:4px!important;margin:0!important;page-break-inside:avoid}
  .panel{box-shadow:none!important;border:1px solid #e2e8f0!important;break-inside:avoid}
  .sc-toolbar{position:static!important;background:none!important;padding:0!important;margin-bottom:10px!important}
  .seat-scroll{overflow:visible!important;padding:0!important}
  /* 座位表铺满 A4 横向：网格拉伸至整页宽、座位加高占满纵向，且整体控制在单页内 */
  .seat-grid2{width:100%!important;grid-template-columns:18mm repeat(9,1fr);gap:2px}
  .seat-label{min-height:19mm;font-size:12px}
  .seat{min-height:19mm!important;padding:3px 2px!important;border-width:2px;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .seat .nm{font-size:15px!important}
  .seat .wk{font-size:10px!important;letter-spacing:1px}
  .seat .dot{width:8px;height:8px}
  .podium-span{min-height:15mm;font-size:18px}
  .front-seat{min-height:15mm}

#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);background:rgba(30,42,120,.96);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:700;z-index:999;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 6px 20px rgba(15,23,42,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 入场动画：仅在整视图切换(go)时触发，模块内 refresh 不重放 */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 错落入场：视图切换时直接子卡按序淡入上移，营造层次流动感（仅 go 时播放一次） */
#main.anim > *{animation:up .4s var(--ease) both}
#main.anim > *:nth-child(1){animation-delay:.02s}
#main.anim > *:nth-child(2){animation-delay:.05s}
#main.anim > *:nth-child(3){animation-delay:.08s}
#main.anim > *:nth-child(4){animation-delay:.11s}
#main.anim > *:nth-child(5){animation-delay:.14s}
#main.anim > *:nth-child(6){animation-delay:.17s}
#main.anim > *:nth-child(7){animation-delay:.20s}
#main.anim > *:nth-child(8){animation-delay:.23s}
#main.anim > *:nth-child(9){animation-delay:.26s}
#main.anim > *:nth-child(n+10){animation-delay:.30s}
/* 关闭系统级下拉刷新，改由本站接管（避免与浏览器/微信原生下拉冲突） */
html,body{overscroll-behavior:none}
/* 下拉刷新 */
#ptr{position:fixed;left:0;right:0;top:0;z-index:90;padding-top:env(safe-area-inset-top,0px);height:0;overflow:hidden;display:flex;justify-content:center;pointer-events:none}
#ptr .ptr-box{margin-top:7px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:999px;padding:6px 15px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(30,58,138,.3);font-size:13px;font-weight:700;opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s}
#ptr.show .ptr-box{opacity:1;transform:scale(1)}
#ptr .ptr-ic{font-size:16px;transition:transform .2s;display:inline-block}
#ptr.spin .ptr-ic{animation:ptrspin .7s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
/* 启动骨架屏：首屏解析大体积内嵌数据时给出 app 式加载占位，避免白屏闪跳 */
#skeleton{position:fixed;inset:0;z-index:200;background:#eef2f7;transition:opacity .28s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.ready #skeleton{opacity:0;pointer-events:none;visibility:hidden}
#skeleton .sk-bar{height:112px;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.92}
#skeleton .sk-wrap{padding:16px 14px;display:flex;flex-direction:column;gap:12px}
#skeleton .sk-card{height:118px;border-radius:16px;background:#fff;position:relative;overflow:hidden}
#skeleton .sk-row{display:flex;gap:12px}
#skeleton .sk-card.sm{height:84px;flex:1}
#skeleton .sk-tab{position:fixed;left:0;right:0;bottom:0;height:60px;background:#fff;border-top:1px solid #e8edf3}
#skeleton .sk-card::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.7) 50%,transparent 75%);transform:translateX(-100%);animation:sk-sh 1.25s infinite}
@keyframes sk-sh{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){#skeleton .sk-card::after{animation:none}}
/* 弹层（课表/导入/分享）入场：底部上滑 + 轻微缩放，贴近原生 app 的 sheet 手势惯性 */
@keyframes sheetIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
#ttModal.show .ttcard,#impModal.show .impcard,#shareLinkMask.show .card{animation:sheetIn .22s ease both}
/* 下拉刷新提示胶囊样式在 #ptr 中；头部不再放置刷新按钮（小程序式下拉触发） */

/* 成绩表：首两列固定 + 明确可横向滑动 */
.scroll-tip{font-size:11px;color:var(--mut);text-align:right;margin:-2px 0 6px}

/* 可横滑容器右/左缘渐隐遮罩：明确「还有内容可滑」，化解硬截断造成的"像 bug"观感 */
.sc-fade{position:absolute;top:0;right:0;width:50px;pointer-events:none;z-index:6;opacity:0;transition:opacity .18s ease;display:flex;align-items:flex-start;padding-top:7px}

/* 作息时间表 */
.zx-phase{font-size:13px;color:var(--mut);margin:2px 0 4px;padding:8px 12px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-radius:10px;border:1px solid #e0e7ff}
.zx-phase b{color:var(--c1);font-size:15px}
.zx-grp{display:flex;align-items:stretch;margin:8px 0;border:1px solid #eef0f4;border-radius:12px;overflow:hidden;background:#fff}
.zx-pr{writing-mode:horizontal-tb;flex:0 0 54px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(160deg,var(--c1),var(--c2));text-align:center;padding:6px}
.zx-list{flex:1;display:flex;flex-direction:column}
.zx-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #f1f3f7}
.zx-row:last-child{border-bottom:none}
.zx-name{flex:1;font-size:14.5px;font-weight:600;color:#1f2937}
.zx-time{font-variant-numeric:tabular-nums;font-size:13.5px;color:#64748b;font-weight:700}
.zx-now{display:none;font-size:11px;font-weight:800;color:#fff;background:#ef4444;border-radius:20px;padding:2px 9px;margin-left:4px}
.zx-row.now{background:#fff1f2;box-shadow:inset 3px 0 0 #ef4444}
.zx-row.now .zx-name{color:#dc2626;font-weight:800}
.zx-row.now .zx-now{display:inline-block}
.zx-row.now .zx-time{color:#dc2626}
#ttModal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:210;display:none;align-items:center;justify-content:center;padding:18px}
#ttModal.show{display:flex}
.ttcard{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:340px;box-shadow:0 12px 40px rgba(15,23,42,.3)}
/* 导入对话框 */
#impModal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:220;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
#impModal.show{display:flex}
.impcard{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:390px;box-shadow:0 12px 40px rgba(15,23,42,.3);max-height:92vh;overflow:auto}
.imp-h{font-size:16px;font-weight:800;margin-bottom:2px}
.imp-note{font-size:12px;color:var(--mut);line-height:1.6;margin:6px 0}
.imp-row{margin:11px 0}
.imp-row>label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px;font-weight:700}
.imp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.imp-chips .ic{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.imp-btns{display:flex;gap:8px;margin-top:14px}
.imp-btns button{flex:1;min-height:46px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;border:2px solid #e2e8f0}
.imp-btns .ok{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent}
.imp-btns .no{background:#fff;color:var(--mut)}
/* 备忘录 */
.memo-list{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.memo-item{position:relative;background:linear-gradient(135deg,#fffdf3 0%,#fff8e1 100%);border:1px solid #f3e6bb;border-left:4px solid #f4c430;border-radius:13px;padding:12px 14px 11px;box-shadow:0 2px 10px rgba(244,196,48,.12);transition:transform .15s var(--ease),box-shadow .22s var(--ease),border-color .2s var(--ease)}
@media(hover:hover){.memo-item:hover{transform:translateY(-2px);box-shadow:0 16px 30px -18px rgba(244,196,48,.6);border-color:#efdca0}}
.memo-txt{font-size:14px;line-height:1.55;color:#41381c;white-space:pre-wrap;word-break:break-word}
.memo-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.memo-time{font-size:11px;color:#b08a23;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.memo-time::before{content:"";width:5px;height:5px;border-radius:50%;background:#f4c430;box-shadow:0 0 0 2px rgba(244,196,48,.22)}
.memo-del{color:#c79a2e;font-size:13px;cursor:pointer;padding:2px 7px;border-radius:6px;transition:.15s var(--ease)}
@media(hover:hover){.memo-del:hover{background:#fef3c7;color:#b45309}}
/* 待办 */
.todo-add{display:flex;gap:8px;margin-top:4px}
.todo-add input{flex:1}
.todo-stat{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);margin:10px 0 5px;font-weight:700}
.todo-pct{color:var(--c1)}
.bar{height:8px;background:#edf1f6;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:99px;transition:width .45s var(--ease);box-shadow:0 0 10px rgba(109,40,217,.45)}
.todo-clear{font-size:12px;color:#7c8aa0;cursor:pointer;display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:999px;background:#f1f5f9;transition:.15s var(--ease)}
.todo-clear:active{opacity:.6}
@media(hover:hover){.todo-clear:hover{background:#e7ecf7;color:var(--c1)}}
.todo-list{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.todo-sep{font-size:11.5px;color:var(--mut);font-weight:800;letter-spacing:.4px;margin:11px 2px 2px;display:flex;align-items:center;gap:8px}
.todo-sep::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#e2e8f0,transparent)}
.todo-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #eef1f6;border-radius:12px;padding:11px 12px;cursor:pointer;transition:transform .15s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
@media(hover:hover){.todo-item:hover{transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(30,58,138,.3);border-color:#e3e9f5}}
.todo-item:active{transform:scale(.99)}
.todo-item.done{background:#f6f8fb}
.todo-check{flex:0 0 22px;height:22px;width:22px;border-radius:50%;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900;transition:.2s var(--ease);background:#fff}
.todo-check:active{transform:scale(.9)}
.todo-item.done .todo-check{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:transparent;box-shadow:0 3px 9px -2px rgba(30,58,138,.55)}
.todo-text{flex:1;font-size:14px;line-height:1.4;word-break:break-word}
.todo-item.done .todo-text{color:#aab3c0;text-decoration:line-through}
.todo-del{flex:0 0 auto;color:#cdd5e0;font-size:14px;padding:2px 6px;border-radius:6px;transition:.15s var(--ease)}
@media(hover:hover){.todo-del:hover{background:#fee2e2;color:#ef5350}}
/* ============ 设计升级：图表 / 趋势 / 质感 ============ */
:root{--sh-1:0 1px 2px rgba(15,23,42,.04);--sh-2:0 16px 36px -16px rgba(30,58,138,.18);--ring:0 0 0 3px rgba(30,58,138,.13)}
.card{box-shadow:var(--sh-1),var(--sh-2),inset 0 1px 0 rgba(255,255,255,.6);border:1px solid rgba(15,23,42,.05);transition:box-shadow .25s ease,transform .15s ease,border-color .2s ease}
@media(hover:hover){.card:hover{box-shadow:var(--sh-1),var(--sh-2),var(--ring);transform:translateY(-1px)}}
.kpi{box-shadow:var(--sh-1),var(--sh-2)}
.card h3{letter-spacing:.3px}
/* 图表容器 */
.panel{background:var(--card);border-radius:16px;padding:13px 14px 11px;margin-bottom:12px;box-shadow:var(--sh-1),var(--sh-2),inset 0 1px 0 rgba(255,255,255,.6);border:1px solid rgba(15,23,42,.045)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.panel-h span:first-child{font-size:14.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px}
.panel-h span:first-child::before{content:"";width:4px;height:15px;border-radius:2px;background:linear-gradient(var(--c1),var(--c2));box-shadow:0 0 6px rgba(30,58,138,.3)}
.panel-tag{font-size:11px;font-weight:700;color:var(--mut);background:#f1f5f9;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chart{width:100%;display:block;margin:6px 0 2px}
.chart-legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 2px 2px;font-size:11.5px;color:var(--mut)}
.lg-item{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.lg-item i{width:11px;height:11px;border-radius:3px;display:inline-block}
/* 各科走势·小图并列（small multiples，互不重叠、全部显示） */
.trend-grid{display:grid;gap:9px;margin-top:8px}
.trend-cell{background:#f8fafc;border:1px solid #eef1f6;border-radius:12px;padding:7px 8px 2px}
.tc-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#334155;margin-bottom:1px}
.tc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tc-v{margin-left:auto;font-size:14px;font-weight:900;color:#1e293b;font-variant-numeric:tabular-nums}
.trend-cv{width:100%;display:block}
/* 历次成绩总表 */
.hs-chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.hs-chips::-webkit-scrollbar{display:none}
.hs-chips button{flex-shrink:0;border:1.5px solid #e2e8f0;background:#fff;color:#334155;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.hs-chips button.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(30,58,138,.25)}
.hs-chips button:active{transform:scale(.95)}
.hs-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #eef1f6;border-radius:12px;background:#fff;isolation:isolate;will-change:scroll-position}
.hs-table{border-collapse:collapse;font-size:12px;min-width:100%}
.hs-table th,.hs-table td{padding:6px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid #f1f5f9}
.hs-table thead th{position:sticky;top:0;background:#f8fafc;font-size:11px;color:#64748b;z-index:2;box-shadow:0 1px 0 #e2e8f0}
.hs-table .hs-rk{position:sticky;left:0;background:#fff;font-weight:800;color:#64748b;z-index:1;min-width:34px}
.hs-table .hs-name{position:sticky;left:35px;background:#fff;font-weight:800;color:#1e293b;z-index:1;text-align:left;min-width:56px;box-shadow:1px 0 0 #eef1f6}
.hs-table thead .hs-rk,.hs-table thead .hs-name{background:#f8fafc;z-index:3}
.hs-td b{font-variant-numeric:tabular-nums;color:#0f172a}
.hs-rkmini{display:block;font-size:10px;line-height:1.25;color:#334155;font-weight:600;margin-top:2px;white-space:nowrap}
.hs-td[style*="background"] .hs-rkmini{color:rgba(20,30,45,.82)}
.hs-spark{width:96px;height:30px;max-width:96px;max-height:30px;display:block;margin:auto}
.hs-table th:last-child,.hs-table td:last-child{min-width:108px}
.hs-td{min-width:76px;max-width:120px}
.hs-td b{font-size:13px}
.hs-foot{font-size:11px;color:var(--mut);margin-top:7px}
/* 概览 sparkline */
.spark-card .spark-top{display:flex;align-items:baseline;justify-content:space-between}
.spark-card .spark-top b{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.spark-card .spark-top span{font-size:13px;color:var(--mut);font-weight:700}
.spark-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:2px}
.spark-chg.up{color:var(--ok);font-weight:800}
.spark-chg.down{color:var(--red);font-weight:800}
/* 进步 / 退步排行 */
.rank-row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px}
.rk-n{width:62px;flex-shrink:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-bar{flex:1;height:10px;background:#eef1f6;border-radius:99px;overflow:hidden}
.rk-bar i{display:block;height:100%;border-radius:99px}
.rk-bar i.up{background:linear-gradient(90deg,#66bb6a,#43a047)}
.rk-bar i.down{background:linear-gradient(90deg,#ef5350,#e53935)}
.rk-v{width:42px;text-align:right;font-weight:800;flex-shrink:0;font-variant-numeric:tabular-nums}
.rk-v.up{color:var(--ok)} .rk-v.down{color:var(--red)}
/* 底部 Tab 选中指示条 */
#tabbar button{position:relative}
#tabbar button.on::after{content:"";position:absolute;top:1px;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 1px 3px rgba(30,58,138,.4)}
#tabbar button.on .ic{filter:drop-shadow(0 2px 4px rgba(30,58,138,.35))}
/* 卡片标题图标统一风格 */
.card h3 .h-ico{width:24px;height:24px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;margin-right:0;flex:0 0 auto;box-shadow:0 3px 8px rgba(30,58,138,.30)}
/* 列表行更细腻 */
tr.rowc:hover{background:#f5f7ff}
tr.rowc:active{background:#eef2ff}
/* 按钮质感 */
.bigbtn{transition:transform .15s,box-shadow .15s}
.bigbtn:hover{box-shadow:var(--sh-2)}
/* 空状态更友好 */
.empty{color:#aab4c4;text-align:center;padding:34px 12px;font-size:13.5px;background:#fafbfd;border:1px dashed #e2e8f0;border-radius:12px;margin:6px 0}
/* chip 悬浮质感 */
.chip{transition:.15s;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.chip:hover{box-shadow:0 3px 10px rgba(15,23,42,.12)}
/* 一生一档增强 */
.pf-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.pf-tag{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);color:#fff}
.diag{background:linear-gradient(135deg,#f5f8ff,#eef2ff);border:1.5px solid #dbe3f5;border-radius:14px;padding:13px 14px;font-size:13.5px;line-height:1.95;color:#1e2a44}
.diag b{color:var(--c1)}
.diag .edge{font-weight:800;color:var(--red)}
.subj-table{border-collapse:collapse;font-size:12px;width:100%}
.subj-table th,.subj-table td{padding:7px 5px;text-align:center;white-space:nowrap;border-bottom:1px solid #f1f5f9}
.subj-table thead th{position:sticky;top:0;background:#f8fafc;color:#64748b;font-size:11px;box-shadow:0 1px 0 #e2e8f0}
.subj-table .sname{text-align:left;font-weight:800}
.subj-table .best{background:linear-gradient(90deg,rgba(102,187,106,.16),rgba(102,187,106,0))}
.subj-table .worst{background:linear-gradient(90deg,rgba(229,57,53,.14),rgba(229,57,53,0))}
.subj-table .sc{color:#fff;font-weight:800;border-radius:5px;padding:2px 8px;display:inline-block;min-width:34px}
.local-arc{background:#fbfcfe;border:1.5px solid #eef1f6;border-radius:14px;padding:12px}
.local-arc .arc-block{margin:11px 0 3px;padding-top:10px;border-top:1px dashed #e8edf3}
.local-arc .arc-block:first-child{border-top:none;margin-top:2px;padding-top:0}
.local-arc .arc-h{font-size:13px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.local-arc .arc-h .cnt{font-size:11px;font-weight:700;color:var(--mut);background:#eef2f7;padding:1px 9px;border-radius:999px}
.local-arc .arc-item{font-size:12.5px;line-height:1.6;color:#334155;margin:3px 0}
.local-arc .arc-note{background:#fff8e1;border:1px solid #f5e8b8;border-radius:8px;padding:7px 10px;font-size:12.5px;color:#5d4b00;line-height:1.6;margin:4px 0}
.muted{color:var(--mut);font-size:12px}
/* 达本轨迹 步骤条 */
.et-track{display:flex;align-items:stretch;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 2px}
.et-node{flex:0 0 auto;min-width:108px;background:#fff;border:1.5px solid #e8edf3;border-radius:14px;padding:10px 12px;text-align:center;box-shadow:0 1px 4px rgba(30,58,138,.05)}
.et-exam{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.et-node .badge{margin:7px auto 6px;display:block;width:max-content;font-size:11px}
.et-z{font-size:14px;font-weight:800;color:#1e2a44}
.et-chg{font-size:11px;font-weight:800;margin-top:4px}
.et-chg.up{color:#2e7d32}
.et-chg.dn{color:#c62828}
.et-arrow{flex:0 0 auto;align-self:center;color:#94a3b8;font-size:18px;font-weight:800;padding:0 4px}
/* 分享按钮（一生一档顶部） */
.pf-share{background:#fff!important;color:var(--c1)!important;border:1.5px solid var(--c1)!important;font-weight:700;cursor:pointer}

.pq-cands{margin-top:12px}

.pq-cands .c:active{background:rgba(255,255,255,.28)}
/* 分享家长查询页（弹层） */
.hd-right{display:flex;align-items:center;gap:8px}
#shareLinkMask{position:fixed;inset:0;z-index:220;background:rgba(15,23,42,.85);display:none;align-items:center;justify-content:center;padding:20px}
#shareLinkMask.show{display:flex}
#shareLinkMask .card{background:#fff;border-radius:18px;padding:22px 20px;width:100%;max-width:330px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:up .25s ease both}
#shareLinkMask .stitle{font-size:17px;font-weight:800;color:#1e3a8a}
#shareLinkMask .sub{font-size:12px;color:#64748b;margin:6px 0 16px;line-height:1.7}
#shareLinkMask .qrimg{width:196px;height:196px;border-radius:12px;margin:0 auto 14px;background:#f1f5f9;object-fit:contain;display:block}

#shareLinkMask .acts .op{background:#e2e8f0;color:#1e293b}
#shareLinkMask .cls{margin-top:12px;font-size:13px;color:#94a3b8;cursor:pointer}
/* ===================== 设计系统升级 ===================== */
:root{
  --sp-1:6px;--sp-2:10px;--sp-3:14px;--sp-4:20px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --r-sm:10px;--r-md:14px;--r-lg:18px;
  --sh-card:0 1px 2px rgba(15,23,42,.04),0 10px 26px -18px rgba(30,58,138,.22);
  --sh-pop:0 18px 52px -14px rgba(15,23,42,.30);
  --surf-2:#f8fafc;--surf-3:#f1f5f9;
  --sidebar-w:236px;
}
/* 统一过渡与缓动 */
.card,.panel,.bigbtn,.chip,.lb,.quick a,.todo-item,.chat-item,.hw-chip,.seat,.we-day,.py-card,a,button,.toolbar button,.seat-toolbar button,.tt-cell,.subj-chips .sc{
  transition:transform .16s var(--ease),box-shadow .16s var(--ease),background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),opacity .16s var(--ease)}
/* 键盘焦点可见（桌面可访问性） */
:focus-visible{outline:2.5px solid var(--c1);outline-offset:2px;border-radius:8px}
/* 桌面端：快捷入口悬浮微浮，强化"可点击"暗示 */
@media(hover:hover){.quick a:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(30,58,138,.32)}}
/* 尊重减少动效偏好 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #main.anim > *{animation:none!important}
}
/* 手机端：底部预留安全区+tab栏高度，避免内容被遮挡。
   注意：iOS Safari 下 mask-image 加在 overflow:auto 的横向滚动容器上会直接禁用滚动，
   故不再对 #subnav/#examBar/.hs-chips 使用遮罩（保留纯 CSS 渐隐提示改用其他手段）。 */
@media (max-width:1023px){
  #main{padding:14px 14px 72px}
}
/* 触摸反馈统一（仅触摸设备） */
@media (hover:none){
  #tabbar button:active{background:rgba(30,58,138,.10)}
  /* 容器型(.card/.panel)不加缩放：手指在卡片上滑动/轻点时整卡缩放会造成抖动感，故仅按钮型元素保留轻缩放 */
  .quick a:active,.bigbtn:active,.chip:active,.lb:active,.we-day:active,.py-card:active{transform:scale(.96)}
  /* 点击反馈走合成层 + 统一短缓动，消除低端机重排抖动；基础规则里的 .quick a 冲突项在此统一 */
  #tabbar button,.quick a,.bigbtn,.chip,.lb,.we-day,.py-card,.hs-chips button,.hw-chip,.subj-chips .sc{
    will-change:transform;transition:transform .12s var(--ease),background-color .2s ease
  }
}
/* 底部 tab 选中态：轻微背景（移动/桌面通用增强） */
#tabbar button.on{background:linear-gradient(135deg,rgba(30,58,138,.08),rgba(109,40,217,.08))}
/* 弹层/提示统一缓动 */
#randMask,#ttModal,#impModal,#shareLinkMask{transition:opacity .2s var(--ease)}
#toast{transition:opacity .22s var(--ease),transform .22s var(--ease)}

/* 返回顶部浮动按钮：长列表滚动超一屏后浮现，点击平滑回顶 */
#toTop{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:55;width:44px;height:44px;border:none;border-radius:50%;
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:20px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(30,58,138,.38);
  opacity:0;transform:translateY(12px) scale(.8);pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);-webkit-tap-highlight-color:transparent}
#toTop.show{opacity:1;transform:none;pointer-events:auto}
#toTop:active{transform:scale(.9)}
/* 视图切换淡入（一次性：用 inline 触发、刷新重绘不重播，避开 .anim 重播导致的晃动） */
@keyframes viewIn{from{opacity:.5;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#main{animation:none!important}}
/* 性能懒渲染：屏外卡片跳过渲染；含 canvas 的卡片排除（其 clientWidth 需真实布局，否则图表绘制尺寸异常）；
   不支持 :has / content-visibility 的旧浏览器会整体忽略此规则，安全退化 */
.card:not(:has(canvas)){content-visibility:auto;contain-intrinsic-size:auto 300px}

/* ===================== 桌面端「像软件」响应式 ===================== */
@media (min-width:1024px){
  /* 顶栏：横跨侧边栏右侧，含标题 / 考试切换 / 分组切换 */
  header{position:sticky;top:0;padding-left:calc(var(--sidebar-w) + 18px);box-shadow:0 6px 22px -14px rgba(30,58,138,.45)}
  /* 左侧固定导航（复用底部 tabbar 内容，CSS 重排为竖向侧栏） */
  #tabbar{position:fixed;left:0;right:auto;top:0;bottom:0;width:var(--sidebar-w);max-width:none;margin:0;
    flex-direction:column;align-items:stretch;justify-content:flex-start;gap:5px;
    background:#fff;border-top:none;border-right:1px solid #e8edf3;
    backdrop-filter:none;-webkit-backdrop-filter:none;
    box-shadow:4px 0 22px -12px rgba(15,23,42,.14);
    padding:0 12px 20px;z-index:60}
  #tabbar::before{content:"班级工作台";display:flex;align-items:center;gap:9px;
    font-size:15px;font-weight:900;color:#fff;letter-spacing:.4px;
    margin:0 -12px 10px;padding:20px 18px;background:linear-gradient(135deg,var(--c1),var(--c2))}
  #tabbar button{flex-direction:row;justify-content:flex-start;gap:13px;
    padding:12px 15px;border-radius:13px;font-size:15px;font-weight:700;color:#475569;line-height:1.2}
  #tabbar button .ic{font-size:22px}
  #tabbar button.on{color:var(--c1);background:linear-gradient(135deg,rgba(30,58,138,.11),rgba(109,40,217,.11));font-weight:800;box-shadow:inset 3px 0 0 var(--c1)}
  #tabbar button.on::after{display:none}
  #tabbar button:not(.on):hover{background:var(--surf-3);color:#1e293b}
  #tabbar button.on .ic{filter:drop-shadow(0 2px 4px rgba(30,58,138,.3))}
  /* 主内容区放开宽度 */
  #main{margin-left:var(--sidebar-w);max-width:none;padding:16px 28px 32px}
  #foot{margin-left:var(--sidebar-w)}
  /* 更新横幅让出侧边栏 */
  #upd{left:var(--sidebar-w)}
  /* 下拉刷新为移动手势，桌面隐藏 */
  #ptr{display:none}
  /* 桌面专属：表格 / 横向滚动放开 */
  .tbl-wrap{overflow:visible}
  .tbl-wrap table{min-width:0}
  .hs-wrap{overflow:visible}
  .hs-table{min-width:100%}
  /* 桌面专属：卡片密度与悬浮 */
  .card:hover,.panel:hover{box-shadow:var(--sh-card),0 14px 34px -20px rgba(30,58,138,.28)}
  tr.rowc:hover{background:#f5f7ff}
tr.rowc:active{background:#eef2ff}
  .chip:hover{box-shadow:0 3px 10px rgba(15,23,42,.12)}
  /* 首页 dashboard：双栏成对 */
  #main[data-view="ov"]{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  #main[data-view="ov"] > .card{grid-column:span 1}
  #main[data-view="ov"] > .now-card,
  #main[data-view="ov"] > .wx-card,
  #main[data-view="ov"] > .nw-card,
  #main[data-view="ov"] > .quick,
  #main[data-view="ov"] > .card.full{grid-column:1/-1}
  /* 更大字号与行高（桌面阅读） */
  body{font-size:15px}
  .card h3{font-size:16px}
}
/* 中屏（平板横屏）轻微加宽，仍是单栏 */
@media (min-width:768px) and (max-width:1023px){
  #main{max-width:880px;padding:14px 16px 76px}
}

/* ===================== 2026-11-08 系统优化：质感 · 层次 · 命令面板 ===================== */
/* 更克制的高级投影：多层、低透明、冷调长投影，营造"浮起"而非"贴阴影" */
:root{
  --sh-1:0 1px 2px rgba(15,23,42,.045);
  --sh-2:0 20px 44px -24px rgba(30,58,138,.20);
  --ring:0 0 0 3px rgba(30,58,138,.12);
}
.card{box-shadow:var(--sh-1),var(--sh-2),inset 0 1px 0 rgba(255,255,255,.65);border:1px solid rgba(15,23,42,.055)}
.panel{box-shadow:var(--sh-1),var(--sh-2),inset 0 1px 0 rgba(255,255,255,.65);border:1px solid rgba(15,23,42,.05)}
.kpi{box-shadow:var(--sh-1),var(--sh-2);background:linear-gradient(180deg,#ffffff,#f8fafd);border:1px solid rgba(15,23,42,.05)}
/* 卡片标题：3px 圆角短条，比 4px 方条更精致 */
.card h3::before{width:3px;height:15px;border-radius:2px}
/* 此刻主卡：更鲜明的签名式高光 + 实时状态点 */
.now-card{background:linear-gradient(150deg,#eef3ff 0%,#f7faff 55%,#eef6ff 100%);border:1.5px solid #d4e2ff}
.now-hd .now-pill{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;border:1px solid transparent;display:inline-flex;align-items:center;gap:4px}
.now-hd .now-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.now-pill.live{background:rgba(34,197,94,.14);color:#15803d;border-color:rgba(34,197,94,.32)}
.now-pill.soon{background:rgba(245,158,11,.16);color:#b45309;border-color:rgba(245,158,11,.34)}
.now-pill.off{background:#eef2f7;color:#64748b;border-color:#e2e8f0}
/* 泗洪天气卡 */
.wx-card{background:linear-gradient(150deg,#e8f1ff 0%,#f3f8ff 55%,#eaf4ff 100%);border:1.5px solid #cfe0ff}
.wx-hd{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:2px}
.wx-hd .wx-loc{display:flex;align-items:center;gap:5px}
.wx-hd .wx-up{font-size:10.5px;font-weight:700;color:var(--mut)}
.wx-main{display:flex;align-items:center;gap:14px;padding:6px 2px 4px}
.wx-emoji{font-size:46px;line-height:1;filter:drop-shadow(0 3px 5px rgba(30,58,138,.18))}
.wx-temp{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:-1px}
.wx-rt{flex:1;min-width:0}
.wx-rt .wx-txt{font-size:15px;font-weight:800;color:var(--ink)}
.wx-rt .wx-feel{font-size:12px;color:var(--mut);font-weight:700;margin-top:2px}
.wx-meta{display:flex;gap:16px;padding:10px 2px 11px;border-top:1px dashed #cfdcf2;margin-top:2px}
.wx-meta span{font-size:12px;color:#475569;font-weight:700;display:flex;align-items:center;gap:5px}
.wx-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.wx-fore{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wx-fore .wf{display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.8);border-radius:12px;padding:8px 4px}
.wx-fore .wf-d{font-size:11px;font-weight:800;color:var(--mut)}
.wx-fore .wf-e{font-size:22px;line-height:1}
.wx-fore .wf-t{font-size:11px;font-weight:700;color:#475569;font-variant-numeric:tabular-nums}
.wx-loading,.wx-err{padding:22px 4px;text-align:center;color:var(--mut);font-size:13px;font-weight:700}
.wx-err a{cursor:pointer;color:var(--c1);text-decoration:underline}
/* 新闻日报入口卡 + 浮层 */
.nw-card{display:flex;align-items:center;gap:12px;cursor:pointer;background:linear-gradient(150deg,#fff4ea 0%,#fff9f3 55%,#fff2e6 100%);border:1.5px solid #ffd9bf}
.nw-card:active{transform:scale(.99)}
.nw-ic{font-size:24px;line-height:1;filter:drop-shadow(0 2px 4px rgba(180,83,9,.18))}
.nw-tx{flex:1;min-width:0}
.nw-t{font-size:14px;font-weight:800;color:#9a3412}
.nw-s{font-size:11.5px;font-weight:700;color:#b45309;margin-top:2px}
.nw-go{font-size:22px;font-weight:800;color:#ea580c;opacity:.6}
@media(hover:hover){.nw-card:hover{box-shadow:0 14px 30px -16px rgba(234,88,12,.5),inset 0 1px 0 #fff}.nw-go{opacity:1;transform:translateX(2px);transition:transform .16s var(--ease)}}
.modal{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.62);display:none;flex-direction:column}
.modal.show{display:flex;animation:paFade .15s ease both}
.modal-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#0f1115;color:#e6e6e6;flex:0 0 auto}
.modal-bar .m-t{flex:1;font-weight:800;font-size:14px;letter-spacing:1px}
.modal-bar .m-btn{color:#e6e6e6;background:#1c2029;border:1px solid #2a2f3a;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.modal-bar .m-btn:active{transform:scale(.96)}
@media(hover:hover){.modal-bar .m-btn:hover{background:#2a2f3a;border-color:#3a4150;transform:translateY(-1px)}}
.modal iframe{flex:1;width:100%;border:0;background:#0f1115}
/* 底部"下滑查看更多"提示：化解末卡被裁切的廉价感 */
.ov-end{display:flex;align-items:center;justify-content:center;gap:8px;color:#aeb8c8;font-size:11.5px;font-weight:700;padding:8px 0 2px;letter-spacing:.3px}
.ov-end::before,.ov-end::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,#cbd5e1)}
.ov-end::after{transform:scaleX(-1)}
/* ---------- 命令面板（Ctrl/Cmd+K） ---------- */
#palette{position:fixed;inset:0;z-index:260;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:14vh 14px 14px}
#palette.show{display:flex;animation:paFade .15s ease both}
@keyframes paFade{from{opacity:0}to{opacity:1}}
.pa-box{width:100%;max-width:520px;background:#fff;border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden;animation:paUp .2s var(--ease) both}
@keyframes paUp{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.pa-in{display:flex;align-items:center;gap:10px;padding:15px 17px;border-bottom:1px solid #eef1f6}
.pa-in .pi{font-size:18px;opacity:.45}
.pa-in input{flex:1;border:none;outline:none;font-size:16px;background:transparent;color:var(--ink);font-family:inherit}
.pa-list{max-height:54vh;overflow:auto;padding:6px}
.pa-hd{font-size:11px;font-weight:800;color:#94a3b8;letter-spacing:.5px;padding:9px 13px 5px;text-transform:none}
.pa-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;cursor:pointer}
.pa-item .pa-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:#f1f5f9;flex-shrink:0}
.pa-item .pa-tx{flex:1;min-width:0}
.pa-item .pa-t{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa-item .pa-s{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pa-item.on{background:linear-gradient(135deg,rgba(30,58,138,.09),rgba(109,40,217,.09));box-shadow:inset 3px 0 0 var(--c1)}
.pa-item.on .pa-ic{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.pa-empty{padding:32px;text-align:center;color:var(--mut);font-size:13px}
.pa-foot{display:flex;gap:16px;padding:9px 15px;border-top:1px solid #eef1f6;font-size:11px;color:#94a3b8}
.pa-foot kbd{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:5px;padding:1px 6px;font-family:inherit;font-size:10.5px;font-weight:700;color:#475569;margin:0 1px}
@media (max-width:1023px){#palette{padding-top:11vh}}
</style>
</head>

/* 班内后1/4弱科：返回 {name:[subj...]} */
function computeWeak(stus){
  const out={};
  SUBJ_SCORED.forEach(sub=>{
    const arr=stus.map(s=>({n:s.n,v:s.s&&s.s[sub]})).filter(o=>o.v!=null&&!isNaN(o.v)).sort((a,b)=>a.v-b.v);
    if(arr.length<4)return;
    const cut=Math.floor(arr.length/4);
    const th=arr[cut].v;
    arr.forEach(o=>{if(o.v<=th){if(!out[o.n])out[o.n]=[];out[o.n].push(sub);}});
  });
  return out;
}
function edgeTag(z,ben,benke){
  if(z==null||isNaN(z))return "x";
  if(ben!=null){
    if(z>=ben+10)return "y";          /* 稳达本一：超本一线 10 分以上 */
    if(z>=ben)return "u";             /* 本一线上 10 分临界（0~10 分） */
    if(z>=ben-10)return "d";          /* 本一线下 10 分临界 */
  }
  if(benke!=null&&z>=benke)return "b";  /* 达本科（未达本一） */
  return "n";  /* 未达本科 */
}
/* 根据现有 examOrder 重算所有考试的 histQ / p(进步) / avgQ（基线=上一场，逐场环比） */
function recomputeTrail(){
  const exs=EXAMS();if(!exs.length)return;
  exs.forEach((e,i)=>{
    const E=DATA.exams[e];const ref=i>0?DATA.exams[exs[i-1]]:E;const rh={};
    (E.students||[]).forEach(s=>{const r=ref.students.find(x=>x.n===s.n);rh[s.n]={z:r&&r.z!=null?r.z:null,r:r&&r.r!=null?r.r:null};});
    E.histQ=rh;
    E.stats.avgQ=(i>0?(ref.stats.avg):E.stats.avg);
    E.students.forEach(s=>{s.p=(i>0&&rh[s.n]&&rh[s.n].r!=null&&s.r!=null)?(rh[s.n].r-s.r):null;});
  });
}

let ptrActive=false,ptrDrag=false,ptrStartY=0,ptrPull=0;const PTR_MAX=84,PTR_TH=54;

  if(s==="idle"){b.style.height="0px";}

  const glide=()=>{

  },{passive:true});

function bindScrollFade(el,dark){

  const W=50;
  const place=()=>{const t=el.offsetTop,h=el.offsetHeight;
    const left=el.offsetLeft+el.clientWidth-W, rightEdge=el.offsetLeft;

  const upd=()=>{const max=el.scrollWidth-el.clientWidth,x=el.scrollLeft; r.classList.toggle("show",x<max-1); l.classList.toggle("show",x>1);};
  place(); upd();

function schedNow(){
  const sc=(DATA.meta&&DATA.meta.sched)||null;
  if(!sc)return {cur:null,nxt:null};
  const items=[];sc.groups.forEach(g=>g.items.forEach(it=>items.push(it)));
  const n=new Date(),nm=n.getHours()*60+n.getMinutes();
  let idx=-1;
  for(let i=0;i<items.length;i++){
    const s=items[i].s;if(s==null)continue;
    let e=items[i].e;
    if(e==null){e=1440;for(let j=i+1;j<items.length;j++){if(items[j].s!=null){e=items[j].s;break;}}}
    if(nm>=s&&nm<e){idx=i;break;}
  }
  const nxt=idx>=0?(items.slice(idx+1).find(x=>x.s!=null)||null):null;
  return {cur:idx>=0?items[idx]:null,nxt:nxt};
}

function profileDiag(s){
  const cur=CUR_EXAM, subs=SUBJ_SCORED.filter(x=>s.s[x]!=null);

  const rk=sub=>{const m=rankMap(cur,sub);return m[s.n]!=null?m[s.n]:null;};
  let best=subs[0],worst=subs[0];
  subs.forEach(sub=>{if(rate(sub)>rate(best))best=sub;if(rate(sub)<rate(worst))worst=sub;});
  const seg=[];
  if(s.r!=null)seg.push(`班内第 <b>${s.r}</b> 名`);
  if(s.l!=null)seg.push(`理科第 <b>${s.l}</b> 名`);

  if(s.p!=null)prog=s.p>0?`较上场 <b class="tag-up">进步 ${s.p} 名</b> 👏`:s.p<0?`较上场 <b class="tag-down">退步 ${-s.p} 名</b>`:`较上场 <b>持平</b>`;
  const bestTxt=best?`强势 <b style="color:${SCOL[best]}">${best}</b>（班内第${rk(best)}，得分率${rate(best)}%）`:'';
  const weakTxt=worst&&worst!==best?`薄弱 <b style="color:${SCOL[worst]}">${worst}</b>（班内第${rk(worst)}${((s.w||[]).includes(worst))?'，弱科⚠':''}）`:'';

  return {loc:seg.join(' · '),prog,bestTxt,weakTxt,edge:edgeMap[s.e]||'',best,worst};
}

function subjDetailTable(s,best,worst){

/* ---------- 座位：AI 智能排座 + 手动调整 + 导出PDF ---------- */
function seatData(){ return SEAT_WORK || DATA.seat; }
function loadSeatFromLS(){ const s=LS(_seatKey,null); if(s&&s.rows&&s.front) SEAT_WORK=s; }
function saveSeatToLS(){ if(SEAT_WORK) LSset(_seatKey, SEAT_WORK); }
function cloneSeat(st){ return {rows:st.rows.map(r=>r.slice()), front:st.front.slice()}; }
function seatStudents(st){
  const names=[];
  st.rows.forEach(r=>r.slice(1).forEach(n=>{ if(n&&n!=="空座") names.push(n); }));
  st.front.forEach(n=>{ if(n&&n!=="空座") names.push(n); });
  return names;
}
/* AI 排座 v2：女生前排 · 男生后排 · 强弱同桌（性别按姓名推断，编辑模式可点♀/♂纠正） */
function aiArrangeSeats(){
  const base=DATA.seat;
  const names=seatStudents(base);
  if(!names.length){ toast("无在座学生"); return; }
  const info=names.map(n=>{
    const s=byN(n)||{};
    const z=(s.z!=null&&!isNaN(s.z))?+s.z:0;
    const rk=(s.r!=null&&!isNaN(s.r))?+s.r:9999;
    const g=genderOf(n);                                   /* f / m / ? */
    return {n,z,rk,g};
  });
  const byScore=a=>a.slice().sort((x,y)=>y.z-x.z);          /* 总分 高→低 */
  const girls=byScore(info.filter(x=>x.g==="f"));
  const boys =byScore(info.filter(x=>x.g==="m"));
  const unk  =byScore(info.filter(x=>x.g!=="f"&&x.g!=="m"));
  /* 组内强弱互补：相邻两座位一强一弱（首尾交错）；最终取姓名字符串入座 */
  const pairUp=arr=>{const o=[];let i=0,j=arr.length-1;while(i<=j){o.push(arr[i].n);if(i!==j)o.push(arr[j].n);i++;j--;}return o;};
  /* 女生优先占前排、男生落后排；性别未知者居中填充 */
  const flat=[...pairUp(girls), ...pairUp(unk), ...pairUp(boys)];
  /* 槽位顺序：讲台前2座 → 第1排…第7排（越近讲台越先填） */
  const empty=new Set();
  base.rows.forEach((r,ri)=>r.forEach((n,ci)=>{ if(n==="空座") empty.add(ri+":"+ci); }));
  base.front.forEach((n,fi)=>{ if(n==="空座") empty.add("f:"+fi); });
  const slots=[];
  base.front.forEach((n,fi)=>slots.push({k:"f:"+fi}));
  for(let ri=base.rows.length-1; ri>=0; ri--)
    for(let ci=1; ci<base.rows[ri].length; ci++) slots.push({k:ri+":"+ci});
  const newRows=base.rows.map(r=>r.slice()), newFront=base.front.slice();
  const set=(k,v)=>{ if(k[0]==="f") newFront[+k.slice(2)]=v; else { const [a,b]=k.split(":"); newRows[+a][+b]=v; } };
  let pi=0;
  for(const s of slots){
    if(empty.has(s.k)){ set(s.k,"空座"); continue; }
    set(s.k, pi<flat.length?flat[pi++]:"空座");
  }
  SEAT_WORK={rows:newRows, front:newFront};
  saveSeatToLS(); SEAT_MODE="view"; SEAT_SEL=null;
  const gN=girls.length, bN=boys.length, uN=unk.length;
  toast(`🤖 已排：女生前排${gN}·男生后排${bN}·强弱同桌${uN?`·性别未知${uN}(编辑模式点♀/♂纠正)`:""}`);
  refresh();
}
function seatSwapIn(work,a,b){
  const sw=arr=>{ for(let i=0;i<arr.length;i++){ if(arr[i]===a)arr[i]=b; else if(arr[i]===b)arr[i]=a; } };
  work.rows.forEach(sw); sw(work.front);
}
function seatTap(n){
  if(SEAT_SEL===null){ SEAT_SEL=n; toast("已选 "+n+" · 再点一个座位交换"); refresh(); return; }
  if(SEAT_SEL===n){ SEAT_SEL=null; refresh(); return; }
  const work=SEAT_WORK||cloneSeat(seatData());
  seatSwapIn(work, SEAT_SEL, n);
  SEAT_WORK=work; saveSeatToLS();
  const a=SEAT_SEL; SEAT_SEL=null; toast("已交换 "+a+" ↔ "+n); refresh();
}
function seatToggleEdit(){ SEAT_MODE = SEAT_MODE==="edit"?"view":"edit"; SEAT_SEL=null; refresh(); }
function seatExportPDF(){ window.print(); }
/* 编辑模式：长按座位（>480ms）切换性别，普通点按仍为选座交换 —— 与选座点击彻底分离，杜绝误触 */
let _seatLP=null;
function seatPD(e,n){
  if(SEAT_MODE!=="edit")return;
  if(_seatLP)clearTimeout(_seatLP.t);
  _seatLP={n,t:setTimeout(()=>{ if(_seatLP&&_seatLP.n===n){_seatLP.flipped=true; seatFlipGender(n);} },480), sx:e.clientX, sy:e.clientY, flipped:false, moved:false};
}
function seatPM(e,n){
  if(!_seatLP||_seatLP.n!==n)return;
  if(Math.abs(e.clientX-_seatLP.sx)>8||Math.abs(e.clientY-_seatLP.sy)>8){_seatLP.moved=true;clearTimeout(_seatLP.t);}
}
function seatPU(e,n){
  if(!_seatLP||_seatLP.n!==n)return;
  clearTimeout(_seatLP.t);
  if(SEAT_MODE==="edit"&&!_seatLP.flipped&&!_seatLP.moved) seatTap(n);
  _seatLP=null;
}
function seatPC(n){ if(_seatLP&&_seatLP.n===n){clearTimeout(_seatLP.t);_seatLP=null;} }
function resetSeat(){ SEAT_WORK=null; SEAT_SEL=null; SEAT_MODE="view"; try{localStorage.removeItem(_seatKey);}catch(e){} toast("已恢复初始座位"); refresh(); }

/* ---------- 历次成绩总表（按最新成绩排序 + 色阶 + 班级/年级排名 + 迷你走势） ---------- */
let CUR_HSUB="总分";
function heatColor(v,mn,mx){if(v==null||!isFinite(v))return null;const t=mx>mn?(v-mn)/(mx-mn):.5;const c1=[224,90,71],c2=[255,214,90],c3=[102,187,106];const mix=(a,b,f)=>a.map((x,i)=>Math.round(x+(b[i]-x)*f));const rgb=t<.5?mix(c1,c2,t*2):mix(c2,c3,(t-.5)*2);return `rgb(${rgb.join(",")})`;}
function fillGaps(a){const out=a.slice();let last=null;for(let i=0;i<out.length;i++){if(out[i]==null){const nx=out.slice(i+1).find(v=>v!=null);out[i]=last!=null?last:(nx!=null?nx:null);}else last=out[i];}return out.filter(v=>v!=null);}
function hsRows(){
  const sub=CUR_HSUB,getv=st=>sub==="总分"?st.z:(st.s?st.s[sub]:null);
  const exs=EXAMS(),lastE=EX();
  const rows=lastE.students.map(s=>{
    const vals=exs.map(e=>{const st=(DATA.exams[e].students||[]).find(x=>x.n===s.n);return st?getv(st):null;});
    return {name:s.n,vals,latest:vals[vals.length-1]};
  });
  // 最新一场班内排名：总分用官方班名，单科现场计算（同分同名次）
  if(sub==="总分"){rows.forEach(r=>{const st=lastE.students.find(x=>x.n===r.name);r.rank=(st&&st.r!=null)?st.r:null;r.gr=(st&&st.l!=null)?st.l:null;});}
  else{
    const arr=rows.filter(r=>r.latest!=null).sort((a,b)=>b.latest-a.latest);
    const rk={};let pv=null,pk=0;
    arr.forEach((r,i)=>{if(pv!==null&&r.latest===pv)rk[r.name]=pk;else{pk=i+1;rk[r.name]=pk;pv=r.latest;}});
    rows.forEach(r=>{r.rank=rk[r.name]||null;r.gr=null;});
  }
  rows.sort((a,b)=>{const na=a.latest==null||(typeof a.latest==="number"&&a.latest!=a.latest);const nb=b.latest==null||(typeof b.latest==="number"&&b.latest!=b.latest);if(na&&nb)return 0;if(na)return 1;if(nb)return -1;return b.latest-a.latest;});
  return rows;
}
function setHS(x){CUR_HSUB=x;refresh();}
function vHist(){
  const exs=EXAMS(),sub=CUR_HSUB,last=exs[exs.length-1];
  const rows=hsRows();
  const all=rows.flatMap(r=>r.vals).filter(v=>v!=null&&isFinite(v));
  const mn=all.length?Math.min.apply(null,all):0,mx=all.length?Math.max.apply(null,all):1;
  const cr=exs.map(e=>rankMap(e,sub));      // 每场班内排名
  const gm=exs.map(e=>gradeMap(e));          // 每场年级（理科）名次
  let h=`<div class="card"><h3>📋 历次成绩总表</h3>
    <div class="hs-chips">${["总分"].concat(SUBJ_SCORED).map(x=>`<button class="${x===sub?"on":""}" onclick="setHS('${x}')">${x}</button>`).join("")}</div>
    <div class="note" style="margin:6px 0 0">按<b>最新一场（${last}）${sub}成绩</b>由高到低排名 · 每格含<b>分数</b>（底色 绿高→红低）+<b>班排 / 年级排</b> · 表格<b>左右滑动</b>查看</div></div>`;
  h+=`<div class="panel"><div class="hs-wrap"><table class="hs-table">
    <thead><tr><th class="hs-rk">名次</th><th class="hs-name">姓名</th>${exs.map(e=>`<th title="${e}">${shortEx(e)}</th>`).join("")}<th>走势</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const tds=r.vals.map((v,j)=>{
      const bg=heatColor(v,mn,mx);

      return `<td class="hs-td"${bg?` style="background:${bg}"`:""}>${v!=null?`<b>${v}</b>`:`<span style="color:#cbd5e1">—</span>`}${sub2?`<span class="hs-rkmini">${sub2}</span>`:""}</td>`;
    }).join("");
    const sp=fillGaps(r.vals);
    h+=`<tr><td class="hs-rk">${r.latest!=null?i+1:"—"}</td><td class="hs-name">${r.name}</td>${tds}<td><canvas id="hsSp${i}" class="hs-spark" height="30" style="width:96px;height:30px" data-sp='${JSON.stringify(sp)}'></canvas></td></tr>`;
  });
  h+=`</tbody></table></div>
    <div class="hs-foot">每格：<b>分数</b>（底色绿高→红低）· <b>班X</b>=该场班内名次（<b>统一按当前16班口径</b>排名，含高二四场均在现班${stu().length}人内；单科按分数同分同名次）· <b>年X</b>=年级理科名次 · 走势=历次${sub}分数迷你折线</div></div>`;
  rows.forEach((r,i)=>{const sp=fillGaps(r.vals);if(sp.length>=2)chartDraw("hsSp"+i,{color:"#1e3a8a",data:sp},drawSpark);});

}

  if(!HW.length) h+=`<div class="empty">暂无作业记录，先添加一条。</div>`;

      <div class="hw-rec-head" onclick="hwToggleCollapse(${it.id})">

        </div>

      ${it.audience&&it.audience.length?`<div class="hw-rec-aud">面向 ${it.audience.length} 人</div>`:''}

          <button class="bigbtn" style="background:#fff" onclick="hwClear(${it.id})">🧹 全部未交</button>
          <button class="act-btn" onclick="hwExport(${it.id})"><span class="ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg></span><span class="lb">导出本记录</span></button>
          ${undone.length?`<button class="bigbtn" style="background:#ffebee;border-color:#ef5350;color:#c62828" onclick="hwPenalty(${it.id})">未交${undone.length}人 · 扣分</button>`:''}
          <button class="bigbtn" style="background:#fff;color:#ef5350;border-color:#fecaca;flex:0;min-width:72px" onclick="hwDel(${it.id})">删除</button>
        </div>
        <div class="hw-grid ${gridCls}">`;
    aud.forEach(n=>{
      const on=done.has(n);
      const cls=isPraise?"hw-chip":isCritic?"hw-chip":(on?"hw-chip done":"hw-chip");
      const fn=isPraise?`hwPraise('${n}')`:isCritic?`hwCritic('${n}')`:`hwToggle(${it.id},'${n}')`;
      h+=`<span class="${cls}" onclick="${fn}">${n}</span>`;
    });
    h+=`</div>`;
    if(it.penalty) h+=`<div class="hw-penalty">已执行未交扣分：${it.penalty} 分/人</div>`;
    h+=`</div></div>`;
  });
  return h;
}

/* ---------- 数据导入（零依赖：CSV / XLSX / JSON 完整包） ---------- */
function decodeEnt(s){return (s||"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/&amp;/g,"&");}
function detectDelim(text){const fl=(text.split(/\r?\n/).find(l=>l.trim()!=="")||"");const cs=[",","\t",";","|"];let best=",",bc=0;cs.forEach(d=>{const c=fl.split(d).length;if(c>bc){bc=c;best=d;}});return best;}
function parseCSV(text){
  text=text.replace(/^﻿/,"");const d=detectDelim(text);
  const rows=[];let row=[],f="",i=0,q=false,n=text.length;
  while(i<n){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i+=2;continue;}q=false;i++;continue;}f+=c;i++;continue;}
    if(c==='"'){q=true;i++;continue;}
    if(c===d){row.push(f);f="";i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f="";i++;continue;}
    f+=c;i++;}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>(x||"").trim()!==""));
}
/* XLSX：ZIP 解析 + XML 解析 + DecompressionStream 解压（尽力而为，离线可用） */

    const nameLen=(b[p+28]|(b[p+29]<<8));

    const commLen=(b[p+32]|(b[p+33]<<8));

function parseSharedStrings(xml){const out=[];const re=/<si>([\s\S]*?)<\/si>/g;let m;while((m=re.exec(xml))){const inner=m[1];const ts=[...inner.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]);out.push(decodeEnt(ts.join("")));}return out;}

    cells.forEach(c=>{const ref=c[1],attrs=c[2]||"",inner=c[3]||"",ci=colIdx(ref);let val="";const t=(attrs.match(/t="([^"]+)"/)||[])[1];

function detectImportMap(header){

function buildExamFromRows(rows,map,ben,benke){
  const rnd=x=>Math.round(x*10)/10;
  const raw=rows.slice(1).map(r=>{const nm=(r[map.name]||"").trim();if(!nm)return null;
    const s={};SUBJ_SCORED.forEach(sub=>{const i=map.subs[sub];const v=i!=null?parseFloat(r[i]):NaN;s[sub]=isNaN(v)?null:v;});
    let z=map.z!=null&&r[map.z]!==""&&r[map.z]!=null?parseFloat(r[map.z]):NaN;
    if(isNaN(z)){let sum=0,has=false;SUBJ_SCORED.forEach(sub=>{if(s[sub]!=null){sum+=s[sub];has=true;}});z=has?sum:null;}
    return {n:nm,k:map.kao!=null?(r[map.kao]||"").trim():"",s,z,r:map.r!=null&&r[map.r]!==""?parseInt(r[map.r]):null,l:map.l!=null&&r[map.l]!==""?parseInt(r[map.l]):null};
  }).filter(Boolean);

  const weak=computeWeak(uniq);

  uniq.sort((a,b)=>(a.r||999)-(b.r||999));
  const vals=uniq.map(x=>x.z).filter(v=>v!=null);
  const avg=vals.length?rnd(vals.reduce((a,b)=>a+b,0)/vals.length):0;
  const subAvg={};SUBJ_SCORED.forEach(sub=>{const vv=uniq.map(x=>x.s[sub]).filter(v=>v!=null);subAvg[sub]=vv.length?rnd(vv.reduce((a,b)=>a+b,0)/vv.length):0;});
  const byEdge={y:0,u:0,d:0,b:0,n:0,x:0};const subWeak={};SUBJ_SCORED.forEach(s=>subWeak[s]=[]);
  uniq.forEach(x=>{x.e=edgeTag(x.z,ben,benke);byEdge[x.e]=(byEdge[x.e]||0)+1;x.w=weak[x.n]||[];x.p=null;x.m=0;x.l=x.l==null?null:x.l;if(x.w.length)subWeak&&x.w.forEach(s=>{if(subWeak[s]&&!subWeak[s].includes(x.n))subWeak[s].push(x.n);});});

    const stat=stu().map(s=>{let j=0;REC.forEach(it=>(it.done||[]).includes(s.n)&&j++);return {n:s.n,j};}).sort((a,b)=>b.j-a.j);

function vTodo(){
  const L=LS("g16_todo",[]);

  return h;
}

    </div>

    h+=`</div><div style="margin-top:10px"><button class="sel" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:42px" onclick="RAND_DRAWN.clear();refresh()">🔄 重置本轮</button></div></div>`;
  }

  return h;

function randDraw(){
  const names=stu().map(s=>s.n);
  let pool=names;
  if(RAND_NOREP){
    pool=names.filter(n=>!RAND_DRAWN.has(n));
    if(!pool.length){RAND_DRAWN.clear();pool=names;toast("🔄 已全部抽完，开始新的一轮");}
  }
  const mask=document.getElementById("randMask");
  const nmEl=document.getElementById("randName");
  const subEl=document.getElementById("randSub");
  mask.classList.add("show");nmEl.classList.remove("pop");subEl.textContent="随机抽取中…";
  let tick=setInterval(()=>{nmEl.textContent=pool[Math.floor(Math.random()*pool.length)];},60);
  const stop=setTimeout(()=>{
    clearInterval(tick);
    const pick=pool[Math.floor(Math.random()*pool.length)];
    nmEl.textContent=pick;nmEl.classList.add("pop");
    subEl.textContent=`已抽到 ${RAND_DRAWN.size+1} 人次`;
    RAND_DRAWN.add(pick);
    refresh();
  },1500);
  mask._tick=tick;mask._stop=stop;
}
function randClose(){const mask=document.getElementById("randMask");clearInterval(mask._tick);clearTimeout(mask._stop);mask.classList.remove("show");}

(function(){const z={};TT_PERIODS.forEach(p=>z[p]={subj:"自习",teacher:""});["周六","周日"].forEach(d=>TT_DEF[d]=JSON.parse(JSON.stringify(z)));})();
function ttDefault(){const grid={};
  TT_DAYS.forEach(d=>{grid[d]={};TT_PERIODS.forEach(p=>grid[d][p]=null);});
  Object.entries(TT_DEF).forEach(([d,ps])=>Object.entries(ps).forEach(([p,c])=>{grid[d][p]={subj:c.subj,teacher:c.teacher||""};}));
  return {days:TT_DAYS.slice(0),periods:TT_PERIODS,grid};}
function getTT(){let t=LS("g16_tt",null);
  /* 新BUILD发布后以注入课表为准自动刷新（修复旧缓存缺晚自习等问题）；同BUILD内手工编辑保留 */
  if(DATA.meta&&DATA.meta.tt&&LS("g16_tt_b")!==BUILD){t=DATA.meta.tt;LSset("g16_tt",t);LSset("g16_tt_b",BUILD);return t;}
  if(!t){const d=DATA.meta.tt||ttDefault();LSset("g16_tt",d);LSset("g16_tt_b",BUILD);return d;} /* 默认课表优先用注入的 meta.tt（如8班从年级课表提取），缺省回退写死的16班课表 */
  if(t&&t.grid&&t.periods&&t.days&&t.days.length){
    if(t.periods.length!==TT_PERIODS.length){const d=ttDefault();LSset("g16_tt",d);return d;} /* 节次结构升级，自动刷新为最新课表 */
    let ch=false; /* 迁移：补齐缺失天（如周六周日）与缺失节次 */
    TT_DAYS.forEach(d=>{if(!t.days.includes(d)){t.days.push(d);t.grid[d]={};TT_PERIODS.forEach(p=>{if(!t.grid[d][p])t.grid[d][p]=null;});ch=true;}});
    TT_PERIODS.forEach(p=>{if(!t.periods.includes(p)){t.periods.push(p);ch=true;}});
    if(ch)LSset("g16_tt",t);
    return t;
  }
  const d=ttDefault();LSset("g16_tt",d);return d;}
/* 计算当前时间所在：今天星期、当前节次、状态（in/between/before/after） */
function ttNowInfo(){const now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
  const DOW=["周日","周一","周二","周三","周四","周五","周六"];const today=DOW[now.getDay()];
  let cur=-1,status="rest";
  for(let i=0;i<TT_PERIODS.length;i++){const[s,e]=TT_TIMES[TT_PERIODS[i]];if(nowMin>=s&&nowMin<=e){cur=i;status="in";break;}}
  if(cur<0){const f=TT_TIMES[TT_PERIODS[0]][0],l=TT_TIMES[TT_PERIODS[TT_PERIODS.length-1]][1];
    status=nowMin<f?"before":nowMin>l?"after":"between";}
  return {nowMin,today,cur,status};}
let TT_FOCUS=null;
function vTimetable(){
  const t=getTT();const ni=ttNowInfo();
  const fmt=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  const subs=[...SUBS,...TT_EXTRA];
  let h=`<div class="card"><h3>🗓 课程表</h3>
    <div class="note" style="margin-bottom:8px">点单元格可编辑科目与任课教师；点上方学科标签可<b>高亮聚焦</b>该学科全部课程。红色横线为<b>当前时间定位线</b>。数据自动保存在本设备，<b>老师可直接手改</b>。</div>
    <div class="subj-chips">`;
  subs.forEach(s=>{const col=SCOL[s]||"#94a3b8";const on=TT_FOCUS===s;h+=`<span class="sc ${on?'on':''}" style="${on?`background:${col};border-color:${col}`:''}" onclick="ttFocus('${s}')">${s}</span>`;});
  h+=`<span class="sc" style="${TT_FOCUS?'background:var(--c1);color:#fff;border-color:var(--c1)':''}" onclick="ttFocus(null)">${TT_FOCUS?'✕ 取消聚焦':'全部'}</span></div>`;
  h+=`<div class="tt-wrap"><table class="tt-grid${t.days.length>5?" narrow":""}"><tr><th class="pr"></th>${t.days.map(d=>`<th class="${d===ni.today?'today':''}">${d}</th>`).join("")}</tr>`;
  t.periods.forEach((p,pi)=>{
    const tm=TT_TIMES[p]?fmt(TT_TIMES[p][0]):"";
    h+=`<tr><td class="pr">${p}<small>${tm}</small></td>`;
    t.days.forEach(d=>{
      const cell=t.grid[d]&&t.grid[d][p];
      const subj=cell?cell.subj:null;
      const dim=TT_FOCUS&&TT_FOCUS!==subj?"dim":"";
      const hot=TT_FOCUS&&TT_FOCUS===subj?"hot":"";
      const now=(d===ni.today&&pi===ni.cur)?"now":"";
      if(!subj)h+=`<td><div class="tt-cell empty ${dim} ${now}" onclick="ttEdit('${d}','${p}')">—</div></td>`;
      else{h+=`<td><div class="tt-cell ${dim} ${hot} ${now}" style="background:${SCOL[subj]||"#94a3b8"}" onclick="ttEdit('${d}','${p}')">${subj}<span class="tch">${cell.teacher||""}</span></div></td>`;}
    });
    h+=`</tr>`;
  });
  h+=`</table><div id="ttNowLine" class="tt-nowline"><span></span></div></div></div>`;
  h+=`<div class="toolbar" style="margin-top:8px">
    <button class="sel" onclick="ttCopyDay()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:44px">📋 复制某天</button>
    <button class="sel" onclick="ttReset()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:44px">🔄 清空重排</button>
    <button class="act-btn" onclick="exportTimetable()"><span class="ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg></span><span class="lb">导出Excel</span></button>
  </div>`;
  if(!TT_TIMER){TT_TIMER=setInterval(ttTick,30000);}  /* 进入课表页启动实时定位线（离开即由 go 清理） */
  setTimeout(ttTick,60);
  return h;
}
/* 在课表渲染后，按当前时间画出红色定位线（横贯全表，定位"现在"） */
function ttDrawNow(){
  const wrap=document.querySelector(".tt-wrap");if(!wrap)return;
  const tbl=wrap.querySelector(".tt-grid");if(!tbl)return;
  const rows=[...tbl.querySelectorAll("tr")];if(rows.length<2)return;
  const line=document.getElementById("ttNowLine");if(!line)return;
  const wr=wrap.getBoundingClientRect();
  const top=y=>y.getBoundingClientRect().top-wr.top+wrap.scrollTop;
  /* 行 → 节次映射（按行首文本，防顺序错位） */
  const rowOf={},labels=[];
  rows.forEach(r=>{const td=r.querySelector("td.pr");if(!td)return;
    const lbl=(td.childNodes[0]&&td.childNodes[0].textContent||td.textContent).trim().split("\n")[0].trim();
    rowOf[lbl]=r;labels.push(lbl);});
  const dataRows=rows.filter(r=>r.querySelector("td.pr"));
  if(!dataRows.length)return;
  const first=dataRows[0],last=dataRows[dataRows.length-1];
  const ni=ttNowInfo();
  let y=null;
  if(ni.status==="before"){y=top(first);}
  else if(ni.status==="after"){y=top(last)+last.getBoundingClientRect().height;}
  else{
    for(let i=0;i<labels.length;i++){
      const tm=TT_TIMES[labels[i]];if(!tm)continue;
      const[s,e]=tm,r=rowOf[labels[i]];if(!r)continue;
      const rTop=top(r),rH=r.getBoundingClientRect().height;
      if(ni.nowMin<s){y=rTop;break;}                       /* 课间/午休：贴下一节行顶 */
      if(ni.nowMin<=e){y=rTop+Math.max(0,Math.min(1,(ni.nowMin-s)/(e-s)))*(rH-2);break;} /* 行内按时间比例 */
    }
    if(y===null)y=top(last)+last.getBoundingClientRect().height;
  }
  line.style.top=y+"px";
  line.style.width=tbl.offsetWidth+"px";
  const hh=String(Math.floor(ni.nowMin/60)).padStart(2,"0"),mm=String(ni.nowMin%60).padStart(2,"0");
  const tag=ni.status==="before"?"今日未开始":ni.status==="after"?"今日已结束":ni.status==="between"?`课间 ${hh}:${mm}`:`现在 ${hh}:${mm}`;
  line.querySelector("span").textContent=tag;
  line.style.display="block";
}
let TT_TIMER=null;
/* 平时课表：每30秒按当前时间重画红色定位线，停留跨节次后红线自动跟随 */
function ttTick(){if(CUR==="tt")ttDrawNow();}
function ttFocus(sub){TT_FOCUS=(TT_FOCUS===sub)?null:sub;refresh();}
function ttEdit(d,p){const t=getTT();const cur=(t.grid[d]&&t.grid[d][p])||{};const m=document.getElementById("ttModal");
  const opts=[...SUBS,...TT_EXTRA].map(s=>`<option ${cur.subj===s?"selected":""}>${s}</option>`).join("");
  m.querySelector(".ttbody").innerHTML=`
    <div style="font-size:15px;font-weight:800;margin-bottom:12px">${d} · ${p}</div>
    <div style="display:flex;flex-direction:column;gap:9px">
      <select class="sel" id="ttSubSel">${opts}</select>
      <input class="sel" id="ttTch" placeholder="任课教师（可选）" value="${esc(cur.teacher||"")}">
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="bigbtn" style="flex:1;background:#fff;color:#ef5350;border-color:#fecaca" onclick="ttClearCell('${d}','${p}')">清空</button>
      <button class="bigbtn" style="flex:2;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:none;font-weight:700" onclick="ttSaveCell('${d}','${p}')">保存</button>
    </div>`;
  m.classList.add("show");
}
function ttSaveCell(d,p){const subj=document.getElementById("ttSubSel").value;const teacher=document.getElementById("ttTch").value.trim();const t=getTT();if(!t.grid[d])t.grid[d]={};if(subj==="空")t.grid[d][p]=null;else t.grid[d][p]={subj,teacher};LSset("g16_tt",t);document.getElementById("ttModal").classList.remove("show");toast("🗓 已保存");refresh();}
function ttClearCell(d,p){const t=getTT();if(t.grid[d])t.grid[d][p]=null;LSset("g16_tt",t);document.getElementById("ttModal").classList.remove("show");refresh();}
function ttReset(){if(!confirm("确定清空整张课程表？"))return;const d=ttDefault();LSset("g16_tt",d);TT_FOCUS=null;refresh();}
function ttCopyDay(){const t=getTT();const from=prompt("复制哪一天？（如：周一）",t.days[0]||"周一");if(!from||!t.grid[from]){alert("未找到该天");return;}const to=prompt("复制到哪一天？（如：周二）",t.days[1]||"周二");if(!to||!t.grid[to]){alert("未找到目标天");return;}t.grid[to]=JSON.parse(JSON.stringify(t.grid[from]));LSset("g16_tt",t);toast(`已复制 ${from} → ${to}`);refresh();}

/* ---------- 作息时间表（数据来自 DATA.meta.sched，随《作息时间表》文件更新） ---------- */
let ZX_TIMER=null;
function vZuoxi(){
  const sc=(DATA.meta&&DATA.meta.sched)||null;
  if(!sc)return `<div class="card"><h3>🕐 作息时间表</h3><div class="note">暂无作息数据</div></div>`;
  let h=`<div class="card"><h3>🕐 ${esc(sc.title)}</h3>
    <div class="zx-phase">当前：<b id="zxPhase">—</b></div>
    <div class="note" style="margin:6px 0 12px">${esc(sc.subtitle)} · 红色高亮为<b>当前进行中</b>时段，每30秒自动刷新</div>`;
  sc.groups.forEach(g=>{
    h+=`<div class="zx-grp"><div class="zx-pr">${esc(g.period)}</div><div class="zx-list">`;
    g.items.forEach(it=>{
      h+=`<div class="zx-row" data-s="${it.s==null?"":it.s}" data-e="${it.e==null?"":it.e}">
        <span class="zx-name">${esc(it.name)}</span>
        <span class="zx-time">${esc(it.time)}</span>
        <span class="zx-now">进行中</span>
      </div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  if(ZX_TIMER)clearInterval(ZX_TIMER);
  ZX_TIMER=setInterval(zxTick,30000);
  setTimeout(zxTick,30);
  return h;
}
function zxTick(){
  const rows=[...document.querySelectorAll(".zx-row")];if(!rows.length)return;
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const pts=rows.map(r=>({s:r.dataset.s?Number(r.dataset.s):null,e:r.dataset.e?Number(r.dataset.e):null}));
  let active=-1;
  for(let i=0;i<pts.length;i++){
    const s=pts[i].s;if(s==null)continue;
    let e=pts[i].e;
    if(e==null){for(let j=i+1;j<pts.length;j++){if(pts[j].s!=null){e=pts[j].s;break;}}if(e==null)e=1440;}
    if(nm>=s&&nm<e){active=i;break;}
  }
  rows.forEach((r,i)=>r.classList.toggle("now",i===active));
  const tag=document.getElementById("zxPhase");
  if(tag)tag.textContent=active>=0?rows[active].querySelector(".zx-name").textContent:"（非作息时段）";
}

/* ---------- 自动更新校验（保证打开即最新） ---------- */
async function checkUpdate(){
  if(location.protocol==="file:")return;   /* 本地/离线直接打开时不请求版本，避免无谓的 CORS 报错 */
  try{
    const r=await fetch("version.json?_="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const d=await r.json();
    if(d.build && d.build!==BUILD){
      const el=document.getElementById("upd");
      if(d.note)el.querySelector("small").textContent=d.note;
      el.style.display="block";
    }
  }catch(e){/* 离线 / 本地文件，忽略 */}
}
