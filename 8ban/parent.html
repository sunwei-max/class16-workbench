/* 可横滑容器右/左缘渐隐遮罩：内容溢出时显示，随滚动实时增减。遮罩挂在「不滚动」的父级上，
   用 el 的 offset 对齐到滚动容器自身的可视右/左缘（而非父级边缘），保证渐隐覆盖在真实内容区。 */
function bindScrollFade(el,dark){
  if(el.dataset.fadeBound)return; el.dataset.fadeBound="1";
  const host=el.parentElement; if(!host)return;
  const hcs=getComputedStyle(host); if(hcs.position==="static")host.style.position="relative";
  const r=document.createElement("div"); r.className="sc-fade sc-fade-r"+(dark?" onDark":"");
  const l=document.createElement("div"); l.className="sc-fade sc-fade-l"+(dark?" onDark":"");
  host.appendChild(r); host.appendChild(l);
  const W=50;
  /* 沿 offsetParent 链累加 offsetTop/offsetLeft，得到 el 相对 host 的精确偏移（免疫 offsetParent 错配与 CSS transform） */
  const offWithin=(c,a)=>{let top=0,left=0,n=c;while(n&&n!==a){top+=n.offsetTop;left+=n.offsetLeft;n=n.offsetParent;}return{top,left};};
  const place=()=>{const h=el.offsetHeight;
    const th=el.querySelector("thead");
    const off=offWithin(el,host);
    let top0=off.top, hgt=h;
    if(th&&th.offsetHeight){ const to=offWithin(th,host); top0=to.top+th.offsetHeight; const thBotInEl=(to.top+th.offsetHeight)-off.top+2; hgt=Math.max(0,h-thBotInEl); }   /* 浮标精确从表头底边之下开始，绝不上压表头/排序下拉 */
    const left=off.left+el.clientWidth-W, rightEdge=off.left;
    r.style.top=top0+"px"; r.style.left=left+"px"; r.style.width=W+"px"; r.style.height=hgt+"px";
    l.style.top=top0+"px"; l.style.left=rightEdge+"px"; l.style.width=W+"px"; l.style.height=hgt+"px";};
  const upd=()=>{const max=el.scrollWidth-el.clientWidth,x=el.scrollLeft; r.classList.toggle("show",x<max-1); l.classList.toggle("show",x>1);};
  place(); upd();
  el.addEventListener("scroll",upd,{passive:true});
  if(window.ResizeObserver){const ro=new ResizeObserver(()=>{place();upd();}); ro.observe(el); ro.observe(host);}
  requestAnimationFrame(place); setTimeout(place,320);   /* 入场动画/字体就绪后再校准一次 */
}

let ANIM_TIMER=null;

  M.innerHTML=VIEWS[CUR]();

}

/* ---------- 首页「此刻」：联动作息 / 课表 / 待办 / 作业（每分钟局部刷新，不整页重绘） ---------- */
function schedNow(){
  const sc=(DATA.meta&&DATA.meta.sched)||null;
  if(!sc)return {cur:null,nxt:null};
  const items=[];sc.groups.forEach(g=>g.items.forEach(it=>items.push(it)));
  const n=new Date(),nm=n.getHours()*60+n.getMinutes();
  let idx=-1;
  for(let i=0;i<items.length;i++){
    const s=items[i].s;if(s==null)continue;
    let e=items[i].e;
    if(e==null){e=1440;for(let j=i+1;j<items.length;j++){if(items[j].s!=null){e=items[j].s;break;}}}
    if(nm>=s&&nm<e){idx=i;break;}
  }
  const nxt=idx>=0?(items.slice(idx+1).find(x=>x.s!=null)||null):null;
  return {cur:idx>=0?items[idx]:null,nxt:nxt};
}
/* 下次上课提示：取作息表里最早一段的开始时间，周末→「周一 HH:MM」，工作日空闲→「明日 HH:MM」 */
function nextSchoolStart(){
  const sc=(DATA.meta&&DATA.meta.sched)||null; if(!sc)return "明日见";
  let mn=1441; sc.groups.forEach(g=>g.items.forEach(it=>{if(it.s!=null&&it.s<mn)mn=it.s;}));
  if(mn>1440)return "明日见";
  const hh=String(Math.floor(mn/60)).padStart(2,"0"), mm=String(mn%60).padStart(2,"0");
  const wd=new Date().getDay();            /* 0=周日 … 6=周六 */

  return `📅 ${day} ${hh}:${mm} 上课`;
}

/* 泗洪天气（Open-Meteo，免费无需 key，支持 CORS，纯前端直连；缓存 30 分钟，离线也能显示上次结果） */
const WX_CODE={0:["☀️","晴"],1:["🌤","晴间多云"],2:["⛅","多云"],3:["☁️","阴"],45:["🌫","雾"],48:["🌫","雾凇"],51:["🌦","毛毛雨"],53:["🌦","毛毛雨"],55:["🌦","毛毛雨"],56:["🌧","冻毛毛雨"],57:["🌧","冻毛毛雨"],61:["🌧","小雨"],63:["🌧","中雨"],65:["🌧","大雨"],66:["🌧","冻雨"],67:["🌧","冻雨"],71:["🌨","小雪"],73:["🌨","中雪"],75:["🌨","大雪"],77:["🌨","雪粒"],80:["🌦","阵雨"],81:["🌦","阵雨"],82:["🌦","强阵雨"],85:["🌨","阵雪"],86:["🌨","阵雪"],95:["⛈","雷阵雨"],96:["⛈","雷阵雨伴冰雹"],99:["⛈","雷阵雨伴冰雹"]};
function WX_INFO(c){const x=WX_CODE[c]||["🌡","—"];return{emoji:x[0],txt:x[1]};}
function wxHTML(){
  const c=LS("wb_weather",null);
  const body=c&&c.data?wxInner(c.data,c.t):'<div class="wx-loading">🛰 正在获取泗洪天气…</div>';
  return `<div class="card wx-card" id="wxCard">
    <div class="wx-hd"><span class="wx-loc">📍 泗洪</span><span class="wx-up" id="wxUp">${c&&c.t?("更新于 "+c.t):""}</span></div>
    <div id="wxBody">${body}</div>
  </div>`;
}
function wxInner(d,t){
  const ci=WX_INFO(d.current.weather_code);
  const hi=d.daily.temperature_2m_max, lo=d.daily.temperature_2m_min, dc=d.daily.weather_code, dd=d.daily.time;
  const wk=["日","一","二","三","四","五","六"];const _td=new Date().getDay();
  const lab=i=>i===0?"今天":i===1?"明天":"周"+wk[(_td+i)%7];
  let fore="";
  for(let i=0;i<Math.min(3,dd.length);i++){const x=WX_INFO(dc[i]);fore+=`<div class="wf"><div class="wf-d">${lab(i)}</div><div class="wf-e">${x.emoji}</div><div class="wf-d">${x.txt}</div><div class="wf-t">${Math.round(hi[i])}°/${Math.round(lo[i])}°</div></div>`;}
  return `<div class="wx-main"><div class="wx-emoji">${ci.emoji}</div><div class="wx-temp">${Math.round(d.current.temperature_2m)}°</div><div class="wx-rt"><div class="wx-txt">${ci.txt}</div><div class="wx-feel">体感 ${Math.round(d.current.apparent_temperature)}°</div></div></div>
  <div class="wx-meta"><span>💧 湿度 <b>${d.current.relative_humidity_2m}%</b></span><span>💨 风 <b>${Math.round(d.current.wind_speed_10m)} km/h</b></span></div>
  <div class="wx-fore">${fore}</div>`;
}
function loadWeather(){
  const el=document.getElementById("wxBody");if(!el)return;
  const c=LS("wb_weather",null);
  if(c&&c.ts&&(Date.now()-c.ts<30*60*1000))return; /* 30 分钟内用缓存，避免频繁请求 */
  const url="https://api.open-meteo.com/v1/forecast?latitude=33.4475&longitude=118.2057&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=3&timezone=Asia/Shanghai";
  fetch(url).then(r=>r.json()).then(d=>{
    if(!d||!d.current)throw 0;
    const n=new Date();const t=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
    try{LSset("wb_weather",{data:d,ts:Date.now(),t:t});}catch(e){}
    const up=document.getElementById("wxUp");if(up)up.textContent="更新于 "+t;
    const b=document.getElementById("wxBody");if(b)b.innerHTML=wxInner(d,t);
  }).catch(()=>{
    const b=document.getElementById("wxBody");
    if(b&&!LS("wb_weather",null))b.innerHTML='<div class="wx-err">😕 天气暂不可用 · <a onclick="loadWeather()">重试</a></div>';
  });
}

   旧实现每输入一字就 go('sc')，会触发 window.scrollTo(0,0) + focus 自动滚动 + 卡片入场动画，
   表现为"填写时页面晃动、有时跳回顶部、中文组词被打断、光标丢"。 */
function scRows(){
  let list=stu().filter(s=>SC.f==="all"||s.e===SC.f);
  if(SC.q)list=list.filter(s=>s.n.includes(SC.q));
  const cmp={r:(a,b)=>(a.r??9e4)-(b.r??9e4),z:(a,b)=>(b.z??-1)-(a.z??-1),l:(a,b)=>(a.l??9e4)-(b.l??9e4),p:(a,b)=>(b.p??-999)-(a.p??-999)};
  list=list.slice().sort(cmp[SC.sort]);

}

function seatPos(name){
  const st=seatData(); if(!st)return null;
  const i=st.front.indexOf(name);
  if(i>=0)return {txt:`讲台前（${i===0?"左":"右"}）`};
  for(const r of (st.rows||[])){

}
/* 一生一档综合诊断 */
function profileDiag(s){
  const cur=CUR_EXAM, subs=SUBJ_SCORED.filter(x=>s.s[x]!=null);
  const rate=sub=>+(s.s[sub]/FULL[sub]*100).toFixed(1);
  const rk=sub=>{const m=rankMap(cur,sub);return m[s.n]!=null?m[s.n]:null;};
  let best=subs[0],worst=subs[0];
  subs.forEach(sub=>{if(rate(sub)>rate(best))best=sub;if(rate(sub)<rate(worst))worst=sub;});
  const seg=[];
  if(s.r!=null)seg.push(`班内第 <b>${s.r}</b> 名`);
  if(s.l!=null)seg.push(`理科第 <b>${s.l}</b> 名`);
  let prog='';
  if(s.p!=null)prog=s.p>0?`较上场 <b class="tag-up">进步 ${s.p} 名</b> 👏`:s.p<0?`较上场 <b class="tag-down">退步 ${-s.p} 名</b>`:`较上场 <b>持平</b>`;
  const bestTxt=best?`强势 <b style="color:${SCOL[best]}">${best}</b>（班内第${rk(best)}，得分率${rate(best)}%）`:'';
  const weakTxt=worst&&worst!==best?`薄弱 <b style="color:${SCOL[worst]}">${worst}</b>（班内第${rk(worst)}${((s.w||[]).includes(worst))?'，弱科⚠':''}）`:'';
  const edgeMap={y:"已稳达本一，保持优势",u:"本一线上10分临界，重点帮扶",d:"本一线下10分临界，冲刺突破",b:"达本科线",n:"未达本科，需重点关注",x:"暂无成绩数据"};
  return {loc:seg.join(' · '),prog,bestTxt,weakTxt,edge:edgeMap[s.e]||'',best,worst};
}
/* 达本轨迹一句话（诊断小结用） */
function edgeTrailTxt(s){
  const ev=examStuE(s.n), exs=EXAMS();
  const items=exs.map((e,i)=>ev[i]?`<b>${EDGE[ev[i]]}</b>`:null).filter(Boolean);
  if(items.length<=1) return s.e&&EDGE[s.e]?`<b>${EDGE[s.e]}</b>`:`—`;
  return items.join(' <span style="color:#94a3b8">→</span> ');
}
/* 圆角矩形辅助 */
function rr(c,x,y,w,h,r){if(w<2*r)r=w/2;if(h<2*r)r=h/2;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* 各科明细（历次对比表） */
function subjDetailTable(s,best,worst){
  const exs=EXAMS(),iC=exs.indexOf(CUR_EXAM),iB=Math.max(0,iC-1),baseE=exs[iB],curE=CUR_EXAM,cls=stu();
  const list=SUBJ_SCORED.filter(x=>s.s[x]!=null);
  if(!list.length)return '';
  let rows='';
  list.forEach(sub=>{
    const allv=cls.filter(x=>x.s[sub]!=null).map(x=>x.s[sub]);
    const mn=Math.min.apply(null,allv),mx=Math.max.apply(null,allv);
    const vals=examStuSubj(s.n,sub),rks=examStuSubjRank(s.n,sub);
    const bV=vals[iB],curV=vals[iC],curRk=rks[iC],bRk=rks[iB];
    const curRate=curV!=null?+(curV/FULL[sub]*100).toFixed(1):null;
    const cavg=EX().stats.subAvg[sub];
    const diff=(curV!=null&&cavg!=null)?+(curV-cavg).toFixed(1):null;
    const dScore=(bV!=null&&curV!=null)?+(curV-bV).toFixed(1):null;
    const dRank=(bRk!=null&&curRk!=null)?(bRk-curRk):null;
    const isBest=best===sub,isWorst=worst===sub;
    const cls2=isBest?'best':(isWorst?'worst':'');
    const score=curV!=null?`<td><span class="sc" style="background:${heatColor(curV,mn,mx)}">${curV}</span></td>`:'<td>—</td>';
    const dSc=dScore!=null?`<td class="${dScore>=0?'tag-up':'tag-down'}">${dScore>0?'+':''}${dScore}</td>`:'<td>—</td>';
    const dRk=dRank!=null?`<td class="${dRank>0?'tag-up':(dRank<0?'tag-down':'')}">${dRank>0?'+'+dRank:(dRank<0?dRank:'0')}</td>`:'<td>—</td>';
    rows+=`<tr class="${cls2}"><td class="sname" style="color:${SCOL[sub]}">${sub}${isBest?' 🏆':''}${isWorst?' ⚠':''}</td><td>${bV!=null?bV:'—'}</td>${score}<td>${curRate!=null?curRate+'%':'—'}</td><td>${curRk!=null?'第'+curRk:'—'}</td><td class="${diff!=null?(diff>=0?'tag-up':'tag-down'):''}">${diff!=null?(diff>0?'+':'')+diff:'—'}</td>${dSc}${dRk}</tr>`;
  });
  return `<div class="card"><h3>各科明细（历次对比）</h3><div style="overflow-x:auto"><table class="subj-table"><thead><tr><th>学科</th><th>上场分</th><th>${curE}</th><th>得分率</th><th>班内排名</th><th>班均差</th><th>Δ分</th><th>Δ名</th></tr></thead><tbody>${rows}</tbody></table></div><div class="note" style="margin-top:6px">色块=当前场分数（绿优红弱）；班均差=当前分−当前班均；Δ分/Δ名=对比<b>上一场（${shortEx(baseE)}）</b>的变化（Δ名&gt;0 表示名次前移）。</div></div>`;
}

/* 全部流水（新→旧），保留原数组下标以便撤销单条 */
function pyFlow(P){
  const a=[];Object.entries(P||{}).forEach(([n,o])=>(o.log||[]).forEach((e,i)=>a.push({n,i,t:e.t||"",type:e.type,sub:pySubOf(e)})));
  return a.reverse();
}
/* 某学生在筛选学科下的次数；all 时沿用汇总计数（兼容旧数据） */
function pyCountOf(o,f){
  if(f==="all")return {py:o.peiyou||0,bc:o.bucha||0,tot:(o.peiyou||0)+(o.bucha||0)};
  let py=0,bc=0;(o.log||[]).forEach(e=>{if(pySubOf(e)===f){if(e.type==="peiyou")py++;else if(e.type==="bucha")bc++;}});
  return {py,bc,tot:py+bc};
}
function pySubDist(P){
  const m={};(P.log||[]).forEach(e=>{const k=pySubOf(e);m[k]=(m[k]||0)+1;});
  const ks=PY_SUBS.filter(k=>m[k]);
  if(!ks.length)return '<span class="none">尚无分学科记录 · 选上方学科后点「＋」即按科留痕</span>';
  return ks.map(k=>`<span class="py-sd${PY_SUB===k?" on":""}" style="background:${pySubColor(k)}" title="点击切到${k}" onclick="pySetSub('${k}')">${k} ${m[k]}</span>`).join("");
}
function pyCard(x){
  const P=LS("g8_py",{})[x.n]||{peiyou:0,bucha:0,note:"",log:[]};
  const py=P.peiyou||0, bc=P.bucha||0, note=P.note||"", log=P.log||[];
  const focus=PY_SUB!=="综合"?`<b style="color:${pySubColor(PY_SUB)}">🎯 ${PY_SUB}</b> · `:"";
  const weakTxt=(x.w&&x.w.length)?x.w.map(w=>`<span class="${PY_SUB===w?"py-weak-focus":""}" style="${PY_SUB===w?`color:${pySubColor(w)}`:""}">${w}</span>`).join("、"):"—";
  const lab=t=>t==="peiyou"?"培优":"补差";
  const ct=(t,v)=>`<div class="py-ct"><span class="lab">${lab(t)}</span><button class="mini" onclick="event.stopPropagation();pyAdd('${x.n}','${t}',-1)" title="−1（撤销${PY_SUB}最后一次）">−</button><b>${v}</b><button class="mini" style="position:relative;border-color:${pySubColor(PY_SUB)}" onclick="event.stopPropagation();pyAdd('${x.n}','${t}',1)" title="＋1（记入${PY_SUB}）">＋<span class="py-addsub" style="background:${pySubColor(PY_SUB)}">${pySubShort(PY_SUB)}</span></button></div>`;
  const logTxt=log.length?log.slice().reverse().slice(0,4).map(e=>{const k=pySubOf(e);return `<span class="lg sub" style="background:${pySubColor(k)}">${(e.t||"").slice(5)} ${pySubShort(k)}·${lab(e.type)}</span>`;}).join("")+(log.length>4?`<span class="lg">…共${log.length}次</span>`:""):'<span style="color:#b6c0cf">暂无记录，点"＋"即记一次</span>';
  return `<div class="py-card">
    <div class="py-h">
      <div class="py-name" onclick="jumpStu('${x.n}')">${x.n}${x.m?' <span title="目标生">⭐</span>':""} ${weakIco(x.w)}</div>
      <div class="py-st" style="background:${eC(x.e)}">${EDGE[x.e]}</div>
    </div>
    <div class="py-weak">${focus}薄弱科：${weakTxt}</div>
    <div class="py-counts">${ct("peiyou",py)}${ct("bucha",bc)}</div>
    <div class="py-dists">📚 ${pySubDist(P)}</div>
    <input class="sel py-note" placeholder="📌 备注（如：本周重点抓数学，已约家长）" value="${esc(note)}" onchange="pyNote('${x.n}',this.value)">
    <div class="py-log">📒 记录：${logTxt}</div>
  </div>`;
}
function pyAdd(name,type,delta){
  const P=LS("g8_py",{}); if(!P[name])P[name]={peiyou:0,bucha:0,note:"",log:[]};
  const o=P[name]; o[type]=Math.max(0,(o[type]||0)+delta); o.log=o.log||[];
  if(delta>0)o.log.push({t:todayStr(),type,sub:PY_SUB});
  else if(delta<0){
    let idx=-1;
    for(let i=o.log.length-1;i>=0;i--){if(o.log[i].type===type&&pySubOf(o.log[i])===PY_SUB){idx=i;break;}}
    if(idx<0){for(let i=o.log.length-1;i>=0;i--){if(o.log[i].type===type){idx=i;break;}}}
    if(idx>=0)o.log.splice(idx,1);
  }
  LSset("g8_py",P); refresh();
}
function pyDel(name,idx){
  const P=LS("g8_py",{}),o=P[name]; if(!o||!o.log||!o.log[idx])return;
  const e=o.log[idx]; if(e.type==="peiyou"||e.type==="bucha")o[e.type]=Math.max(0,(o[e.type]||0)-1);
  o.log.splice(idx,1);LSset("g8_py",P);refresh();toast("已撤销该条辅导记录");
}
function pyNote(name,v){const P=LS("g8_py",{});if(!P[name])P[name]={peiyou:0,bucha:0,note:"",log:[]};P[name].note=v;LSset("g8_py",P);toast("📌 备注已保存");}

/* ---------- 座位：AI 智能排座 + 手动调整 + 导出PDF ---------- */
function seatData(){ return SEAT_WORK || DATA.seat; }
function loadSeatFromLS(){ const s=LS(_seatKey,null); if(s&&s.rows&&s.front) SEAT_WORK=s; }
function saveSeatToLS(){ if(SEAT_WORK) LSset(_seatKey, SEAT_WORK); }
function cloneSeat(st){ return {rows:st.rows.map(r=>r.slice()), front:st.front.slice()}; }
function seatStudents(st){
  const names=[];
  st.rows.forEach(r=>r.slice(1).forEach(n=>{ if(n&&n!=="空座") names.push(n); }));
  st.front.forEach(n=>{ if(n&&n!=="空座") names.push(n); });
  return names;
}
/* AI 排座 v2：女生前排 · 男生后排 · 强弱同桌（性别按姓名推断，编辑模式可点♀/♂纠正） */
function aiArrangeSeats(){
  const base=DATA.seat;
  const names=seatStudents(base);
  if(!names.length){ toast("无在座学生"); return; }
  const info=names.map(n=>{
    const s=byN(n)||{};
    const z=(s.z!=null&&!isNaN(s.z))?+s.z:0;
    const rk=(s.r!=null&&!isNaN(s.r))?+s.r:9999;
    const g=genderOf(n);                                   /* f / m / ? */
    return {n,z,rk,g};
  });
  const byScore=a=>a.slice().sort((x,y)=>y.z-x.z);          /* 总分 高→低 */
  const girls=byScore(info.filter(x=>x.g==="f"));
  const boys =byScore(info.filter(x=>x.g==="m"));
  const unk  =byScore(info.filter(x=>x.g!=="f"&&x.g!=="m"));
  /* 组内强弱互补：相邻两座位一强一弱（首尾交错）；最终取姓名字符串入座 */
  const pairUp=arr=>{const o=[];let i=0,j=arr.length-1;while(i<=j){o.push(arr[i].n);if(i!==j)o.push(arr[j].n);i++;j--;}return o;};
  /* 女生优先占前排、男生落后排；性别未知者居中填充 */
  const flat=[...pairUp(girls), ...pairUp(unk), ...pairUp(boys)];
  /* 槽位顺序：讲台前2座 → 第1排…第7排（越近讲台越先填） */
  const empty=new Set();
  base.rows.forEach((r,ri)=>r.forEach((n,ci)=>{ if(n==="空座") empty.add(ri+":"+ci); }));
  base.front.forEach((n,fi)=>{ if(n==="空座") empty.add("f:"+fi); });
  const slots=[];
  base.front.forEach((n,fi)=>slots.push({k:"f:"+fi}));
  for(let ri=base.rows.length-1; ri>=0; ri--)
    for(let ci=1; ci<base.rows[ri].length; ci++) slots.push({k:ri+":"+ci});
  const newRows=base.rows.map(r=>r.slice()), newFront=base.front.slice();
  const set=(k,v)=>{ if(k[0]==="f") newFront[+k.slice(2)]=v; else { const [a,b]=k.split(":"); newRows[+a][+b]=v; } };
  let pi=0;
  for(const s of slots){
    if(empty.has(s.k)){ set(s.k,"空座"); continue; }
    set(s.k, pi<flat.length?flat[pi++]:"空座");
  }
  SEAT_WORK={rows:newRows, front:newFront};
  saveSeatToLS(); SEAT_MODE="view"; SEAT_SEL=null;
  const gN=girls.length, bN=boys.length, uN=unk.length;
  toast(`🤖 已排：女生前排${gN}·男生后排${bN}·强弱同桌${uN?`·性别未知${uN}(编辑模式点♀/♂纠正)`:""}`);
  refresh();
}
function seatSwapIn(work,a,b){
  const sw=arr=>{ for(let i=0;i<arr.length;i++){ if(arr[i]===a)arr[i]=b; else if(arr[i]===b)arr[i]=a; } };
  work.rows.forEach(sw); sw(work.front);
}
function seatTap(n){
  if(SEAT_SEL===null){ SEAT_SEL=n; toast("已选 "+n+" · 再点一个座位交换"); refresh(); return; }
  if(SEAT_SEL===n){ SEAT_SEL=null; refresh(); return; }
  const a=SEAT_SEL; SEAT_SEL=null;
  seatSwapDOM(a, n);                 /* 就地交换 DOM，不整页重渲染 → 电脑端手动调整无抖动 */
  toast("已交换 "+a+" ↔ "+n);
}

/* 编辑模式：长按座位（>480ms）切换性别，普通点按仍为选座交换 —— 与选座点击彻底分离，杜绝误触 */
let _seatLP=null;
function seatPD(e,n){
  if(SEAT_MODE!=="edit")return;
  if(_seatLP)clearTimeout(_seatLP.t);
  _seatLP={n,t:setTimeout(()=>{ if(_seatLP&&_seatLP.n===n){_seatLP.flipped=true; seatFlipGender(n);} },480), sx:e.clientX, sy:e.clientY, flipped:false, moved:false};
}
function seatPM(e,n){
  if(!_seatLP||_seatLP.n!==n)return;
  if(Math.abs(e.clientX-_seatLP.sx)>8||Math.abs(e.clientY-_seatLP.sy)>8){_seatLP.moved=true;clearTimeout(_seatLP.t);}
}

  const rowBlock = (r,mirror) => {
    let cells = r.slice(1).map((n,i)=>({n,c:i+1}));        /* c=原始列 1..9 */
    if(mirror) cells = cells.slice().reverse();            /* 左右镜像：列序反转为 9..1 */

      const pos = idx+1;

/* ---------- 历次成绩总表（按最新成绩排序 + 色阶 + 班级/年级排名 + 迷你走势） ---------- */
let CUR_HSUB="总分";
function heatColor(v,mn,mx){if(v==null||!isFinite(v))return null;const t=mx>mn?(v-mn)/(mx-mn):.5;const c1=[224,90,71],c2=[255,214,90],c3=[102,187,106];const mix=(a,b,f)=>a.map((x,i)=>Math.round(x+(b[i]-x)*f));const rgb=t<.5?mix(c1,c2,t*2):mix(c2,c3,(t-.5)*2);return `rgb(${rgb.join(",")})`;}
function fillGaps(a){const out=a.slice();let last=null;for(let i=0;i<out.length;i++){if(out[i]==null){const nx=out.slice(i+1).find(v=>v!=null);out[i]=last!=null?last:(nx!=null?nx:null);}else last=out[i];}return out.filter(v=>v!=null);}
function hsRows(){
  const sub=CUR_HSUB,getv=st=>sub==="总分"?st.z:(st.s?st.s[sub]:null);
  const exs=EXAMS(),lastE=EX();
  const rows=lastE.students.map(s=>{
    const vals=exs.map(e=>{const st=(DATA.exams[e].students||[]).find(x=>x.n===s.n);return st?getv(st):null;});
    return {name:s.n,vals,latest:vals[vals.length-1]};
  });
  // 最新一场班内排名：总分用官方班名，单科现场计算（同分同名次）
  if(sub==="总分"){rows.forEach(r=>{const st=lastE.students.find(x=>x.n===r.name);r.rank=(st&&st.r!=null)?st.r:null;r.gr=(st&&st.l!=null)?st.l:null;});}
  else{
    const arr=rows.filter(r=>r.latest!=null).sort((a,b)=>b.latest-a.latest);
    const rk={};let pv=null,pk=0;
    arr.forEach((r,i)=>{if(pv!==null&&r.latest===pv)rk[r.name]=pk;else{pk=i+1;rk[r.name]=pk;pv=r.latest;}});
    rows.forEach(r=>{r.rank=rk[r.name]||null;r.gr=null;});
  }
  rows.sort((a,b)=>{const na=a.latest==null||(typeof a.latest==="number"&&a.latest!=a.latest);const nb=b.latest==null||(typeof b.latest==="number"&&b.latest!=b.latest);if(na&&nb)return 0;if(na)return 1;if(nb)return -1;return b.latest-a.latest;});
  return rows;
}
function setHS(x){CUR_HSUB=x;refresh();}
function vHist(){
  const exs=EXAMS(),sub=CUR_HSUB,last=exs[exs.length-1];
  const rows=hsRows();
  const all=rows.flatMap(r=>r.vals).filter(v=>v!=null&&isFinite(v));
  const mn=all.length?Math.min.apply(null,all):0,mx=all.length?Math.max.apply(null,all):1;
  const cr=exs.map(e=>rankMap(e,sub));      // 每场班内排名
  const gm=exs.map(e=>gradeMap(e));          // 每场年级（理科）名次
  let h=`<div class="card"><h3>📋 历次成绩总表</h3>
    <div class="hs-chips">${["总分"].concat(SUBJ_SCORED).map(x=>`<button class="${x===sub?"on":""}" onclick="setHS('${x}')">${x}</button>`).join("")}</div>
    <div class="note" style="margin:6px 0 0">按<b>最新一场（${last}）${sub}成绩</b>由高到低排名 · 每格含<b>分数</b>（底色 绿高→红低）+<b>班排 / 年级排</b> · 表格<b>左右滑动</b>查看</div>`;
  h+=`<div class="panel"><div class="hs-wrap"><table class="hs-table">
    <thead><tr><th class="hs-rk">名次</th><th class="hs-name">姓名</th>${exs.map(e=>`<th title="${e}">${shortEx(e)}</th>`).join("")}<th>走势</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const tds=r.vals.map((v,j)=>{
      const bg=heatColor(v,mn,mx);
      const c=cr[j][r.name],g=gm[j][r.name];
      const sub2=(c!=null?`班${c}`:"")+(c!=null&&g!=null?" ":"" )+(g!=null?`年${g}`:"");
      return `<td class="hs-td"${bg?` style="background:${bg}"`:""}>${v!=null?`<b>${v}</b>`:`<span style="color:#cbd5e1">—</span>`}${sub2?`<span class="hs-rkmini">${sub2}</span>`:""}</td>`;
    }).join("");
    const sp=fillGaps(r.vals);
    h+=`<tr><td class="hs-rk">${r.latest!=null?i+1:"—"}</td><td class="hs-name">${r.name}</td>${tds}<td><canvas id="hsSp${i}" class="hs-spark" height="30" style="width:96px;height:30px" data-sp='${JSON.stringify(sp)}'></canvas></td></tr>`;
  });
  h+=`</tbody></table></div>
    <div class="hs-foot">每格：<b>分数</b>（底色绿高→红低）· <b>班X</b>=该场班内名次（<b>统一按当前8班口径</b>排名，含高二四场均在现班${stu().length}人内；单科按分数同分同名次）· <b>年X</b>=年级理科名次 · 走势=历次${sub}分数迷你折线</div></div></div>`;
  rows.forEach((r,i)=>{const sp=fillGaps(r.vals);if(sp.length>=2)chartDraw("hsSp"+i,{color:"#1e3a8a",data:sp},drawSpark);});
  return h;
}

/* ---------- 课堂表同步（看板）：最小 MQTT 3.1.1 over WebSocket 客户端，复刻手机同步填写协议 ---------- */
let SYNC_conns=[], SYNC_live={}, SYNC_inputLoaded=false, SYNC_token="", SYNC_publishOnReady=false, SYNC_autoconn_done=false;
const SYNC_BROKERS=[{name:"hivemq",url:"wss://broker.hivemq.com:8884/mqtt"},{name:"emqx",url:"wss://broker.emqx.io:8084/mqtt"}];
function SYNC_u(s){return Array.from(new TextEncoder().encode(s));}
function SYNC_v(n){var r=[];do{var b=n&127;n>>=7;if(n)b|=128;r.push(b);}while(n);return r;}
function SYNC_C(){var p=SYNC_u("MQTT"),c=SYNC_u("mb"+Date.now()+Math.random().toString(36).slice(2,6));var h=[0,4].concat(p,[4,2,0,60]);var d=[(c.length>>8)&255,c.length&255].concat(c);return new Uint8Array([16].concat(SYNC_v(h.length+d.length),h,d));}
function SYNC_S(){var subs=[SYNC_token,SYNC_token+"_scr"];var body=[0,1];subs.forEach(function(t){var a=SYNC_u(t);var pl=[(a.length>>8)&255,a.length&255].concat(a);pl.push(0);body=body.concat(pl);});return new Uint8Array([130].concat(SYNC_v(body.length),body));}
function SYNC_P(obj,retain){var a=SYNC_u(SYNC_token);var tf=[(a.length>>8)&255,a.length&255].concat(a);var pb=SYNC_u(JSON.stringify(obj));var body=tf.concat(pb);var fh=0x30|(retain?1:0);return new Uint8Array([fh].concat(SYNC_v(body.length),body));}
function SYNC_decode(arr){try{return new TextDecoder("utf-8",{fatal:false}).decode(arr);}catch(e){return "";}}
function SYNC_parsePublish(buf){var off=1,mult=1,len=0,b;do{b=buf[off++];len+=(b&127)*mult;mult*=128;}while(b&128);var tlen=(buf[off]<<8)|buf[off+1];off+=2;var topic=SYNC_decode(buf.slice(off,off+tlen));off+=tlen;if(((buf[0]>>1)&3)>0)off+=2;var payload=SYNC_decode(buf.slice(off));return{topic:topic,payload:payload};}
function SYNC_tokenFromUrl(u){try{var p=new URL(u).searchParams.get("t");return (p||"").trim();}catch(e){var m=(u||"").match(/[?&]t=([^&]+)/);return m?decodeURIComponent(m[1]):"";}}
function SYNC_setStatus(txt,cls){var el=document.getElementById("syncStatus");if(!el)return;el.className="sync-status "+(cls||"");var t=el.querySelector(".txt");if(t)t.textContent=txt;}
function SYNC_anyReady(){for(var i=0;i<SYNC_conns.length;i++){if(SYNC_conns[i].ready)return true;}return false;}
function SYNC_renderLive(){var lt=document.getElementById("liveT"),ll=document.getElementById("liveLeave"),le=document.getElementById("liveExp");if(!lt)return;
  function set(el,v){if(v&&v.trim()!==""){el.textContent=v;el.className="v";}else{el.textContent="（无）";el.className="v dim";}}
  set(lt,SYNC_live.t);set(ll,SYNC_live.leave);set(le,SYNC_live.expected);}
function SYNC_onData(o){if(o.t!=null)SYNC_live.t=o.t;if(o.leave!=null)SYNC_live.leave=o.leave;if(o.expected!=null)SYNC_live.expected=o.expected;
  SYNC_renderLive();
  if(!SYNC_inputLoaded){var ta=document.getElementById("syncT");if(ta&&!ta.value.trim()&&SYNC_live.t)ta.value=SYNC_live.t;SYNC_inputLoaded=true;}
  SYNC_setStatus("已连接 · 实时同步中（"+SYNC_conns.filter(function(c){return c.ready;}).length+"/"+SYNC_conns.length+"）","ok");}
function SYNC_openConn(cn){if(!SYNC_token)return;try{var ws=new WebSocket(cn.cfg.url,["mqtt"]);cn.ws=ws;ws.binaryType="arraybuffer";
  ws.onopen=function(){cn.retry=0;ws.send(SYNC_C());};
  ws.onmessage=function(ev){var buf=new Uint8Array(ev.data);var type=buf[0]>>4;
    if(type===2){ws.send(SYNC_S());cn.ready=true;SYNC_refreshStatus();
      if(SYNC_publishOnReady){SYNC_publishOnReady=false;SYNC_publish(SYNC_rollPayload());toast("✅ 已同步到看板");}}
    else if(type===3){try{var p=SYNC_parsePublish(buf);if(p.topic===SYNC_token||p.topic===SYNC_token+"_scr"){var o={};try{o=JSON.parse(p.payload)||{};}catch(e){}SYNC_onData(o);}}catch(e){}}};
  ws.onclose=function(){cn.ready=false;SYNC_refreshStatus();SYNC_scheduleReconnect(cn);};
  ws.onerror=function(){cn.ready=false;SYNC_refreshStatus();try{ws.close();}catch(e){}};
}catch(err){cn.ready=false;SYNC_refreshStatus();SYNC_scheduleReconnect(cn);}}
function SYNC_refreshStatus(){var okN=0;for(var i=0;i<SYNC_conns.length;i++){if(SYNC_conns[i].ready)okN++;}
  if(SYNC_conns.length===0){SYNC_setStatus("未连接","wait");return;}
  if(okN>0)SYNC_setStatus("已连接 · 实时同步中（"+okN+"/"+SYNC_conns.length+"）","ok");
  else SYNC_setStatus("连接中…（多线路重试中）","wait");}
function SYNC_scheduleReconnect(cn){if(cn.timer)clearTimeout(cn.timer);cn.retry++;cn.timer=setTimeout(function(){SYNC_openConn(cn);},Math.min(8000,1000*cn.retry));}
function SYNC_connect(url){if(url==null){var urlEl=document.getElementById("syncUrl");url=urlEl?urlEl.value.trim():"";}SYNC_token=SYNC_tokenFromUrl(url);
  if(!SYNC_token){SYNC_setStatus("未检测到 ?t= 口令","err");return;}
  LSset("g8_sync_url",url);SYNC_setStatus("连接中…","wait");
  SYNC_conns.forEach(function(c){try{c.ws&&c.ws.close();}catch(e){}});SYNC_conns=[];
  SYNC_BROKERS.forEach(function(b){var cn={cfg:b,ws:null,ready:false,retry:0,timer:null};SYNC_conns.push(cn);SYNC_openConn(cn);});}
function SYNC_publish(obj){if(!SYNC_token){SYNC_setStatus("未连接","err");return false;}if(!SYNC_anyReady()){SYNC_setStatus("暂无可用线路","err");return false;}
  var pkt=SYNC_P(obj,true),sent=0;SYNC_conns.forEach(function(cn){if(cn.ready&&cn.ws&&cn.ws.readyState===1){try{cn.ws.send(pkt);sent++;}catch(e){}}});

function SYNC_rollPayload(){var m=LS("g8_roll",{})[ROLL_DATE]||{};var leave=stu().filter(function(s){var st=m[s.n]||"到";return st==="缺"||st==="请";}).map(function(s){return s.n;});
  var ta=document.getElementById("syncT");var t=ta?ta.value.trim():"";
  var o={};if(t)o.t=t;o.leave=leave.length?leave.join("、"):" ";o.expected=stu().length;return o;}
function SYNC_submit(){var ta=document.getElementById("syncT");if(ta)LSset("g8_sync_t",ta.value.trim());var ok=SYNC_publish(SYNC_rollPayload());if(ok){SYNC_setStatus("已提交 · 同步中…","ok");toast("✅ 已同步到看板");}else{toast("⚠ 同步失败，请确认已连接");}}
function SYNC_autoconn(){if(LS("g8_sync_auto","1")==="0")return;if(SYNC_conns.length>0)return;var urlEl=document.getElementById("syncUrl");var url=urlEl?urlEl.value.trim():"";if(!url)url=LS("g8_sync_url","");if(!url)return;SYNC_connect(url);}
function SYNC_tap(){if(LS("g8_sync_auto","1")==="0")return;if(!document.getElementById("syncUrl"))return;if(!SYNC_token){if(document.getElementById("syncUrl").value.trim()){SYNC_publishOnReady=true;SYNC_connect();}return;}if(!SYNC_anyReady()){SYNC_publishOnReady=true;return;}
  SYNC_publish(SYNC_rollPayload());}
function rollTap(n){const R=LS("g8_roll",{});const m=R[ROLL_DATE]||{};const cur=m[n]||"到";m[n]=ST_CYC[(ST_CYC.indexOf(cur)+1)%ST_CYC.length];R[ROLL_DATE]=m;LSset("g8_roll",R);refresh();SYNC_tap();}
function rollResetDay(){if(!confirm("清空 "+ROLL_DATE+" 当日点名？"))return;const R=LS("g8_roll",{});delete R[ROLL_DATE];LSset("g8_roll",R);refresh();
  // 重置当日：把"无请假"的空格推送到看板（沿用当前班次标语与应到人数），避免看板残留旧请假名单
  if(LS("g8_sync_auto","1")!=="0"&&SYNC_token){var ok=SYNC_publish(SYNC_rollPayload());toast(ok?"已重置并同步到看板（无请假）":"已重置，看板未连接未同步");}}

        </div>
        <div class="hw-grid ${gridCls}">`;
    aud.forEach(n=>{
      const on=done.has(n);

  });

/* ---------- 数据导入（零依赖：CSV / XLSX / JSON 完整包） ---------- */
function decodeEnt(s){return (s||"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/&amp;/g,"&");}
function detectDelim(text){const fl=(text.split(/\r?\n/).find(l=>l.trim()!=="")||"");const cs=[",","\t",";","|"];let best=",",bc=0;cs.forEach(d=>{const c=fl.split(d).length;if(c>bc){bc=c;best=d;}});return best;}
function parseCSV(text){
  text=text.replace(/^﻿/,"");const d=detectDelim(text);
  const rows=[];let row=[],f="",i=0,q=false,n=text.length;
  while(i<n){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i+=2;continue;}q=false;i++;continue;}f+=c;i++;continue;}
    if(c==='"'){q=true;i++;continue;}
    if(c===d){row.push(f);f="";i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f="";i++;continue;}
    f+=c;i++;}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>(x||"").trim()!==""));
}
/* XLSX：ZIP 解析 + XML 解析 + DecompressionStream 解压（尽力而为，离线可用） */
function ab2u8(b){return new Uint8Array(b);}

function u32(b,o){return (b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24))>>>0;}
function rdStr(b,o,l){return new TextDecoder("utf-8").decode(b.slice(o,o+l));}

function findEOCD(b){for(let i=b.length-22;i>=0;i--){if(b[i]===0x50&&b[i+1]===0x4b&&b[i+2]===0x05&&b[i+3]===0x06)return i;}return -1;}

  let p=cdOff;const entries=[];
  while(p+4<=b.length&&b[p]===0x50&&b[p+1]===0x4b&&b[p+2]===0x01&&b[p+3]===0x02){
    const method=(b[p+10]|(b[p+11]<<8));
    const compSize=(b[p+20]|(b[p+21]<<8)|(b[p+22]<<16)|(b[p+23]<<24))>>>0;
    const nameLen=(b[p+28]|(b[p+29]<<8));
    const extraLen=(b[p+30]|(b[p+31]<<8));
    const commLen=(b[p+32]|(b[p+33]<<8));
    const lho=(b[p+42]|(b[p+43]<<8)|(b[p+44]<<16)|(b[p+45]<<24))>>>0;
    let name="";for(let k=0;k<nameLen;k++)name+=String.fromCharCode(b[p+46+k]);
    entries.push({name,method,compSize,lho});

/* ---------- 抽背登记（仿作业：添加任务→点学生切换已背/未背，绿=已背） ---------- */
function vRecite(){
  let REC=LS("g8_recite",[]);

    <div class="toolbar">
      <input class="sel" id="recDate" type="date" value="${todayStr()}">
      <select class="sel" id="recSub">${SUBJ_SCORED.map(s=>`<option>${s}</option>`).join("")}</select>

      <div class="seg"><button id="recAudAll" class="${!_partOn&&!_weakOn?'seg-on':''}" onclick="recAudMode('all')">全班</button><button id="recAudPart" class="${_partOn&&!_weakOn?'seg-on':''}" onclick="recAudMode('part')">部分同学</button><button id="recAudWeak" class="${_weakOn?'seg-on':''}" onclick="recAudWeak()">薄弱</button></div>
      <span id="recAudCnt" style="font-size:12.5px;color:var(--c1);font-weight:700">${_weakOn?('🎯 '+((REC_AUD&&REC_AUD.length)?(REC_AUD.length+' 人'):'')):(_partOn?('已选 '+REC_AUD.length+' 人'):'')}</span>
    </div>
    <div id="recAudPicker" style="display:${_partOn||_weakOn?'block':'none'};margin-top:8px">
      <div class="note">点击学生加入 / 移出本次抽背（蓝色=已选）。也可点「薄弱」：按上方科目自动选该科薄弱生（选「其他」则选重点关注名单）。不选则默认面向全班。</div>
      <div class="hw-grid" id="recAudGrid">${stu().map(s=>`<span class="hw-chip ${_selSet.has(s.n)?'aud-on':''}" onclick="recAudToggle('${s.n}')">${s.n}</span>`).join('')}</div>
    </div></div>`;
  if(!REC.length) h+=`<div class="empty">暂无抽背任务，先添加一条。</div>`;
  REC.slice().reverse().forEach(it=>{
    const aud=recAudList(it);
    const done=new Set(it.done||[]);const total=aud.length, sub=aud.filter(n=>done.has(n)).length;
    h+=`<div class="card" style="padding:13px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div style="font-size:15px"><b>${it.date}</b> · ${it.subject} · ${it.content||"(无内容)"}</div>
        <div style="font-size:14px;color:${sub===total&&total?'var(--ok)':'var(--c2)'};font-weight:800;white-space:nowrap">${sub}/${total}</div>
      </div>
      ${it.audience&&it.audience.length?`<div style="font-size:11.5px;color:var(--mut);margin-top:3px">面向 ${it.audience.length} 人</div>`:''}
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="bigbtn" style="background:#e8f5e9;border-color:#43a047;color:#2e7d32" onclick="recAllDone(${it.id})">✅ 全部已背</button>

        <button class="bigbtn" style="background:#fff;color:#ef5350;border-color:#fecaca;flex:0;min-width:72px" onclick="recDel(${it.id})">删除</button>
      </div>

    aud.forEach(n=>{const on=done.has(n);h+=`<span class="hw-chip${on?" done":""}" onclick="recToggle(${it.id},'${n}')">${n}</span>`;});

    h+=`</table></div></div>`;
  }
  return h;
}
function recAudList(it){return (it.audience&&it.audience.length)?it.audience:stu().map(s=>s.n);}
function recAudMode(m){
  REC_AUD_WEAK=false;

/* 抽背「面向」→ 薄弱：按科目自动勾选薄弱学生，仍可手动增删（逻辑同作业） */
function recAudWeak(){

function recAudToggle(n){REC_AUD=REC_AUD||[];const i=REC_AUD.indexOf(n);if(i>=0)REC_AUD.splice(i,1);else REC_AUD.push(n);renderRecAudGrid();}
function renderRecAudGrid(){

function recAdd(){const date=document.getElementById("recDate").value||todayStr();const subject=document.getElementById("recSub").value;const content=document.getElementById("recContent").value.trim();if(!content){alert("请填写抽背内容");return;}const partMode=document.getElementById("recAudPart")&&document.getElementById("recAudPart").classList.contains("seg-on");const weakMode=REC_AUD_WEAK;const audience=((partMode||weakMode)&&REC_AUD&&REC_AUD.length)?REC_AUD.slice():null;const REC=LS("g8_recite",[]);REC.push({id:Date.now(),date,subject,content,done:[],audience});REC_AUD=null;REC_AUD_WEAK=false;LSset("g8_recite",REC);toast(audience?("📚 抽背已添加 · 面向 "+audience.length+" 人"):"📚 抽背已添加");refresh();}

function recAllDone(id){const REC=LS("g8_recite",[]);const it=REC.find(x=>x.id===id);if(!it)return;it.done=recAudList(it).slice();LSset("g8_recite",REC);toast("✅ 已全部标记已背");refresh();}
function recClear(id){const REC=LS("g8_recite",[]);const it=REC.find(x=>x.id===id);if(!it)return;it.done=[];LSset("g8_recite",REC);toast("🧹 已全部标记未背");refresh();}
function recDel(id){if(!confirm("确定删除该抽背任务？"))return;LSset("g8_recite",LS("g8_recite",[]).filter(x=>x.id!==id));refresh();}

/* ---------- 备忘录（便签式随手记，本地保存） ---------- */
let MEMO_EDIT=null;
const MEMO_COLORS=['amber','blue','green','pink'];
function vMemo(){
  const LIST=LS("g8_memo",[]);
  let h=`<div class="card"><h3>📌 备忘录（${LIST.length}）</h3>
    <div class="note" style="margin-bottom:8px">随手记，「保存便签」即留一条；点便签文字可<b>编辑</b>，右上可<b>置顶</b>📌、<b>换色</b>🎨、<b>删除</b>✕。</div>
    <textarea class="sel" id="memoText" rows="3" placeholder="写点什么…（如：周三下午找李明家长谈话）" style="width:100%;resize:vertical"></textarea>
    <div class="toolbar" style="margin-top:8px">
      <button class="bigbtn" style="flex:1;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:none;font-weight:700" onclick="memoAdd()">📌 保存便签</button>
    </div>
  </div>`;
  if(!LIST.length) h+=`<div class="empty">还没有便签<br>写下第一条吧，重要的事可以置顶 + 换色标记</div>`;
  else{
    const sorted=LIST.slice().sort((a,b)=>{
      if(!!b.pin!==!!a.pin) return (b.pin?1:0)-(a.pin?1:0);
      return (b.time||0)-(a.time||0);
    });
    h+=`<div class="memo-list">`;
    sorted.forEach(m=>{
      const col=m.color||'amber';
      const ed=MEMO_EDIT===m.id;
      const ops=ed
        ? `<span class="memo-op" title="完成" onclick="memoEditSave('${m.id}')">✓</span>`
        : `<span class="memo-op" title="置顶" onclick="memoPin('${m.id}')">${m.pin?'📌':'📍'}</span><span class="memo-op" title="换色" onclick="memoCycleColor('${m.id}')">🎨</span><span class="memo-op del" title="删除" onclick="memoDel('${m.id}')">✕</span>`;
      const body=ed
        ? `<textarea class="sel memo-edit" id="memoEdit_${m.id}" onblur="memoEditSave('${m.id}')" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.blur()}">${esc(m.text)}</textarea>`
        : `<div class="memo-txt" onclick="memoEdit('${m.id}')">${esc(m.text)}</div>`;
      h+=`<div class="memo-item memo-${col}${m.pin?' memo-pin':''}">
        <div class="memo-top"><div class="memo-ops">${ops}</div></div>
        ${body}
        <div class="memo-foot"><span class="memo-time">${relTime(m.time)}</span></div>
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="toolbar" style="margin-top:8px"><button class="act-btn" onclick="exportMemo()"><span class="ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg></span><span class="lb">导出Excel</span></button></div>`;
  return h;
}
function memoAdd(){const t=document.getElementById("memoText").value.trim();if(!t){alert("便签内容不能为空");return;}const L=LS("g8_memo",[]);L.push({id:Date.now()+""+Math.floor(Math.random()*1e6),time:Date.now(),text:t,color:'amber',pin:false});LSset("g8_memo",L);toast("📌 已保存");refresh();}
function memoDel(id){const L=LS("g8_memo",[]).filter(m=>m.id!==id);LSset("g8_memo",L);refresh();}
function memoPin(id){const L=LS("g8_memo",[]);const m=L.find(x=>x.id===id);if(!m)return;m.pin=!m.pin;LSset("g8_memo",L);refresh();}
function memoCycleColor(id){const L=LS("g8_memo",[]);const m=L.find(x=>x.id===id);if(!m)return;const i=MEMO_COLORS.indexOf(m.color||'amber');m.color=MEMO_COLORS[(i+1)%MEMO_COLORS.length];LSset("g8_memo",L);refresh();}

/* ---------- 待办（可勾选、统计、清空已完成） ---------- */
let TODO_EDIT=null;
const TODO_PRI=['high','mid','low'];
const PRI_ORDER={'high':0,'mid':1,'low':2};
const PRI_COL={'high':'#ef4444','mid':'#f59e0b','low':'#94a3b8'};
const PRI_LBL={'high':'高','mid':'中','low':'低'};
function vTodo(){
  const L=LS("g8_todo",[]);
  const done=L.filter(t=>t.done).length, total=L.length, left=total-done;
  const pct=total?Math.round(done/total*100):0;
  let h=`<div class="card"><h3>✅ 待办清单（${left?('剩余 '+left+' 项'):'全部完成 🎉'}）</h3>
    <div class="note" style="margin-bottom:8px">记下要办的事；点左侧圆圈勾选完成；点文字可<b>编辑</b>，左侧圆点可切<b>优先级</b>。</div>
    <div class="todo-add">
      <input class="sel" id="todoText" placeholder="要办的事，如：打印期中成绩分析表" onkeydown="if(event.key==='Enter')todoAdd()">
      <button class="bigbtn" style="flex:0 0 auto;padding:0 18px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:none;font-weight:700" onclick="todoAdd()">＋ 添加</button>
    </div>
    <div class="todo-stat"><span>已完成 ${done} / 共 ${total}</span><span class="todo-pct">${pct}%</span></div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    ${total?`<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 2px;gap:8px">${left?`<span class="todo-all" onclick="todoAllDone()">✓ 全部完成</span>`:""}<span class="todo-clear" onclick="todoClearDone()">🧹 清空已完成</span></div>`:""}
  </div>`;
  if(!L.length) h+=`<div class="empty">还没有待办<br>添加一条，重要的事设「高优先级」会更醒目</div>`;
  else{
    const undone=L.filter(t=>!t.done).sort((a,b)=>PRI_ORDER[a.pri||'mid']-PRI_ORDER[b.pri||'mid']||(b.time||0)-(a.time||0));
    const doneL=L.filter(t=>t.done).sort((a,b)=>(b.time||0)-(a.time||0));
    h+=`<div class="todo-list">`;
    undone.forEach(t=>{h+=todoRow(t);});
    if(doneL.length){
      h+=`<div class="todo-sep">已完成 · ${doneL.length}</div>`;
      doneL.forEach(t=>{h+=todoRow(t);});
    }
    h+=`</div>`;
  }
  h+=`<div class="toolbar" style="margin-top:8px"><button class="act-btn" onclick="exportTodo()"><span class="ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg></span><span class="lb">导出Excel</span></button></div>`;
  return h;
}
function todoRow(t){
  const ed=TODO_EDIT===t.id;
  const pri=t.pri||'mid';
  let left;
  if(ed){
    left=`<input class="sel todo-edit" id="todoEdit_${t.id}" value="${esc(t.text)}" onblur="todoEditSave('${t.id}')" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}" onfocus="this.select()">
      <span class="todo-del" onmousedown="event.preventDefault()" onclick="todoEditCancel('${t.id}')">✕</span>`;
  }else{
    left=`<span class="todo-check" onclick="todoToggle('${t.id}')">${t.done?'✓':''}</span>

  h+=`<div class="toolbar tt-actions" style="margin-top:8px">
    <button class="sel" onclick="ttCopyDay()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:44px">📋 复制某天</button>
    <button class="sel" onclick="ttReset()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:44px">🔄 清空重排</button>
    <button class="sel" onclick="exportTimetable()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:44px">📤 导出Excel</button>
  </div>`;
  if(!TT_TIMER){TT_TIMER=setInterval(ttTick,30000);}  /* 进入课表页启动实时定位线（离开即由 go 清理） */
  setTimeout(ttTick,60);
  return h;
}
/* 在课表渲染后，按当前时间画出红色定位线（横贯全表，定位"现在"） */
function ttDrawNow(){
  const wrap=document.querySelector(".tt-wrap");if(!wrap)return;
  const tbl=wrap.querySelector(".tt-grid");if(!tbl)return;
  const rows=[...tbl.querySelectorAll("tr")];if(rows.length<2)return;
  const line=document.getElementById("ttNowLine");if(!line)return;
  const wr=wrap.getBoundingClientRect();
  const top=y=>y.getBoundingClientRect().top-wr.top+wrap.scrollTop;
  /* 行 → 节次映射（按行首文本，防顺序错位） */
  const rowOf={},labels=[];
  rows.forEach(r=>{const td=r.querySelector("td.pr");if(!td)return;
    const lbl=(td.childNodes[0]&&td.childNodes[0].textContent||td.textContent).trim().split("\n")[0].trim();
    rowOf[lbl]=r;labels.push(lbl);});
  const dataRows=rows.filter(r=>r.querySelector("td.pr"));
  if(!dataRows.length)return;
  const first=dataRows[0],last=dataRows[dataRows.length-1];
  const ni=ttNowInfo();
  let y=null;
  if(ni.status==="before"){y=top(first);}
  else if(ni.status==="after"){y=top(last)+last.getBoundingClientRect().height;}
  else{
    for(let i=0;i<labels.length;i++){
      const tm=TT_TIMES[labels[i]];if(!tm)continue;
      const[s,e]=tm,r=rowOf[labels[i]];if(!r)continue;
      const rTop=top(r),rH=r.getBoundingClientRect().height;
      if(ni.nowMin<s){y=rTop;break;}                       /* 课间/午休：贴下一节行顶 */
      if(ni.nowMin<=e){y=rTop+Math.max(0,Math.min(1,(ni.nowMin-s)/(e-s)))*(rH-2);break;} /* 行内按时间比例 */
    }
    if(y===null)y=top(last)+last.getBoundingClientRect().height;
  }
  line.style.top=y+"px";
  line.style.width=tbl.offsetWidth+"px";
  const hh=String(Math.floor(ni.nowMin/60)).padStart(2,"0"),mm=String(ni.nowMin%60).padStart(2,"0");
  const tag=ni.status==="before"?"今日未开始":ni.status==="after"?"今日已结束":ni.status==="between"?`课间 ${hh}:${mm}`:`现在 ${hh}:${mm}`;
  line.querySelector("span").textContent=tag;
  line.style.display="block";
}
let TT_TIMER=null;
/* 平时课表：每30秒按当前时间重画红色定位线，停留跨节次后红线自动跟随 */
function ttTick(){if(CUR==="tt")ttDrawNow();}
function ttFocus(sub){TT_FOCUS=(TT_FOCUS===sub)?null:sub;refresh();}
function ttEdit(d,p){const t=getTT();const cur=(t.grid[d]&&t.grid[d][p])||{};const m=document.getElementById("ttModal");
  const opts=[...SUBS,...TT_EXTRA].map(s=>`<option ${cur.subj===s?"selected":""}>${s}</option>`).join("");
  m.querySelector(".ttbody").innerHTML=`
    <div style="font-size:15px;font-weight:800;margin-bottom:12px">${d} · ${p}</div>
    <div style="display:flex;flex-direction:column;gap:9px">
      <select class="sel" id="ttSubSel">${opts}</select>
      <input class="sel" id="ttTch" placeholder="任课教师（可选）" value="${esc(cur.teacher||"")}">
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="bigbtn" style="flex:1;background:#fff;color:#ef5350;border-color:#fecaca" onclick="ttClearCell('${d}','${p}')">清空</button>
      <button class="bigbtn" style="flex:2;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:none;font-weight:700" onclick="ttSaveCell('${d}','${p}')">保存</button>
    </div>`;
  m.classList.add("show");
}
function ttSaveCell(d,p){const subj=document.getElementById("ttSubSel").value;const teacher=document.getElementById("ttTch").value.trim();const t=getTT();if(!t.grid[d])t.grid[d]={};if(subj==="空")t.grid[d][p]=null;else t.grid[d][p]={subj,teacher};LSset("g8_tt",t);document.getElementById("ttModal").classList.remove("show");toast("🗓 已保存");refresh();}
function ttClearCell(d,p){const t=getTT();if(t.grid[d])t.grid[d][p]=null;LSset("g8_tt",t);document.getElementById("ttModal").classList.remove("show");refresh();}
function ttReset(){if(!confirm("确定清空整张课程表？"))return;const d=ttDefault();LSset("g8_tt",d);TT_FOCUS=null;refresh();}
function ttCopyDay(){const t=getTT();const from=prompt("复制哪一天？（如：周一）",t.days[0]||"周一");if(!from||!t.grid[from]){alert("未找到该天");return;}const to=prompt("复制到哪一天？（如：周二）",t.days[1]||"周二");if(!to||!t.grid[to]){alert("未找到目标天");return;}t.grid[to]=JSON.parse(JSON.stringify(t.grid[from]));LSset("g8_tt",t);toast(`已复制 ${from} → ${to}`);refresh();}

/* ---------- 作息时间表（数据来自 DATA.meta.sched，随《作息时间表》文件更新） ---------- */
let ZX_TIMER=null;
function vZuoxi(){
  const sc=(DATA.meta&&DATA.meta.sched)||null;
  if(!sc)return `<div class="card"><h3>🕐 作息时间表</h3><div class="note">暂无作息数据</div></div>`;
  let h=`<div class="card"><h3>🕐 ${esc(sc.title)}</h3>
    <div class="zx-phase">当前：<b id="zxPhase">—</b></div>
    <div class="note" style="margin:6px 0 12px">${esc(sc.subtitle)} · 红色高亮为<b>当前进行中</b>时段，每30秒自动刷新</div>`;
  sc.groups.forEach(g=>{
    h+=`<div class="zx-grp"><div class="zx-pr">${esc(g.period)}</div><div class="zx-list">`;
    g.items.forEach(it=>{
      h+=`<div class="zx-row" data-s="${it.s==null?"":it.s}" data-e="${it.e==null?"":it.e}">
        <span class="zx-name">${esc(it.name)}</span>
        <span class="zx-time">${esc(it.time)}</span>
        <span class="zx-now">进行中</span>
      </div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  if(ZX_TIMER)clearInterval(ZX_TIMER);
  ZX_TIMER=setInterval(zxTick,30000);
  setTimeout(zxTick,30);
  return h;
}
function zxTick(){
  const rows=[...document.querySelectorAll(".zx-row")];if(!rows.length)return;
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const pts=rows.map(r=>({s:r.dataset.s?Number(r.dataset.s):null,e:r.dataset.e?Number(r.dataset.e):null}));
  let active=-1;
  for(let i=0;i<pts.length;i++){
    const s=pts[i].s;if(s==null)continue;
    let e=pts[i].e;
    if(e==null){for(let j=i+1;j<pts.length;j++){if(pts[j].s!=null){e=pts[j].s;break;}}if(e==null)e=1440;}
    if(nm>=s&&nm<e){active=i;break;}
  }
  rows.forEach((r,i)=>r.classList.toggle("now",i===active));
  const tag=document.getElementById("zxPhase");
  if(tag)tag.textContent=active>=0?rows[active].querySelector(".zx-name").textContent:"（非作息时段）";
}


/* ---------- 自动更新校验（保证打开即最新） ---------- */
async function checkUpdate(){
  if(location.protocol==="file:")return;   /* 本地/离线直接打开时不请求版本，避免无谓的 CORS 报错 */
  try{
    const r=await fetch("version.json?_="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const d=await r.json();
    if(d.build && d.build!==BUILD){
      const el=document.getElementById("upd");
      if(d.note)el.querySelector("small").textContent=d.note;
      el.style.display="block";
    }
  }catch(e){/* 离线 / 本地文件，忽略 */}
}
