<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>16班网课点名</title>
<style>
  :root{
    --c1:#1e3a8a; --c2:#2563eb; --ok:#2e7d32; --warn:#ef6c00; --red:#d32f2f; --blue:#1565c0;
    --ink:#1e293b; --mut:#8b97ab; --bg:#f3f6fb; --card:#fff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); padding:10px; padding-top:calc(10px + env(safe-area-inset-top,0px));
    padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));}
  .hd{background:linear-gradient(135deg,var(--c1),var(--c2)); color:#fff; border-radius:16px;
    padding:14px 16px; box-shadow:0 8px 22px -10px rgba(30,58,138,.5);}
  .hd h1{margin:0; font-size:19px; font-weight:800; letter-spacing:1px;}
  .hd .sub{margin-top:3px; font-size:12px; opacity:.9;}
  .toolbar{display:flex; gap:8px; align-items:center; margin:12px 0 8px; flex-wrap:wrap;}
  input[type=date]{font-size:15px; font-weight:700; padding:9px 10px; border:1.5px solid #e2e8f0;
    border-radius:10px; background:#fff; color:var(--ink); flex:1; min-width:140px;}
  .btn{border:none; border-radius:10px; font-weight:700; cursor:pointer; color:#fff;
    background:var(--c2); padding:9px 14px; font-size:14px; min-height:42px;}
  .btn.ghost{background:#fff; color:var(--c1); border:1.5px solid #dbe4ff;}
  .btn.warn{background:var(--warn);}
  .stats{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 10px;}
  .stat{flex:1; min-width:64px; background:var(--card); border-radius:12px; padding:8px 4px; text-align:center;
    box-shadow:0 2px 8px rgba(15,23,42,.05);}
  .stat .n{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;}
  .stat .l{font-size:11px; color:var(--mut); margin-top:1px;}
  .rate{font-size:13px; font-weight:800; color:var(--c2); text-align:right; flex-basis:100%; margin-top:2px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:8px;}
  .cell{border-radius:12px; padding:9px 2px; text-align:center; cursor:pointer; user-select:none;
    border:2px solid #cfd8e6; background:#fff; transition:transform .08s ease;}
  .cell:active{transform:scale(.95);}
  .cell .nm{font-size:13.5px; font-weight:800; line-height:1.1; word-break:break-all;}
  .cell .st{font-size:11px; font-weight:800; margin-top:3px;}
  .cell.s-dao{border-color:#a5d6a7; background:#e8f5e9;}
  .cell.s-chi{border-color:#ffcc80; background:#fff3e0;}
  .cell.s-que{border-color:#90caf9; background:#e3f2fd;}
  .cell.s-queq{border-color:#ef9a9a; background:#ffebee;}
  .cell .st.s-dao{color:var(--ok);} .cell .st.s-chi{color:var(--warn);}
  .cell .st.s-que{color:var(--blue);} .cell .st.s-queq{color:var(--red);}
  .search{width:100%; padding:9px 12px; border:1.5px solid #e2e8f0; border-radius:10px; font-size:14px; margin:6px 0 2px; background:#fff;}
  .search:focus{border-color:var(--c2); outline:none;}
  .foot{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #eef1f6;
    display:flex; gap:8px; padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px)); z-index:20;}
  .foot .btn{flex:1;}
  .toast{position:fixed; left:50%; top:18%; transform:translateX(-50%); background:rgba(15,23,42,.92);
    color:#fff; padding:9px 16px; border-radius:999px; font-size:13.5px; font-weight:700; z-index:50;
    opacity:0; transition:opacity .2s ease; pointer-events:none; white-space:nowrap;}
  .toast.show{opacity:1;}
  .empty{text-align:center; color:var(--mut); font-size:13px; padding:30px 0;}
</style>
</head>
<body>
  <div class="hd">
    <h1>16班网课点名</h1>
    <div class="sub">当前在册 <span id="totalN">0</span> 人 · 点名字切换状态：到→迟→缺→请→到</div>
  </div>

  <div class="toolbar">
    <input type="date" id="rollDate" onchange="onDateChange()">
    <button class="btn ghost" onclick="resetDay()">重置当日</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" style="color:var(--ok)" id="cDao">0</div><div class="l">到</div></div>
    <div class="stat"><div class="n" style="color:var(--warn)" id="cChi">0</div><div class="l">迟</div></div>
    <div class="stat"><div class="n" style="color:var(--red)" id="cQue">0</div><div class="l">缺</div></div>
    <div class="stat"><div class="n" style="color:var(--blue)" id="cQing">0</div><div class="l">请</div></div>
    <div class="rate" id="rateTxt">出勤率 0%</div>
  </div>

  <input class="search" id="q" placeholder="🔍 搜索姓名…" oninput="render()">

  <div class="grid" id="grid"></div>

  <div class="foot">
    <button class="btn ghost" onclick="exportTxt()">导出名单</button>
    <button class="btn" onclick="randRoll()">随机点名</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
const NAMES = ["张庭恺","赵若佟","穆思梦","吴瑾玉","王佳丽","朱兵亚","邱钰婷","袁邦润","石艳雨","周紫妍","钱文迪","贾鸣威","石雅轩","席钒峻","许艺凡","廖思怡","丁禹棋","从宇飞","刘轩彤","蔡佳兴","陈馨然","赵文淼","韩铭宇","李羽涵","洪梓翔","江钰","张天一","张晶慧","朱雯颖","冯舒怡","倪玮","胡铮铮","魏燕妮","王雨涛","孙宁宣","张晨","张潇予","邢潇月","王琦瑞","王玉虎","杨雅如","毕浩宇","祁绵绵","刘芮齐","林楚晰","蒋凡","刘嘉","葛景灏","朱梦怡","樊天泽","李博文","庄舒媛","吕成轩","严鸣乐","李照国","马胜志","韩昀轩","高梓轩","赵轩逸","严格"];
const ST = {dao:{s:"到",cls:"s-dao"},chi:{s:"迟",cls:"s-chi"},que:{s:"缺",cls:"s-que"},qing:{s:"请",cls:"s-queq"}};
const ORDER = ["dao","chi","que","qing"];
const KEY = "wangke16_roll";
document.getElementById("totalN").textContent = NAMES.length;

let today = new Date();
let dateStr = fmt(today);
let data = loadAll();

function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function loadAll(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function saveAll(){localStorage.setItem(KEY,JSON.stringify(data));}
function dayData(){if(!data[dateStr])data[dateStr]={};return data[dateStr];}
function getSt(n){return dayData()[n]||"dao";}

function onDateChange(){dateStr=document.getElementById("rollDate").value||fmt(new Date());render();}

function tap(n){
  const cur=getSt(n);
  const next=ORDER[(ORDER.indexOf(cur)+1)%ORDER.length];
  dayData()[n]=next;
  saveAll();
  render();
}

function resetDay(){
  data[dateStr]={};
  saveAll();
  render();
  toast("已重置 "+dateStr);
}

function counts(){
  const d=dayData();let c={dao:0,chi:0,que:0,qing:0};
  NAMES.forEach(n=>c[d[n]||"dao"]++);
  return c;
}

function render(){
  const q=(document.getElementById("q").value||"").trim();
  const d=dayData();
  const list=NAMES.filter(n=>!q||n.includes(q));
  const grid=document.getElementById("grid");
  if(!list.length){grid.innerHTML='<div class="empty">没有匹配的学生</div>';}
  else{
    grid.innerHTML=list.map(n=>{
      const st=d[n]||"dao",sx=ST[st];
      return `<div class="cell ${sx.cls}" onclick="tap('${n}')"><div class="nm">${n}</div><div class="st ${sx.cls}">${sx.s}</div></div>`;
    }).join("");
  }
  const c=counts(),total=NAMES.length,present=c.dao+c.chi,rate=total?Math.round(present/total*100):0;
  document.getElementById("cDao").textContent=c.dao;
  document.getElementById("cChi").textContent=c.chi;
  document.getElementById("cQue").textContent=c.que;
  document.getElementById("cQing").textContent=c.qing;
  document.getElementById("rateTxt").textContent="出勤率 "+rate+"%";
}

function exportTxt(){
  const d=dayData();
  const lines=["【16班网课点名 "+dateStr+"】"];
  const grp=t=>NAMES.filter(n=>(d[n]||"dao")===t);
  lines.push("到（"+grp("dao").length+"）："+grp("dao").join("、"));
  lines.push("迟（"+grp("chi").length+"）："+grp("chi").join("、"));
  lines.push("缺（"+grp("que").length+"）："+grp("que").join("、"));
  lines.push("请（"+grp("qing").length+"）："+grp("qing").join("、"));
  const txt=lines.join("\n");
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast("已复制名单到剪贴板"),()=>fallbackCopy(txt));}
  else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("已复制名单到剪贴板");}catch(e){toast("复制失败，请手动选择");}
  ta.remove();
}

function randRoll(){
  const d=dayData();
  const pool=NAMES.filter(n=>(d[n]||"dao")!=="que"&&(d[n]||"dao")!=="qing");
  const n=pool[Math.floor(Math.random()*pool.length)];
  toast("🎯 "+n);
}

let toastT;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1400);
}

document.getElementById("rollDate").value=dateStr;
render();
</script>
</body>
</html>
