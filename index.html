<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="16班工作台">
<title>高三16班 · 班级工作台</title>
<style>
:root{
  --c1:#1e3a8a; --c2:#6d28d9; --bg:#eef2f7; --card:#ffffff; --ink:#1a2233; --mut:#64748b;
  --yi:#43a047; --ben:#1e88e5; --up:#FFD54F; --down:#FF8A65; --no:#cfd8dc;
  --red:#e53935; --ok:#2e7d32;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
/* ---------- 头部（紧凑版：一行标题+信息横滑+子导航单行横滑） ---------- */
header{background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 100%);color:#fff;padding:calc(11px + env(safe-area-inset-top,0px)) 13px 11px;position:sticky;top:0;z-index:30;box-shadow:0 4px 20px rgba(30,58,138,.35);overflow:hidden}
header::after{content:"";position:absolute;top:-40%;right:-12%;width:62%;height:180%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 62%);pointer-events:none}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd-title{min-width:0;flex:1}
header .t1{font-size:clamp(15px,4.3vw,17px);font-weight:800;letter-spacing:.5px;line-height:1.2;white-space:nowrap}
header .t2{display:flex;gap:4px;margin-top:5px;overflow-x:auto;scrollbar-width:none;min-width:0}
header .t2::-webkit-scrollbar{display:none}
.hchip{flex-shrink:0;font-size:10.5px;line-height:1;padding:3.5px 8px;border-radius:999px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.28);white-space:nowrap}
.hd-date{flex-shrink:0;text-align:right;padding-left:4px}
.hd-d1{font-size:13px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.hd-d2{margin-top:4px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:3.5px 8px;border-radius:999px;display:inline-block;white-space:nowrap}
.hd-d2 b{font-size:12.5px;font-weight:900}
/* 分组子切换：单行横滑，不换行不占两行 */
#subnav{display:none;gap:7px;margin-top:10px;position:relative;z-index:1;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#subnav::-webkit-scrollbar{display:none}
#subnav button{flex-shrink:0;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;padding:5.5px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.2s;white-space:nowrap}
#subnav button:active{transform:scale(.95)}
#subnav button.on{background:#fff;color:var(--c1);font-weight:800;border-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
/* 底部固定 Tab 栏 */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:#fff;border-top:1px solid #e8edf3;box-shadow:0 -2px 14px rgba(15,23,42,.1);padding:5px 4px calc(6px + env(safe-area-inset-bottom));max-width:920px;margin:0 auto}
#tabbar button{flex:1;border:none;background:transparent;color:#94a3b8;padding:4px 2px;border-radius:12px;font-size:11px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
#tabbar button .ic{font-size:21px;line-height:1}
#tabbar button.on{color:var(--c1)}
#tabbar button.on .ic{transform:translateY(-1px)}
#examBar{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none;position:relative;z-index:1}
#examBar::-webkit-scrollbar{display:none}
#examBar button{flex-shrink:0;border:none;background:rgba(255,255,255,.16);color:#fff;padding:5px 13px;border-radius:999px;font-size:12px;cursor:pointer;transition:.2s;white-space:nowrap;border:1.5px solid transparent}
#examBar button:active{transform:scale(.95)}
#examBar button.on{background:#fff;color:var(--c1);font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.15)}
main{max-width:920px;margin:0 auto;padding:12px 12px 92px}
/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card h3::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--c1),var(--c2))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.kpi .v{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .l{font-size:12px;color:var(--mut);margin-top:3px}
.kpi .d{font-size:11px;margin-top:2px;color:var(--ok);font-weight:700}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;margin:3px;cursor:pointer;border:1.5px solid transparent}
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:7px;margin-top:10px}
.bigbtn{min-height:46px;padding:10px 14px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;border:2px solid #e2e8f0;background:#fff;color:var(--ink);flex:1;text-align:center;min-width:104px;transition:.15s}
.bigbtn:active{transform:scale(.97)}
.bar{height:10px;border-radius:5px;background:#e8edf5;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .6s}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1.5px solid #e8edf5;white-space:nowrap;font-size:12px}
td{padding:9px 6px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
tr.rowc{cursor:pointer;transition:.15s}
tr.rowc:hover{background:#f5f7ff}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;color:#123}
.wb{display:inline-block;width:17px;height:17px;line-height:15px;text-align:center;border-radius:4px;font-size:10px;font-weight:800;color:#fff;margin-right:3px}
.tag-up{color:var(--ok);font-weight:800}
.tag-down{color:var(--red);font-weight:800}
input.sel,select.sel,textarea.sel{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;background:#fff;width:100%;font-family:inherit}
select.sel{min-width:96px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar input,.toolbar select{flex:1;min-width:120px}
.toolbar label.sel{white-space:nowrap}
.toolbar label.sel input[type="checkbox"]{width:auto;min-width:0;flex:0 0 auto;accent-color:var(--c1)}
.sec-title{font-size:13px;color:var(--mut);margin:14px 2px 8px;font-weight:700}
.empty{color:#94a3b8;text-align:center;padding:30px 0;font-size:14px}
.note{font-size:12px;color:var(--mut);line-height:1.6}
.hw-hint{font-size:12px;color:var(--mut);line-height:1.5;margin-top:8px;padding:7px 10px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px}
/* 座位 */
.seat-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.seat-grid2{display:grid;grid-template-columns:36px repeat(9,54px);gap:5px;width:max-content;min-width:100%}
.seat-label{display:flex;align-items:center;justify-content:center;background:#4f4f4f;color:#fff;font-weight:700;font-size:11px;border-radius:6px;min-height:56px}
.podium-span{grid-column:span 7;background:#334155;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:8px;font-size:14px;min-height:44px}
.seat{border-radius:9px;padding:6px 2px;text-align:center;cursor:pointer;border:2px solid #b8c4d6;position:relative;min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.seat.focus{border-color:var(--red)}
.seat .nm{font-size:12.5px;font-weight:800;line-height:1.15;white-space:nowrap}
.seat .wk{font-size:9.5px;letter-spacing:2px;line-height:1;min-height:10px;color:#52607a}
.seat .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--red);border-radius:50%}
.seat.empty-s{border:1.5px dashed #d7dee8;background:#f8fafc;color:#a8b4c4;font-size:11px;cursor:default}
.front-seat{min-height:44px}
.blackboard{text-align:center;color:#64748b;font-size:12px;margin-top:8px;letter-spacing:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:3px;border:1px solid #94a3b8}
/* 学科 */
.subj-card{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.subj-card .ic{width:44px;height:44px;border-radius:12px;color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.subj-card .bd{flex:1;min-width:0}
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px}
.dist i{height:100%}
/* 通报 */
.report{background:linear-gradient(180deg,#fffdf5,#fff);border:1.5px solid #f2e8c9}
.report .rh{text-align:center;padding:8px 0 4px}
.report .rh .a{font-size:18px;font-weight:900;letter-spacing:2px}
.report .rh .b{font-size:12px;color:var(--mut);margin-top:4px}
.report p{font-size:14px;line-height:1.9;margin:10px 0;text-indent:2em}
.report .names{background:#faf7ec;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px;line-height:2}
.report .names b{color:#9a6b00}
footer{text-align:center;color:#94a3b8;font-size:11px;padding:16px 0 6px}
a{color:var(--c1)}
.lb{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;background:#f1f5f9;color:var(--ink);cursor:pointer;border:1.5px solid #e2e8f0;margin:3px}
.mini{width:30px;height:30px;line-height:27px;text-align:center;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#334155;font-weight:800;font-size:16px;cursor:pointer;padding:0}
.mini:hover{background:#f1f5f9}
.mini:active{transform:scale(.9)}
.srctag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:#eef2ff;color:#3b4cca;vertical-align:middle;white-space:nowrap}
.srctag.src-hw{background:#fdecea;color:#c62828}
.srctag.src-praise{background:#e8f5e9;color:#2e7d32}
.srctag.src-critic{background:#fdecea;color:#c62828}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);background:rgba(30,42,120,.96);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:700;z-index:999;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 6px 20px rgba(15,23,42,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 入场动画：仅在整视图切换(go)时触发，模块内 refresh 不重放 */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim .card{animation:up .3s ease both}
/* 关闭系统级下拉刷新，改由本站接管（避免与浏览器/微信原生下拉冲突） */
html,body{overscroll-behavior:none}
/* 下拉刷新 */
#ptr{position:fixed;left:0;right:0;top:0;z-index:90;padding-top:env(safe-area-inset-top,0px);height:0;overflow:hidden;display:flex;justify-content:center;pointer-events:none}
#ptr .ptr-box{margin-top:7px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:999px;padding:6px 15px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(30,58,138,.3);font-size:13px;font-weight:700;opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s}
#ptr.show .ptr-box{opacity:1;transform:scale(1)}
#ptr .ptr-ic{font-size:16px;transition:transform .2s;display:inline-block}
#ptr.spin .ptr-ic{animation:ptrspin .7s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
/* 下拉刷新提示胶囊样式在 #ptr 中；头部不再放置刷新按钮（小程序式下拉触发） */
/* 培优补差卡片 */
.py-card{border:1.5px solid #eef1f6;border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.py-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.py-name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.py-st{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;color:#123;white-space:nowrap}
.py-weak{font-size:11.5px;color:var(--mut);margin:4px 0 8px}
.py-counts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.py-ct{display:flex;align-items:center;gap:4px;background:#f6f8fc;border-radius:10px;padding:5px 8px}
.py-ct .lab{font-size:12px;color:var(--mut);margin-right:2px}
.py-ct b{min-width:18px;text-align:center;font-size:15px;color:#e65100}
.py-note{margin-top:9px;font-size:13px;padding:7px 10px}
.py-log{font-size:11.5px;color:var(--mut);margin-top:7px;line-height:1.6}
.py-log .lg{display:inline-block;background:#f1f5f9;border-radius:6px;padding:1px 7px;margin:2px 3px 0 0}
/* 作业芯片：仅靠颜色表达状态，无前缀符号 */
.hw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:7px;margin-top:8px}
.hw-chip{border-radius:11px;padding:12px 4px;font-size:14.5px;text-align:center;min-height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #dbe2ea;background:#fff;transition:.15s;font-weight:700;color:var(--ink)}
.hw-chip:active{transform:scale(.95)}
.hw-chip.done{background:#e8f5e9;border-color:#43a047;color:#2e7d32}
.hw-grid.mode-praise .hw-chip{border-color:#a5d6a7;box-shadow:inset 0 0 0 1px #a5d6a7}
.hw-grid.mode-critic .hw-chip{border-color:#ef9a9a;box-shadow:inset 0 0 0 1px #ef9a9a}
.hw-grid.mode-praise .hw-chip:active,.hw-grid.mode-critic .hw-chip:active{transform:scale(.92)}
/* 谈心谈话 */
.chat-item{position:relative;border:1.5px solid #eef1f6;border-radius:12px;padding:11px 12px;margin-bottom:9px;background:#fff;cursor:pointer;transition:.15s}
.chat-item:active{background:#f7f9ff}
.chat-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.chat-date{margin-left:auto;color:#94a3b8;font-size:11.5px}
.chat-text{font-size:13.5px;line-height:1.65;margin-top:5px;color:#334155;white-space:pre-wrap;word-break:break-word}
.chat-del{position:absolute;right:10px;bottom:8px;color:#ef5350;font-size:12px;cursor:pointer;padding:2px 6px}
/* 快捷入口 */
/* 快捷入口：3列彩色圆角图标卡 */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:7px;background:#fff;border-radius:16px;padding:14px 4px 11px;box-shadow:0 2px 10px rgba(15,23,42,.06);text-decoration:none;color:var(--ink);font-size:12px;font-weight:700;cursor:pointer;transition:.18s;border:1px solid #f1f5f9}
.quick a:active{transform:scale(.95);box-shadow:0 4px 14px rgba(15,23,42,.12)}
.quick a .qi{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--qc,#3b82f6);box-shadow:0 4px 12px rgba(0,0,0,.12);color:#fff}
/* 更新横幅 */
#upd{display:none;position:fixed;left:0;right:0;top:0;z-index:120;background:linear-gradient(135deg,#e53935,#ff8a65);color:#fff;text-align:center;padding:calc(11px + env(safe-area-inset-top,0px)) 11px 11px;font-weight:800;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.3);font-size:14px}
#upd small{display:block;font-weight:500;opacity:.92;font-size:11px;margin-top:2px}
/* 随机点名 弹层 */
#randMask{position:fixed;inset:0;background:linear-gradient(135deg,rgba(30,58,138,.94),rgba(109,40,217,.94));z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff}
#randMask.show{display:flex;animation:up .25s ease both}
#randName{font-size:62px;font-weight:900;letter-spacing:4px;text-shadow:0 6px 26px rgba(0,0,0,.4);line-height:1.1}
#randName.pop{animation:pop .42s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
#randSub{margin-top:16px;font-size:14px;opacity:.85}
#randClose{position:absolute;top:18px;right:22px;font-size:30px;cursor:pointer;opacity:.85}
/* 课程表 */
.subj-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.subj-chips .sc{display:inline-flex;align-items:center;gap:3px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;color:var(--ink);transition:.15s}
.subj-chips .sc:active{transform:scale(.95)}
.tt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;position:relative}
.tt-grid{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
.tt-grid th,.tt-grid td{border:1px solid #e6ebf2;padding:0}
.tt-grid th{background:#f1f5f9;font-size:12px;color:var(--mut);font-weight:700;padding:7px 4px}
.tt-grid .pr{background:#f8fafc;font-size:11.5px;color:var(--mut);font-weight:700;white-space:nowrap;min-width:52px;text-align:left;padding:6px 7px}
.tt-cell{width:64px;min-height:42px;padding:5px 3px;cursor:pointer;border-radius:7px;font-size:12.5px;font-weight:800;line-height:1.1;transition:.15s;color:#fff;text-align:center}
.tt-cell .tch{display:block;font-size:9px;font-weight:600;opacity:.92;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-cell.empty{background:#f6f8fb;color:#cbd5e1;font-weight:600}
.tt-cell.dim{opacity:.3}
.tt-cell.hot{box-shadow:0 0 0 3px var(--c1);transform:scale(1.05)}
.tt-cell:active{transform:scale(.96)}
.tt-grid th.today{background:#fee2e2;color:#dc2626;box-shadow:inset 0 -3px 0 #ef4444}
.tt-cell.now{box-shadow:0 0 0 3px #ef4444;outline:2.5px solid #ef4444;z-index:4}
.tt-grid .pr small{display:block;font-weight:600;color:#9aa7b8;font-size:9px;margin-top:1px}
.tt-nowline{position:absolute;left:0;height:0;border-top:2.5px solid #ef4444;z-index:6;pointer-events:none;display:none;box-shadow:0 0 6px rgba(239,68,68,.6)}
.tt-nowline span{position:absolute;left:2px;top:-10px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
/* 7天窄列模式：整周一屏放下，无需横向滚动 */
.tt-grid.narrow .tt-cell{width:43px;font-size:11px;padding:4px 2px}
.tt-grid.narrow .tch{font-size:8px}
.tt-grid.narrow .pr{min-width:44px;font-size:10.5px;padding:5px 5px}
#ttModal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:210;display:none;align-items:center;justify-content:center;padding:18px}
#ttModal.show{display:flex}
.ttcard{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:340px;box-shadow:0 12px 40px rgba(15,23,42,.3)}
/* 导入对话框 */
#impModal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:220;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
#impModal.show{display:flex}
.impcard{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:390px;box-shadow:0 12px 40px rgba(15,23,42,.3);max-height:92vh;overflow:auto}
.imp-h{font-size:16px;font-weight:800;margin-bottom:2px}
.imp-note{font-size:12px;color:var(--mut);line-height:1.6;margin:6px 0}
.imp-row{margin:11px 0}
.imp-row>label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px;font-weight:700}
.imp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.imp-chips .ic{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.imp-btns{display:flex;gap:8px;margin-top:14px}
.imp-btns button{flex:1;min-height:46px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;border:2px solid #e2e8f0}
.imp-btns .ok{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent}
.imp-btns .no{background:#fff;color:var(--mut)}
/* 备忘录 */
.memo-list{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.memo-item{background:#fffbeb;border-left:4px solid #f4c430;border-radius:10px;padding:10px 12px;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.memo-txt{font-size:14px;line-height:1.45;color:#3a3320;white-space:pre-wrap;word-break:break-word}
.memo-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.memo-time{font-size:11px;color:#a98b2e}
.memo-del{color:#c79a2e;font-size:13px;cursor:pointer;padding:2px 4px}
.memo-del:active{opacity:.6}
/* 待办 */
.todo-add{display:flex;gap:8px;margin-top:4px}
.todo-add input{flex:1}
.todo-stat{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);margin:10px 0 5px;font-weight:700}
.todo-pct{color:var(--c1)}
.bar{height:7px;background:#edf1f6;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:99px;transition:.3s}
.todo-clear{font-size:12px;color:#94a3b8;cursor:pointer}
.todo-clear:active{opacity:.6}
.todo-list{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.todo-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #eef1f6;border-radius:11px;padding:11px 12px;cursor:pointer;transition:.15s}
.todo-item:active{transform:scale(.99)}
.todo-item.done{background:#f6f8fb}
.todo-check{flex:0 0 22px;height:22px;width:22px;border-radius:50%;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900}
.todo-item.done .todo-check{background:var(--c1);border-color:var(--c1)}
.todo-text{flex:1;font-size:14px;line-height:1.4;word-break:break-word}
.todo-item.done .todo-text{color:#aab3c0;text-decoration:line-through}
.todo-del{flex:0 0 auto;color:#cdd5e0;font-size:14px;padding:2px 4px}
.todo-del:active{color:#ef5350}
/* ============ 设计升级：图表 / 趋势 / 质感 ============ */
:root{--sh-1:0 1px 3px rgba(15,23,42,.06);--sh-2:0 10px 30px -16px rgba(30,58,138,.22)}
.card{box-shadow:var(--sh-1),var(--sh-2)}
.kpi{box-shadow:var(--sh-1),var(--sh-2)}
.card h3{letter-spacing:.3px}
/* 图表容器 */
.panel{background:var(--card);border-radius:16px;padding:13px 14px 11px;margin-bottom:12px;box-shadow:var(--sh-1),var(--sh-2)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.panel-h span:first-child{font-size:14.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px}
.panel-h span:first-child::before{content:"";width:4px;height:15px;border-radius:2px;background:linear-gradient(var(--c1),var(--c2))}
.panel-tag{font-size:11px;font-weight:700;color:var(--mut);background:#f1f5f9;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chart{width:100%;display:block;margin:6px 0 2px}
.chart-legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 2px 2px;font-size:11.5px;color:var(--mut)}
.lg-item{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.lg-item i{width:11px;height:11px;border-radius:3px;display:inline-block}
/* 各科走势·小图并列（small multiples，互不重叠、全部显示） */
.trend-grid{display:grid;gap:9px;margin-top:8px}
.trend-cell{background:#f8fafc;border:1px solid #eef1f6;border-radius:12px;padding:7px 8px 2px}
.tc-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#334155;margin-bottom:1px}
.tc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tc-v{margin-left:auto;font-size:14px;font-weight:900;color:#1e293b;font-variant-numeric:tabular-nums}
.trend-cv{width:100%;display:block}
/* 历次成绩总表 */
.hs-chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.hs-chips::-webkit-scrollbar{display:none}
.hs-chips button{flex-shrink:0;border:1.5px solid #e2e8f0;background:#fff;color:#334155;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.hs-chips button.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(30,58,138,.25)}
.hs-chips button:active{transform:scale(.95)}
.hs-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #eef1f6;border-radius:12px;background:#fff}
.hs-table{border-collapse:collapse;font-size:12px;min-width:100%}
.hs-table th,.hs-table td{padding:6px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid #f1f5f9}
.hs-table thead th{position:sticky;top:0;background:#f8fafc;font-size:11px;color:#64748b;z-index:2;box-shadow:0 1px 0 #e2e8f0}
.hs-table .hs-rk{position:sticky;left:0;background:#fff;font-weight:800;color:#64748b;z-index:1;min-width:34px}
.hs-table .hs-name{position:sticky;left:35px;background:#fff;font-weight:800;color:#1e293b;z-index:1;text-align:left;min-width:56px;box-shadow:1px 0 0 #eef1f6}
.hs-table thead .hs-rk,.hs-table thead .hs-name{background:#f8fafc;z-index:3}
.hs-td b{font-variant-numeric:tabular-nums;color:#0f172a}
.hs-rkmini{display:block;font-size:10px;line-height:1.25;color:#334155;font-weight:600;margin-top:2px;white-space:nowrap}
.hs-td[style*="background"] .hs-rkmini{color:rgba(20,30,45,.82)}
.hs-spark{width:96px;height:30px;max-width:96px;max-height:30px;display:block;margin:auto}
.hs-table th:last-child,.hs-table td:last-child{min-width:108px}
.hs-td{min-width:76px;max-width:120px}
.hs-td b{font-size:13px}
.hs-foot{font-size:11px;color:var(--mut);margin-top:7px}
/* 概览 sparkline */
.spark-card .spark-top{display:flex;align-items:baseline;justify-content:space-between}
.spark-card .spark-top b{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.spark-card .spark-top span{font-size:13px;color:var(--mut);font-weight:700}
.spark-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:2px}
.spark-chg.up{color:var(--ok);font-weight:800}
.spark-chg.down{color:var(--red);font-weight:800}
/* 进步 / 退步排行 */
.rank-row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px}
.rk-n{width:62px;flex-shrink:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-bar{flex:1;height:10px;background:#eef1f6;border-radius:99px;overflow:hidden}
.rk-bar i{display:block;height:100%;border-radius:99px}
.rk-bar i.up{background:linear-gradient(90deg,#66bb6a,#43a047)}
.rk-bar i.down{background:linear-gradient(90deg,#ef5350,#e53935)}
.rk-v{width:42px;text-align:right;font-weight:800;flex-shrink:0}
.rk-v.up{color:var(--ok)} .rk-v.down{color:var(--red)}
/* 底部 Tab 选中指示条 */
#tabbar button{position:relative}
#tabbar button.on::after{content:"";position:absolute;top:1px;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 1px 3px rgba(30,58,138,.4)}
#tabbar button.on .ic{filter:drop-shadow(0 2px 4px rgba(30,58,138,.35))}
/* 卡片标题图标统一风格 */
.card h3 .ico{width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;margin-right:2px}
/* 列表行更细腻 */
tr.rowc:hover{background:#f5f7ff}
/* 按钮质感 */
.bigbtn{transition:transform .15s,box-shadow .15s}
.bigbtn:hover{box-shadow:var(--sh-2)}
/* 空状态更友好 */
.empty{color:#aab4c4;text-align:center;padding:34px 12px;font-size:13.5px;background:#fafbfd;border:1px dashed #e2e8f0;border-radius:12px;margin:6px 0}
/* chip 悬浮质感 */
.chip{transition:.15s;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.chip:hover{box-shadow:0 3px 10px rgba(15,23,42,.12)}
/* 一生一档增强 */
.pf-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.pf-tag{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);color:#fff}
.diag{background:linear-gradient(135deg,#f5f8ff,#eef2ff);border:1.5px solid #dbe3f5;border-radius:14px;padding:13px 14px;font-size:13.5px;line-height:1.95;color:#1e2a44}
.diag b{color:var(--c1)}
.diag .edge{font-weight:800;color:var(--red)}
.subj-table{border-collapse:collapse;font-size:12px;width:100%}
.subj-table th,.subj-table td{padding:7px 5px;text-align:center;white-space:nowrap;border-bottom:1px solid #f1f5f9}
.subj-table thead th{position:sticky;top:0;background:#f8fafc;color:#64748b;font-size:11px;box-shadow:0 1px 0 #e2e8f0}
.subj-table .sname{text-align:left;font-weight:800}
.subj-table .best{background:linear-gradient(90deg,rgba(102,187,106,.16),rgba(102,187,106,0))}
.subj-table .worst{background:linear-gradient(90deg,rgba(229,57,53,.14),rgba(229,57,53,0))}
.subj-table .sc{color:#fff;font-weight:800;border-radius:5px;padding:2px 8px;display:inline-block;min-width:34px}
.local-arc{background:#fbfcfe;border:1.5px solid #eef1f6;border-radius:14px;padding:12px}
.local-arc .arc-block{margin:11px 0 3px;padding-top:10px;border-top:1px dashed #e8edf3}
.local-arc .arc-block:first-child{border-top:none;margin-top:2px;padding-top:0}
.local-arc .arc-h{font-size:13px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.local-arc .arc-h .cnt{font-size:11px;font-weight:700;color:var(--mut);background:#eef2f7;padding:1px 9px;border-radius:999px}
.local-arc .arc-item{font-size:12.5px;line-height:1.6;color:#334155;margin:3px 0}
.local-arc .arc-note{background:#fff8e1;border:1px solid #f5e8b8;border-radius:8px;padding:7px 10px;font-size:12.5px;color:#5d4b00;line-height:1.6;margin:4px 0}
.muted{color:var(--mut);font-size:12px}
/* 达本轨迹 步骤条 */
.et-track{display:flex;align-items:stretch;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 2px}
.et-node{flex:0 0 auto;min-width:108px;background:#fff;border:1.5px solid #e8edf3;border-radius:14px;padding:10px 12px;text-align:center;box-shadow:0 1px 4px rgba(30,58,138,.05)}
.et-exam{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.et-node .badge{margin:7px auto 6px;display:block;width:max-content;font-size:11px}
.et-z{font-size:14px;font-weight:800;color:#1e2a44}
.et-chg{font-size:11px;font-weight:800;margin-top:4px}
.et-chg.up{color:#2e7d32}
.et-chg.dn{color:#c62828}
.et-arrow{flex:0 0 auto;align-self:center;color:#94a3b8;font-size:18px;font-weight:800;padding:0 4px}
/* 分享按钮（一生一档顶部） */
.pf-share{background:#fff!important;color:var(--c1)!important;border:1.5px solid var(--c1)!important;font-weight:700;cursor:pointer}
/* ===== 家长查询模式（body.parent） ===== */
body.parent #tabbar,body.parent #ptr,body.parent #upd{display:none}
body.parent #subnav,body.parent #examBar{display:none!important}
body.parent .pf-share{display:none}
body.parent .pf-tag.teacher-only{display:none}
.pq-card{max-width:460px;margin:14px auto;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:20px;padding:24px 20px;box-shadow:0 10px 30px rgba(30,58,138,.32)}
.pq-title{font-size:21px;font-weight:900;letter-spacing:.5px}
.pq-sub{font-size:13px;opacity:.92;margin:5px 0 16px}
.pq-input{width:100%;padding:14px 15px;border:none;border-radius:13px;font-size:16px;outline:none;box-sizing:border-box;-webkit-appearance:none}
.pq-btn{margin-top:12px;width:100%;padding:14px;border:none;border-radius:13px;background:#fff;color:var(--c1);font-size:16px;font-weight:800;cursor:pointer}
.pq-hint{font-size:12px;opacity:.85;margin-top:14px;line-height:1.7}
.pq-cands{margin-top:12px}
.pq-cands .c{display:block;width:100%;text-align:left;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;padding:11px 14px;border-radius:11px;margin:7px 0;font-size:15px;font-weight:700;cursor:pointer}
.pq-cands .c:active{background:rgba(255,255,255,.28)}
/* 分享家长查询页（弹层） */
.hd-right{display:flex;align-items:center;gap:8px}
#shareLinkMask{position:fixed;inset:0;z-index:220;background:rgba(15,23,42,.85);display:none;align-items:center;justify-content:center;padding:20px}
#shareLinkMask.show{display:flex}
#shareLinkMask .card{background:#fff;border-radius:18px;padding:22px 20px;width:100%;max-width:330px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:up .25s ease both}
#shareLinkMask .stitle{font-size:17px;font-weight:800;color:#1e3a8a}
#shareLinkMask .sub{font-size:12px;color:#64748b;margin:6px 0 16px;line-height:1.7}
#shareLinkMask .qrimg{width:196px;height:196px;border-radius:12px;margin:0 auto 14px;background:#f1f5f9;object-fit:contain;display:block}
#shareLinkMask .qrerr{display:none;font-size:12px;color:#ef4444;margin:-6px 0 12px}
#shareLinkMask .linkbox{background:#f1f5f9;border-radius:10px;padding:10px 12px;font-size:12px;color:#0f172a;word-break:break-all;text-align:left;line-height:1.5;max-height:80px;overflow:auto;margin-bottom:14px}
#shareLinkMask .acts{display:flex;gap:10px}
#shareLinkMask .acts button{flex:1;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
#shareLinkMask .acts .cp{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}
#shareLinkMask .acts .op{background:#e2e8f0;color:#1e293b}
#shareLinkMask .cls{margin-top:12px;font-size:13px;color:#94a3b8;cursor:pointer}
</style>
</head>
<body>

<!-- 下拉刷新指示器 -->
<div id="ptr"><div class="ptr-box"><span class="ptr-ic">↓</span><span class="ptr-t">下拉刷新</span></div></div>

<!-- 更新横幅 -->
<div id="upd" onclick="location.reload(true)">🎉 发现新版本，点击此处立即刷新<small>继续用旧版也可，但建议刷新体验最新功能</small></div>

<!-- 随机点名 抽取弹层 -->
<div id="randMask"><span id="randClose" onclick="randClose()">✕</span><div id="randName">准备</div><div id="randSub">点击下方按钮开始随机点名</div></div>

<!-- 分享家长查询页 弹层 -->
<div id="shareLinkMask" onclick="if(event.target===this)shareLinkClose()">
  <div class="card">
    <div class="stitle">📤 分享家长查询页</div>
    <div class="sub">家长打开后输入孩子姓名即可查询成绩、排名与学情。<br>把链接发到家长群，或让家长扫码打开。</div>
    <img class="qrimg" id="slQR" alt="家长查询页二维码">
    <div class="qrerr" id="slQRErr">二维码需联网生成，请直接复制下方链接发送</div>
    <div class="linkbox" id="slLink"></div>
    <div class="acts">
      <button class="cp" onclick="shareLinkCopy()">📋 复制链接</button>
      <button class="op" onclick="shareLinkOpen()">🔗 打开预览</button>
    </div>
    <div class="cls" onclick="shareLinkClose()">关闭</div>
  </div>
</div>

<!-- 课程表 单元格编辑弹窗 -->
<div id="ttModal"><div class="ttcard">
  <div class="ttbody"></div>
  <div style="text-align:right;margin-top:10px;padding-top:8px;border-top:1px solid #eef1f6"><span style="color:#94a3b8;font-size:13px;cursor:pointer" onclick="document.getElementById('ttModal').classList.remove('show')">取消</span></div>
</div></div>

<!-- 数据导入 映射弹窗 -->
<div id="impModal"><div class="impcard" id="impBody"></div></div>

<!-- 主应用 -->
<div id="app">
  <header>
    <div class="hd-top">
      <div class="hd-title">
        <div class="t1">高三16班 · 班级工作台</div>
        <div class="t2" id="hSub"></div>
      </div>
      <div class="hd-right">
        <div class="hd-date" id="hDate"></div>
      </div>
    </div>
    <div id="examBar"></div>
    <div id="subnav"></div>
  </header>
  <main id="main"></main>
  <div id="toast"></div>
  <footer id="foot"></footer>
  <nav id="tabbar"></nav>

/* ---------- 零依赖 Excel(.xlsx) 生成器：store-zip + OOXML inlineStr（无需任何外部库，离线可用） ---------- */
function xlsxDownload(filename, sheets){
  const enc=new TextEncoder();
  const crcTab=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=crcTab[(c^u[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  const colRef=c=>{let s="";c++;while(c>0){s=String.fromCharCode(65+(c-1)%26)+s;c=Math.floor((c-1)/26);}return s;};
  const xesc=s=>esc(s==null?"":s);
  const sheetXml=rows=>{let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>`;
    rows.forEach((r,ri)=>{x+=`<row r="${ri+1}">`;r.forEach((c,ci)=>{const ref=colRef(ci)+(ri+1);
      if(typeof c==="number"&&isFinite(c))x+=`<c r="${ref}"><v>${c}</v></c>`;
      else x+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(c)}</t></is></c>`;});x+=`</row>`;});
    return x+`</sheetData></worksheet>`;};
  const names=sheets.map(s=>String(s.name||"Sheet").replace(/[\\/*?:\[\]]/g,"").slice(0,31)||"Sheet");
  const sxml=sheets.map(s=>sheetXml(s.rows));
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${names.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdWb" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${names.map((n,i)=>`<sheet name="${xesc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`;
  const wbRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${names.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}</Relationships>`;
  const files=[["[Content_Types].xml",ct],["_rels/.rels",rels],["xl/workbook.xml",wb],["xl/_rels/workbook.xml.rels",wbRels]];
  sxml.forEach((x,i)=>files.push([`xl/worksheets/sheet${i+1}.xml`,x]));
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  const parts=[], central=[]; let offset=0;
  files.forEach(([name,content])=>{
    const nb=enc.encode(name), db=enc.encode(content), crc=crc32(db);
    const lp=new Uint8Array([0x50,0x4b,0x03,0x04, 0x14,0, 0,0, 0,0, 0,0, 0,0, ...u32(crc), ...u32(db.length), ...u32(db.length), ...u16(nb.length), ...u16(0), ...nb, ...db]);
    parts.push(lp);
    central.push(new Uint8Array([0x50,0x4b,0x01,0x02, 0x14,0, 0x14,0, 0,0, 0,0, 0,0, 0,0, ...u32(crc), ...u32(db.length), ...u32(db.length), ...u16(nb.length), ...u16(0), ...u16(0), ...u16(0), 0,0, 0,0,0,0, ...u32(offset), ...nb]));
    offset+=lp.length;
  });
  const cenLen=central.reduce((a,c)=>a+c.length,0);
  const end=new Uint8Array([0x50,0x4b,0x05,0x06,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cenLen),...u32(offset),0,0]);
  const total=parts.reduce((a,c)=>a+c.length,0)+cenLen+end.length;
  const out=new Uint8Array(total); let pos=0;
  parts.forEach(c=>{out.set(c,pos);pos+=c.length;}); central.forEach(c=>{out.set(c,pos);pos+=c.length;}); out.set(end,pos);
  const b=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const u=URL.createObjectURL(b), a=document.createElement("a"); a.href=u; a.download=filename; a.click(); URL.revokeObjectURL(u);
}

function drawLineChart(cv,o){
  const {c,W,H}=setupHi(cv);const pad={l:38,r:12,t:16,b:26};const L=(o.labels||[]).map(shortEx),S=o.series||[];
  let all=[];S.forEach(s=>(s.data||[]).forEach(v=>{if(v!=null&&isFinite(v))all.push(v);}));if(!all.length)return;
  // 横轴防重叠：短名仍放不下时两行交错显示（偶数行在上、奇数行在下）
  c.font="10px -apple-system,sans-serif";
  const axGap=L.length>1?(W-pad.l-pad.r)/(L.length-1):W;
  const axW=L.length?Math.max.apply(null,L.map(t=>t.length*10+2)):0;

  // invertY: 名次轴翻转——rank 1（最好）在顶部，rank N 在底部，进步（名次变小）= 线向上
  const yf=v=>o.invertY?pad.t+(H-pad.t-pad.b)*((v-ymin)/(ymax-ymin)):pad.t+(H-pad.t-pad.b)*(1-(v-ymin)/(ymax-ymin));

    d.forEach((v,i)=>{if(v==null)return;c.fillStyle=s.color;c.beginPath();c.arc(xf(i),yf(v),3.2,0,7);c.fill();c.lineWidth=2;c.strokeStyle="#fff";c.stroke();});
  });
}
function drawBarChart(cv,o){
  const {c,W,H}=setupHi(cv);const pad={l:38,r:12,t:16,b:26};const L=o.labels||[],S=o.series||[],stk=o.stacked;
  let all=[];S.forEach(s=>(s.data||[]).forEach(v=>{if(v!=null)all.push(v);}));if(!all.length)return;
  let ymax=o.yMax!=null?o.yMax:Math.max.apply(null,all);ymax=ymax*1.1||1;
  const x0=pad.l,x1=W-pad.r,yf=v=>pad.t+(H-pad.t-pad.b)*(1-v/ymax);
  c.font="10px -apple-system,sans-serif";c.textAlign="right";c.textBaseline="middle";
  const tk=4;for(let i=0;i<=tk;i++){const v=ymax*i/tk,yy=yf(v);c.strokeStyle="#eef1f6";c.lineWidth=1;c.beginPath();c.moveTo(x0,yy);c.lineTo(x1,yy);c.stroke();c.fillStyle="#94a3b8";c.fillText(Math.round(v),x0-4,yy);}
  const n=L.length,gap=0.3,groupW=(x1-x0)/n,bw=stk?groupW*(1-gap):groupW*(1-gap)/S.length;
  L.forEach((lb,i)=>{const gx=x0+groupW*i+groupW*gap/2;
    if(stk){let acc=0;S.forEach(s=>{const v=s.data?.[i]||0,y0=yf(acc),y1=yf(acc+v);c.fillStyle=s.color;c.fillRect(gx,y1,bw,y0-y1);acc+=v;});c.fillStyle="#64748b";c.textAlign="center";c.textBaseline="top";c.fillText(lb,gx+bw/2,H-pad.b+5);}
    else{S.forEach((s,j)=>{const v=s.data?.[i]||0,y1=yf(v);c.fillStyle=s.color;c.fillRect(gx+bw*j+1,y1,bw-2,(H-pad.b)-y1);});c.fillStyle="#64748b";c.textAlign="center";c.textBaseline="top";c.fillText(lb,gx+groupW*(1-gap)/2,H-pad.b+5);}
  });
}
function drawRadar(cv,o){
  const {c,W,H}=setupHi(cv);const L=o.labels||[],S=o.series||[],mx=o.max||100,cx=W/2,cy=H/2+4,R=Math.min(W,H)/2-26,N=L.length;if(N<3)return;

  for(let ring=1;ring<=4;ring++){const rr=R*ring/4;c.beginPath();L.forEach((_,i)=>{const a=ang(i),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?c.lineTo(x,y):c.moveTo(x,y);});c.closePath();c.fill();c.stroke();}

  L.forEach((lb,i)=>{const a=ang(i),x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;c.strokeStyle="#e8edf3";c.beginPath();c.moveTo(cx,cy);c.lineTo(x,y);c.stroke();c.fillStyle="#64748b";c.fillText(lb,x+Math.cos(a)*12,y+Math.sin(a)*12);});
  S.forEach(s=>{c.beginPath();L.forEach((_,i)=>{const a=ang(i),rr=R*(Math.max(0,Math.min(mx,s.data[i]||0))/mx),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?c.lineTo(x,y):c.moveTo(x,y);});c.closePath();c.fillStyle=s.fill||"rgba(30,58,138,.12)";c.fill();c.strokeStyle=s.color;c.lineWidth=2;c.stroke();});
}
function drawDonut(cv,o){const {c,W,H}=setupHi(cv);const cx=W/2,cy=H/2,R=Math.min(W,H)/2-4,r=R*0.62;c.lineWidth=R-r;c.beginPath();c.arc(cx,cy,(R+r)/2,0,7);c.strokeStyle="#eef1f6";c.stroke();const frac=Math.max(0,Math.min(1,(o.value||0)/(o.max||1)));c.beginPath();c.arc(cx,cy,(R+r)/2,-Math.PI/2,-Math.PI/2+frac*7,false);c.strokeStyle=o.color||"#1e3a8a";c.stroke();c.fillStyle="#1a2233";c.textAlign="center";c.textBaseline="middle";c.font="800 20px -apple-system,sans-serif";c.fillText(o.label||Math.round(frac*100)+"%",cx,cy-5);if(o.sub){c.fillStyle="#94a3b8";c.font="11px sans-serif";c.fillText(o.sub,cx,cy+15);}}

function drawSpark(cv,o){const {c,W,H}=setupHi(cv);const d=o.data||[];if(d.length<2)return;const pad=5,mn=Math.min.apply(null,d),mx=Math.max.apply(null,d),rng=(mx-mn)||1;const x=i=>pad+(W-2*pad)*i/(d.length-1),y=v=>H-pad-(H-2*pad)*((v-mn)/rng);c.strokeStyle=o.color||"#1e3a8a";c.lineWidth=d.length>6?1.8:2.6;c.lineJoin="round";c.beginPath();d.forEach((v,i)=>{const xx=x(i),yy=y(v);i?c.lineTo(xx,yy):c.moveTo(xx,yy);});c.stroke();c.fillStyle=o.color||"#1e3a8a";c.beginPath();c.arc(x(d.length-1),y(d[d.length-1]),d.length>6?2.6:3.4,0,7);c.fill();}
/* 迷你折线（small multiples 单科专用）：每科独立纵轴，互不重叠；o.tags 可在数据点上方标注（如班级排名） */
function drawMiniLine(cv,o){
  const {c,W,H}=setupHi(cv);const d=o.data||[];const vals=d.filter(v=>v!=null&&isFinite(v));
  const pad={l:6,r:6,t:o.tags?16:8,b:6};
  if(vals.length===0){c.fillStyle="#94a3b8";c.font="11px sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText("无数据",W/2,H/2);return;}
  let mn=o.yMin!=null?o.yMin:Math.min.apply(null,vals), mx=o.yMax!=null?o.yMax:Math.max.apply(null,vals);
  if(mn===mx){const h=(o.rangeHint||10);mn-=h;mx+=h;}
  const p=(mx-mn)*0.16;if(o.yMin==null)mn-=p;if(o.yMax==null)mx+=p;
  if(mx<=mn)mx=mn+1;
  const n=d.length, xf=i=> n>1? pad.l+(W-pad.l-pad.r)*i/(n-1) : W/2;
  // invertY：名次轴翻转——rank 1（最好）在顶部，进步（名次变小）= 线向上
  const yf=v=> o.invertY? pad.t+(H-pad.t-pad.b)*((v-mn)/(mx-mn)) : pad.t+(H-pad.t-pad.b)*(1-(v-mn)/(mx-mn));
  c.strokeStyle="#eef2f7";c.lineWidth=1;
  [0,.5,1].forEach(t=>{const yy=pad.t+(H-pad.t-pad.b)*t;c.beginPath();c.moveTo(pad.l,yy);c.lineTo(W-pad.r,yy);c.stroke();});
  c.strokeStyle=o.color||"#1e3a8a";c.lineWidth=2.2;c.lineJoin="round";c.beginPath();let st=false;
  d.forEach((v,i)=>{if(v==null){st=false;return;}const xx=xf(i),yy=yf(v);if(!st){c.moveTo(xx,yy);st=true;}else c.lineTo(xx,yy);});c.stroke();
  d.forEach((v,i)=>{if(v==null)return;c.fillStyle=o.color;c.beginPath();c.arc(xf(i),yf(v),3,0,7);c.fill();c.lineWidth=1.6;c.strokeStyle="#fff";c.stroke();});
  if(o.tags){c.font="800 9.5px -apple-system,sans-serif";c.textAlign="center";c.textBaseline="bottom";
    d.forEach((t,i)=>{if(t==null||d[i]==null)return;c.fillStyle="#334155";c.fillText(String(t),xf(i),yf(d[i])-6);});}
}
/* 各科走势小图并列：title 标题，items=[{name,color,data,tags}]，opts={id,tag,cols,cellH,unit,yFix,tags} */
function trendGrid(title,items,opts){
  opts=opts||{};const cols=opts.cols||2,cellH=opts.cellH||104,id=opts.id||"tg";
  let h=`<div class="panel"><div class="panel-h"><span>${title}</span><span class="panel-tag">${opts.tag||""}</span></div>`;
  if(opts.note)h+=`<div class="note" style="margin:2px 0 0">${opts.note}</div>`;
  h+=`<div class="trend-grid" style="grid-template-columns:repeat(${cols},1fr)">`;
  items.forEach((it,i)=>{
    const arr=(it.data||[]),latest=[...arr].reverse().find(v=>v!=null);
    h+=`<div class="trend-cell"><div class="tc-h"><span class="tc-dot" style="background:${it.color}"></span>${it.name}<b class="tc-v">${latest!=null?latest+(opts.unit||""):""}</b></div><canvas id="${id}${i}" class="trend-cv" height="${cellH}" style="width:100%;height:${cellH}px"></canvas></div>`;
  });
  h+=`</div></div>`;
  items.forEach((it,i)=>chartDraw(id+i,{color:it.color,data:it.data,tags:opts.tags?opts.tags[i]:undefined,yMin:opts.yFix?opts.yFix[0]:undefined,yMax:opts.yFix?opts.yFix[1]:undefined,rangeHint:opts.rangeHint,invertY:opts.invertY},drawMiniLine));

}

/* ---------- 下拉刷新（小程序式：顶部下拉手势，触屏/鼠标均可，无按钮） ---------- */
let ptrActive=false,ptrDrag=false,ptrStartY=0,ptrPull=0;const PTR_MAX=84,PTR_TH=54;
const _ptr=()=>document.getElementById("ptr");
function ptrState(s){const b=_ptr();b.classList.toggle("show",s!=="idle");b.classList.toggle("spin",s==="spin");const ic=b.querySelector(".ptr-ic"),tx=b.querySelector(".ptr-t");
  if(s==="idle"){b.style.height="0px";}
  else if(s==="pull"){ic.textContent="↓";tx.textContent="下拉刷新";}
  else if(s==="armed"){ic.textContent="↑";tx.textContent="释放刷新";}
  else if(s==="spin"){ic.textContent="⟳";tx.textContent="刷新中…";}}
function onPtrDown(e){if(window.scrollY>0)return;const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable))return;ptrActive=true;ptrDrag=false;ptrStartY=e.clientY;}
function onPtrMove(e){if(!ptrActive)return;const dy=e.clientY-ptrStartY;if(dy<=0){ptrPull=0;_ptr().style.height="0px";ptrState("idle");return;}if(window.scrollY>0){ptrPull=0;_ptr().style.height="0px";ptrState("idle");return;}
  if(dy>6){ptrDrag=true;if(e.cancelable)e.preventDefault();}
  if(!ptrDrag)return;
  ptrPull=Math.min(dy*0.5,PTR_MAX);_ptr().style.height=ptrPull+"px";
  ptrState(ptrPull>=PTR_TH?"armed":"pull");}
function onPtrUp(){if(!ptrActive)return;ptrActive=false;if(ptrDrag&&ptrPull>=PTR_TH){ptrState("spin");setTimeout(doRefresh,460);}else{ptrPull=0;ptrState("idle");}ptrDrag=false;}
function doRefresh(){try{refresh();}catch(e){}try{checkUpdate();}catch(e){}toast("🔄 已刷新");setTimeout(()=>{ptrPull=0;ptrState("idle");},560);}
document.addEventListener("pointerdown",onPtrDown,{passive:true});
document.addEventListener("pointermove",onPtrMove,{passive:false});
document.addEventListener("pointerup",onPtrUp,{passive:true});
document.addEventListener("pointercancel",onPtrUp,{passive:true});

/* 一生一档综合诊断 */
function profileDiag(s){
  const cur=CUR_EXAM, subs=SUBJ_SCORED.filter(x=>s.s[x]!=null);
  const rate=sub=>+(s.s[sub]/FULL[sub]*100).toFixed(1);
  const rk=sub=>{const m=rankMap(cur,sub);return m[s.n]!=null?m[s.n]:null;};
  let best=subs[0],worst=subs[0];
  subs.forEach(sub=>{if(rate(sub)>rate(best))best=sub;if(rate(sub)<rate(worst))worst=sub;});
  const seg=[];
  if(s.r!=null)seg.push(`班内第 <b>${s.r}</b> 名`);
  if(s.l!=null)seg.push(`理科第 <b>${s.l}</b> 名`);
  let prog='';
  if(s.p!=null)prog=s.p>0?`较上场 <b class="tag-up">进步 ${s.p} 名</b> 👏`:s.p<0?`较上场 <b class="tag-down">退步 ${-s.p} 名</b>`:`较上场 <b>持平</b>`;
  const bestTxt=best?`强势 <b style="color:${SCOL[best]}">${best}</b>（班内第${rk(best)}，得分率${rate(best)}%）`:'';
  const weakTxt=worst&&worst!==best?`薄弱 <b style="color:${SCOL[worst]}">${worst}</b>（班内第${rk(worst)}${((s.w||[]).includes(worst))?'，弱科⚠':''}）`:'';
  const edgeMap={y:"已稳达本一，保持优势",u:"本一线上10分临界，重点帮扶",d:"本一线下10分临界，冲刺突破",b:"达本科线",n:"未达本科，需重点关注",x:"暂无成绩数据"};
  return {loc:seg.join(' · '),prog,bestTxt,weakTxt,edge:edgeMap[s.e]||'',best,worst};
}

/* 各科明细（历次对比表） */
function subjDetailTable(s,best,worst){
  const exs=EXAMS(),iC=exs.indexOf(CUR_EXAM),iB=Math.max(0,iC-1),baseE=exs[iB],curE=CUR_EXAM,cls=stu();
  const list=SUBJ_SCORED.filter(x=>s.s[x]!=null);
  if(!list.length)return '';
  let rows='';
  list.forEach(sub=>{
    const allv=cls.filter(x=>x.s[sub]!=null).map(x=>x.s[sub]);
    const mn=Math.min.apply(null,allv),mx=Math.max.apply(null,allv);
    const vals=examStuSubj(s.n,sub),rks=examStuSubjRank(s.n,sub);
    const bV=vals[iB],curV=vals[iC],curRk=rks[iC],bRk=rks[iB];
    const curRate=curV!=null?+(curV/FULL[sub]*100).toFixed(1):null;
    const cavg=EX().stats.subAvg[sub];
    const diff=(curV!=null&&cavg!=null)?+(curV-cavg).toFixed(1):null;
    const dScore=(bV!=null&&curV!=null)?+(curV-bV).toFixed(1):null;
    const dRank=(bRk!=null&&curRk!=null)?(bRk-curRk):null;
    const isBest=best===sub,isWorst=worst===sub;
    const cls2=isBest?'best':(isWorst?'worst':'');
    const score=curV!=null?`<td><span class="sc" style="background:${heatColor(curV,mn,mx)}">${curV}</span></td>`:'<td>—</td>';
    const dSc=dScore!=null?`<td class="${dScore>=0?'tag-up':'tag-down'}">${dScore>0?'+':''}${dScore}</td>`:'<td>—</td>';
    const dRk=dRank!=null?`<td class="${dRank>0?'tag-up':(dRank<0?'tag-down':'')}">${dRank>0?'+'+dRank:(dRank<0?dRank:'0')}</td>`:'<td>—</td>';
    rows+=`<tr class="${cls2}"><td class="sname" style="color:${SCOL[sub]}">${sub}${isBest?' 🏆':''}${isWorst?' ⚠':''}</td><td>${bV!=null?bV:'—'}</td>${score}<td>${curRate!=null?curRate+'%':'—'}</td><td>${curRk!=null?'第'+curRk:'—'}</td><td class="${diff!=null?(diff>=0?'tag-up':'tag-down'):''}">${diff!=null?(diff>0?'+':'')+diff:'—'}</td>${dSc}${dRk}</tr>`;
  });
  return `<div class="card"><h3>各科明细（历次对比）</h3><div style="overflow-x:auto"><table class="subj-table"><thead><tr><th>学科</th><th>上场分</th><th>${curE}</th><th>得分率</th><th>班内排名</th><th>班均差</th><th>Δ分</th><th>Δ名</th></tr></thead><tbody>${rows}</tbody></table></div><div class="note" style="margin-top:6px">色块=当前场分数（绿优红弱）；班均差=当前分−当前班均；Δ分/Δ名=对比<b>上一场（${shortEx(baseE)}）</b>的变化（Δ名&gt;0 表示名次前移）。</div></div>`;
}

function pyCard(x){

  const py=P.peiyou||0, bc=P.bucha||0, note=P.note||"", log=P.log||[];

  const logTxt=log.length?log.slice().reverse().slice(0,4).map(e=>`<span class="lg">${(e.t||"").slice(5)} ${lab(e.type)}</span>`).join("")+(log.length>4?`<span class="lg">…共${log.length}次</span>`:""):'<span style="color:#b6c0cf">暂无记录，点"＋"即记一次</span>';
  return `<div class="py-card">

    <div class="py-log">📒 记录：${logTxt}</div>

function pyAdd(name,type,delta){
  const P=LS("g16_py",{}); if(!P[name])P[name]={peiyou:0,bucha:0,note:"",log:[]};
  const o=P[name]; o[type]=Math.max(0,(o[type]||0)+delta); o.log=o.log||[];
  if(delta>0)o.log.push({t:todayStr(),type});
  else if(delta<0){for(let i=o.log.length-1;i>=0;i--){if(o.log[i].type===type){o.log.splice(i,1);break;}}}
  LSset("g16_py",P); refresh();
}

/* ---------- 历次成绩总表（按最新成绩排序 + 色阶 + 班级/年级排名 + 迷你走势） ---------- */
let CUR_HSUB="总分";
function heatColor(v,mn,mx){if(v==null||!isFinite(v))return null;const t=mx>mn?(v-mn)/(mx-mn):.5;const c1=[224,90,71],c2=[255,214,90],c3=[102,187,106];const mix=(a,b,f)=>a.map((x,i)=>Math.round(x+(b[i]-x)*f));const rgb=t<.5?mix(c1,c2,t*2):mix(c2,c3,(t-.5)*2);return `rgb(${rgb.join(",")})`;}
function fillGaps(a){const out=a.slice();let last=null;for(let i=0;i<out.length;i++){if(out[i]==null){const nx=out.slice(i+1).find(v=>v!=null);out[i]=last!=null?last:(nx!=null?nx:null);}else last=out[i];}return out.filter(v=>v!=null);}
function hsRows(){
  const sub=CUR_HSUB,getv=st=>sub==="总分"?st.z:(st.s?st.s[sub]:null);
  const exs=EXAMS(),lastE=EX();
  const rows=lastE.students.map(s=>{
    const vals=exs.map(e=>{const st=(DATA.exams[e].students||[]).find(x=>x.n===s.n);return st?getv(st):null;});
    return {name:s.n,vals,latest:vals[vals.length-1]};
  });
  // 最新一场班内排名：总分用官方班名，单科现场计算（同分同名次）
  if(sub==="总分"){rows.forEach(r=>{const st=lastE.students.find(x=>x.n===r.name);r.rank=(st&&st.r!=null)?st.r:null;r.gr=(st&&st.l!=null)?st.l:null;});}
  else{
    const arr=rows.filter(r=>r.latest!=null).sort((a,b)=>b.latest-a.latest);
    const rk={};let pv=null,pk=0;
    arr.forEach((r,i)=>{if(pv!==null&&r.latest===pv)rk[r.name]=pk;else{pk=i+1;rk[r.name]=pk;pv=r.latest;}});
    rows.forEach(r=>{r.rank=rk[r.name]||null;r.gr=null;});
  }
  rows.sort((a,b)=>{const na=a.latest==null||(typeof a.latest==="number"&&a.latest!=a.latest);const nb=b.latest==null||(typeof b.latest==="number"&&b.latest!=b.latest);if(na&&nb)return 0;if(na)return 1;if(nb)return -1;return b.latest-a.latest;});
  return rows;
}
function setHS(x){CUR_HSUB=x;refresh();}
function vHist(){
  const exs=EXAMS(),sub=CUR_HSUB,last=exs[exs.length-1];
  const rows=hsRows();
  const all=rows.flatMap(r=>r.vals).filter(v=>v!=null&&isFinite(v));
  const mn=all.length?Math.min.apply(null,all):0,mx=all.length?Math.max.apply(null,all):1;
  const cr=exs.map(e=>rankMap(e,sub));      // 每场班内排名
  const gm=exs.map(e=>gradeMap(e));          // 每场年级（理科）名次
  let h=`<div class="card"><h3>📋 历次成绩总表</h3>
    <div class="hs-chips">${["总分"].concat(SUBJ_SCORED).map(x=>`<button class="${x===sub?"on":""}" onclick="setHS('${x}')">${x}</button>`).join("")}</div>
    <div class="note" style="margin:6px 0 0">按<b>最新一场（${last}）${sub}成绩</b>由高到低排名 · 每格含<b>分数</b>（底色 绿高→红低）+<b>班排 / 年级排</b> · 表格<b>左右滑动</b>查看</div></div>`;
  h+=`<div class="panel"><div class="hs-wrap"><table class="hs-table">
    <thead><tr><th class="hs-rk">名次</th><th class="hs-name">姓名</th>${exs.map(e=>`<th title="${e}">${shortEx(e)}</th>`).join("")}<th>走势</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const tds=r.vals.map((v,j)=>{
      const bg=heatColor(v,mn,mx);
      const c=cr[j][r.name],g=gm[j][r.name];
      const sub2=(c!=null?`班${c}`:"")+(c!=null&&g!=null?" ":"" )+(g!=null?`年${g}`:"");
      return `<td class="hs-td"${bg?` style="background:${bg}"`:""}>${v!=null?`<b>${v}</b>`:`<span style="color:#cbd5e1">—</span>`}${sub2?`<span class="hs-rkmini">${sub2}</span>`:""}</td>`;
    }).join("");
    const sp=fillGaps(r.vals);
    h+=`<tr><td class="hs-rk">${r.latest!=null?i+1:"—"}</td><td class="hs-name">${r.name}</td>${tds}<td><canvas id="hsSp${i}" class="hs-spark" height="30" style="width:96px;height:30px" data-sp='${JSON.stringify(sp)}'></canvas></td></tr>`;
  });
  h+=`</tbody></table></div>
    <div class="hs-foot">每格：<b>分数</b>（底色绿高→红低）· <b>班X</b>=该场班内名次（<b>统一按当前16班口径</b>排名，含高二四场均在现班61人内；单科按分数同分同名次）· <b>年X</b>=年级理科名次 · 走势=历次${sub}分数迷你折线</div></div>`;
  rows.forEach((r,i)=>{const sp=fillGaps(r.vals);if(sp.length>=2)chartDraw("hsSp"+i,{color:"#1e3a8a",data:sp},drawSpark);});
  return h;
}

function decodeEnt(s){return (s||"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/&amp;/g,"&");}

    if(c==='"'){q=true;i++;continue;}
    if(c===d){row.push(f);f="";i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f="";i++;continue;}
    f+=c;i++;}

function buildExamFromRows(rows,map,ben,benke){
  const rnd=x=>Math.round(x*10)/10;
  const raw=rows.slice(1).map(r=>{const nm=(r[map.name]||"").trim();if(!nm)return null;
    const s={};SUBJ_SCORED.forEach(sub=>{const i=map.subs[sub];const v=i!=null?parseFloat(r[i]):NaN;s[sub]=isNaN(v)?null:v;});
    let z=map.z!=null&&r[map.z]!==""&&r[map.z]!=null?parseFloat(r[map.z]):NaN;
    if(isNaN(z)){let sum=0,has=false;SUBJ_SCORED.forEach(sub=>{if(s[sub]!=null){sum+=s[sub];has=true;}});z=has?sum:null;}
    return {n:nm,k:map.kao!=null?(r[map.kao]||"").trim():"",s,z,r:map.r!=null&&r[map.r]!==""?parseInt(r[map.r]):null,l:map.l!=null&&r[map.l]!==""?parseInt(r[map.l]):null};
  }).filter(Boolean);
  const seen={};const uniq=[];raw.forEach(x=>{if(!seen[x.n]){seen[x.n]=1;uniq.push(x);}});
  const weak=computeWeak(uniq);
  if(uniq.some(x=>x.r==null)){uniq.filter(x=>x.z!=null).sort((a,b)=>b.z-a.z).forEach((x,i)=>{if(x.r==null)x.r=i+1;});uniq.forEach(x=>{if(x.r==null)x.r=999;});}
  uniq.sort((a,b)=>(a.r||999)-(b.r||999));
  const vals=uniq.map(x=>x.z).filter(v=>v!=null);
  const avg=vals.length?rnd(vals.reduce((a,b)=>a+b,0)/vals.length):0;
  const subAvg={};SUBJ_SCORED.forEach(sub=>{const vv=uniq.map(x=>x.s[sub]).filter(v=>v!=null);subAvg[sub]=vv.length?rnd(vv.reduce((a,b)=>a+b,0)/vv.length):0;});
  const byEdge={y:0,u:0,d:0,b:0,n:0,x:0};const subWeak={};SUBJ_SCORED.forEach(s=>subWeak[s]=[]);
  uniq.forEach(x=>{x.e=edgeTag(x.z,ben,benke);byEdge[x.e]=(byEdge[x.e]||0)+1;x.w=weak[x.n]||[];x.p=null;x.m=0;x.l=x.l==null?null:x.l;if(x.w.length)subWeak&&x.w.forEach(s=>{if(subWeak[s]&&!subWeak[s].includes(x.n))subWeak[s].push(x.n);});});
  const subjects=SUBJ_SCORED.map(sub=>{const vv=uniq.filter(x=>x.s[sub]!=null).map(x=>({n:x.n,v:x.s[sub]}));if(!vv.length)return null;vv.sort((a,b)=>b.v-a.v);const full=FULL[sub];const dist={A:0,B:0,C:0,D:0};vv.forEach(o=>{const fr=o.v/full;if(fr>=0.75)dist.A++;else if(fr>=0.6)dist.B++;else if(fr>=0.45)dist.C++;else dist.D++;});return {n:sub,full,avg:subAvg[sub],max:vv[0].v,maxN:vv[0].n,min:vv[vv.length-1].v,minN:vv[vv.length-1].n,weakN:subWeak[sub].length,dist};}).filter(Boolean);
  SUBJ_SCORED.forEach(sub=>{subWeak[sub].sort((a,b)=>(byN(a)?byN(a).r||999:999)-(byN(b)?byN(b).r||999:999));});
  const critUp=uniq.filter(x=>x.e==="u").map(x=>x.n),critDown=uniq.filter(x=>x.e==="d").map(x=>x.n),focus=uniq.filter(x=>(x.w||[]).length>=2).map(x=>x.n);
  const statsObj=dict({n:uniq.length,avg,avgQ:avg,maxAvg:avg*1.08,benyi:byEdge.y,benke:byEdge.y+byEdge.b,critUp,critDown,focus,byEdge,subAvg,subWeak});
  const histQ={};uniq.forEach(x=>{histQ[x.n]={z:x.z,r:x.r};});
  const report=dict({title:"高三16班 · 通报",sub:"",paras:[],groups:[],tip:""});
  return {students:uniq,histQ,stats:statsObj,subjects,subWeak,report};
}

  const DOW=["周日","周一","周二","周三","周四","周五","周六"];const today=DOW[now.getDay()];

    status=nowMin<f?"before":nowMin>l?"after":"between";}
  return {nowMin,today,cur,status};}

/* 在课表渲染后，按当前时间画出红色定位线（横贯全表，定位“现在”） */
function ttDrawNow(){
  const wrap=document.querySelector(".tt-wrap");if(!wrap)return;
  const tbl=wrap.querySelector(".tt-grid");if(!tbl)return;
  const rows=[...tbl.querySelectorAll("tr")];if(rows.length<2)return;
  const line=document.getElementById("ttNowLine");if(!line)return;
  const wr=wrap.getBoundingClientRect();
  const top=y=>y.getBoundingClientRect().top-wr.top+wrap.scrollTop;
  /* 行 → 节次映射（按行首文本，防顺序错位） */
  const rowOf={},labels=[];
  rows.forEach(r=>{const td=r.querySelector("td.pr");if(!td)return;
    const lbl=(td.childNodes[0]&&td.childNodes[0].textContent||td.textContent).trim().split("\n")[0].trim();
    rowOf[lbl]=r;labels.push(lbl);});
  const dataRows=rows.filter(r=>r.querySelector("td.pr"));
  if(!dataRows.length)return;
  const first=dataRows[0],last=dataRows[dataRows.length-1];
  const ni=ttNowInfo();
  let y=null;
  if(ni.status==="before"){y=top(first);}
  else if(ni.status==="after"){y=top(last)+last.getBoundingClientRect().height;}
  else{
    for(let i=0;i<labels.length;i++){
      const tm=TT_TIMES[labels[i]];if(!tm)continue;
      const[s,e]=tm,r=rowOf[labels[i]];if(!r)continue;
      const rTop=top(r),rH=r.getBoundingClientRect().height;
      if(ni.nowMin<s){y=rTop;break;}                       /* 课间/午休：贴下一节行顶 */
      if(ni.nowMin<=e){y=rTop+Math.max(0,Math.min(1,(ni.nowMin-s)/(e-s)))*(rH-2);break;} /* 行内按时间比例 */
    }
    if(y===null)y=top(last)+last.getBoundingClientRect().height;
  }
  line.style.top=y+"px";
  line.style.width=tbl.offsetWidth+"px";
  const hh=String(Math.floor(ni.nowMin/60)).padStart(2,"0"),mm=String(ni.nowMin%60).padStart(2,"0");
  const tag=ni.status==="before"?"今日未开始":ni.status==="after"?"今日已结束":ni.status==="between"?`课间 ${hh}:${mm}`:`现在 ${hh}:${mm}`;
  line.querySelector("span").textContent=tag;
  line.style.display="block";
}
function ttFocus(sub){TT_FOCUS=(TT_FOCUS===sub)?null:sub;refresh();}
function ttEdit(d,p){const t=getTT();const cur=(t.grid[d]&&t.grid[d][p])||{};const m=document.getElementById("ttModal");
  const opts=[...SUBS,...TT_EXTRA].map(s=>`<option ${cur.subj===s?"selected":""}>${s}</option>`).join("");
  m.querySelector(".ttbody").innerHTML=`
    <div style="font-size:15px;font-weight:800;margin-bottom:12px">${d} · ${p}</div>
    <div style="display:flex;flex-direction:column;gap:9px">
      <select class="sel" id="ttSubSel">${opts}</select>
      <input class="sel" id="ttTch" placeholder="任课教师（可选）" value="${esc(cur.teacher||"")}">
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="bigbtn" style="flex:1;background:#fff;color:#ef5350;border-color:#fecaca" onclick="ttClearCell('${d}','${p}')">清空</button>
      <button class="bigbtn" style="flex:2;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:none;font-weight:700" onclick="ttSaveCell('${d}','${p}')">保存</button>
    </div>`;
  m.classList.add("show");
}
function ttSaveCell(d,p){const subj=document.getElementById("ttSubSel").value;const teacher=document.getElementById("ttTch").value.trim();const t=getTT();if(!t.grid[d])t.grid[d]={};if(subj==="空")t.grid[d][p]=null;else t.grid[d][p]={subj,teacher};LSset("g16_tt",t);document.getElementById("ttModal").classList.remove("show");toast("🗓 已保存");refresh();}
function ttClearCell(d,p){const t=getTT();if(t.grid[d])t.grid[d][p]=null;LSset("g16_tt",t);document.getElementById("ttModal").classList.remove("show");refresh();}
function ttReset(){if(!confirm("确定清空整张课程表？"))return;const d=ttDefault();LSset("g16_tt",d);TT_FOCUS=null;refresh();}
function ttCopyDay(){const t=getTT();const from=prompt("复制哪一天？（如：周一）",t.days[0]||"周一");if(!from||!t.grid[from]){alert("未找到该天");return;}const to=prompt("复制到哪一天？（如：周二）",t.days[1]||"周二");if(!to||!t.grid[to]){alert("未找到目标天");return;}t.grid[to]=JSON.parse(JSON.stringify(t.grid[from]));LSset("g16_tt",t);toast(`已复制 ${from} → ${to}`);refresh();}

/* ---------- 自动更新校验（保证打开即最新） ---------- */
async function checkUpdate(){
  try{
    const r=await fetch("version.json?_="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const d=await r.json();
    if(d.build && d.build!==BUILD){
      const el=document.getElementById("upd");
      if(d.note)el.querySelector("small").textContent=d.note;
      el.style.display="block";
    }
  }catch(e){/* 离线 / 本地文件，忽略 */}
}

/* 启动 */
window.addEventListener("DOMContentLoaded",boot);
</script>
