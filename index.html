<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="data:,">
<title>高三16班 · 班级工作台</title>
<style>
:root{
  --c1:#1e3a8a; --c2:#6d28d9; --bg:#eef2f7; --card:#ffffff; --ink:#1a2233; --mut:#64748b;
  --yi:#43a047; --ben:#1e88e5; --up:#FFD54F; --down:#FF8A65; --no:#cfd8dc;
  --red:#e53935; --ok:#2e7d32;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
/* ---------- 头部 ---------- */
header{background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 100%);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:30;box-shadow:0 4px 20px rgba(30,58,138,.35)}
header .t1{font-size:20px;font-weight:800;letter-spacing:1px}
header .t2{font-size:12px;opacity:.85;margin-top:3px}
/* 分组子切换（头部内，半透明白风格，自动换行不滑动） */
#subnav{display:none;flex-wrap:wrap;gap:6px;margin-top:10px}
#subnav button{border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.16);color:#fff;padding:5px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.2s;white-space:nowrap}
#subnav button.on{background:#fff;color:var(--c1);font-weight:800;border-color:#fff}
/* 底部固定 Tab 栏 */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:#fff;border-top:1px solid #e8edf3;box-shadow:0 -2px 14px rgba(15,23,42,.1);padding:5px 4px calc(6px + env(safe-area-inset-bottom));max-width:920px;margin:0 auto}
#tabbar button{flex:1;border:none;background:transparent;color:#94a3b8;padding:4px 2px;border-radius:12px;font-size:11px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
#tabbar button .ic{font-size:21px;line-height:1}
#tabbar button.on{color:var(--c1)}
#tabbar button.on .ic{transform:translateY(-1px)}
#examBar{display:flex;gap:6px;overflow-x:auto;margin-top:9px;scrollbar-width:none}
#examBar::-webkit-scrollbar{display:none}
#examBar button{flex-shrink:0;border:none;background:rgba(255,255,255,.18);color:#fff;padding:5px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap;border:1.5px solid transparent}
#examBar button.on{background:#fff;color:var(--c1);font-weight:800}
main{max-width:920px;margin:0 auto;padding:14px 12px 92px}
/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card h3::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--c1),var(--c2))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.kpi .v{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .l{font-size:12px;color:var(--mut);margin-top:3px}
.kpi .d{font-size:11px;margin-top:2px;color:var(--ok);font-weight:700}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;margin:3px;cursor:pointer;border:1.5px solid transparent}
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:7px;margin-top:10px}
.bigbtn{min-height:46px;padding:10px 14px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;border:2px solid #e2e8f0;background:#fff;color:var(--ink);flex:1;text-align:center;min-width:104px;transition:.15s}
.bigbtn:active{transform:scale(.97)}
.bar{height:10px;border-radius:5px;background:#e8edf5;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .6s}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1.5px solid #e8edf5;white-space:nowrap;font-size:12px}
td{padding:9px 6px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
tr.rowc{cursor:pointer;transition:.15s}
tr.rowc:hover{background:#f5f7ff}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;color:#123}
.wb{display:inline-block;width:17px;height:17px;line-height:15px;text-align:center;border-radius:4px;font-size:10px;font-weight:800;color:#fff;margin-right:3px}
.tag-up{color:var(--ok);font-weight:800}
.tag-down{color:var(--red);font-weight:800}
input.sel,select.sel,textarea.sel{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;background:#fff;width:100%;font-family:inherit}
select.sel{min-width:96px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar input,.toolbar select{flex:1;min-width:120px}
.toolbar label.sel{white-space:nowrap}
.toolbar label.sel input[type="checkbox"]{width:auto;min-width:0;flex:0 0 auto;accent-color:var(--c1)}
.sec-title{font-size:13px;color:var(--mut);margin:14px 2px 8px;font-weight:700}
.empty{color:#94a3b8;text-align:center;padding:30px 0;font-size:14px}
.note{font-size:12px;color:var(--mut);line-height:1.6}
.hw-hint{font-size:12px;color:var(--mut);line-height:1.5;margin-top:8px;padding:7px 10px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px}
/* 座位 */
.seat-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.seat-grid2{display:grid;grid-template-columns:36px repeat(9,54px);gap:5px;width:max-content;min-width:100%}
.seat-label{display:flex;align-items:center;justify-content:center;background:#4f4f4f;color:#fff;font-weight:700;font-size:11px;border-radius:6px;min-height:56px}
.podium-span{grid-column:span 7;background:#334155;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:8px;font-size:14px;min-height:44px}
.seat{border-radius:9px;padding:6px 2px;text-align:center;cursor:pointer;border:2px solid #b8c4d6;position:relative;min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.seat.focus{border-color:var(--red)}
.seat .nm{font-size:12.5px;font-weight:800;line-height:1.15;white-space:nowrap}
.seat .wk{font-size:9.5px;letter-spacing:2px;line-height:1;min-height:10px;color:#52607a}
.seat .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--red);border-radius:50%}
.seat.empty-s{border:1.5px dashed #d7dee8;background:#f8fafc;color:#a8b4c4;font-size:11px;cursor:default}
.front-seat{min-height:44px}
.blackboard{text-align:center;color:#64748b;font-size:12px;margin-top:8px;letter-spacing:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:3px;border:1px solid #94a3b8}
/* 学科 */
.subj-card{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.subj-card .ic{width:44px;height:44px;border-radius:12px;color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.subj-card .bd{flex:1;min-width:0}
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px}
.dist i{height:100%}
/* 通报 */
.report{background:linear-gradient(180deg,#fffdf5,#fff);border:1.5px solid #f2e8c9}
.report .rh{text-align:center;padding:8px 0 4px}
.report .rh .a{font-size:18px;font-weight:900;letter-spacing:2px}
.report .rh .b{font-size:12px;color:var(--mut);margin-top:4px}
.report p{font-size:14px;line-height:1.9;margin:10px 0;text-indent:2em}
.report .names{background:#faf7ec;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px;line-height:2}
.report .names b{color:#9a6b00}
footer{text-align:center;color:#94a3b8;font-size:11px;padding:16px 0 6px}
a{color:var(--c1)}
.lb{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;background:#f1f5f9;color:var(--ink);cursor:pointer;border:1.5px solid #e2e8f0;margin:3px}
.mini{width:30px;height:30px;line-height:27px;text-align:center;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#334155;font-weight:800;font-size:16px;cursor:pointer;padding:0}
.mini:hover{background:#f1f5f9}
.mini:active{transform:scale(.9)}
.srctag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:#eef2ff;color:#3b4cca;vertical-align:middle;white-space:nowrap}
.srctag.src-hw{background:#fdecea;color:#c62828}
.srctag.src-praise{background:#e8f5e9;color:#2e7d32}
.srctag.src-critic{background:#fdecea;color:#c62828}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);background:rgba(30,42,120,.96);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:700;z-index:999;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 6px 20px rgba(15,23,42,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 入场动画：仅在整视图切换(go)时触发，模块内 refresh 不重放 */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim .card{animation:up .3s ease both}
/* 培优补差卡片 */
.py-card{border:1.5px solid #eef1f6;border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.py-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.py-name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.py-st{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;color:#123;white-space:nowrap}
.py-weak{font-size:11.5px;color:var(--mut);margin:4px 0 8px}
.py-counts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.py-ct{display:flex;align-items:center;gap:4px;background:#f6f8fc;border-radius:10px;padding:5px 8px}
.py-ct .lab{font-size:12px;color:var(--mut);margin-right:2px}
.py-ct b{min-width:18px;text-align:center;font-size:15px;color:#e65100}
.py-note{margin-top:9px;font-size:13px;padding:7px 10px}
.py-log{font-size:11.5px;color:var(--mut);margin-top:7px;line-height:1.6}
.py-log .lg{display:inline-block;background:#f1f5f9;border-radius:6px;padding:1px 7px;margin:2px 3px 0 0}
/* 作业芯片：仅靠颜色表达状态，无前缀符号 */
.hw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:7px;margin-top:8px}
.hw-chip{border-radius:11px;padding:12px 4px;font-size:14.5px;text-align:center;min-height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #dbe2ea;background:#fff;transition:.15s;font-weight:700;color:var(--ink)}
.hw-chip:active{transform:scale(.95)}
.hw-chip.done{background:#e8f5e9;border-color:#43a047;color:#2e7d32}
.hw-grid.mode-praise .hw-chip{border-color:#a5d6a7;box-shadow:inset 0 0 0 1px #a5d6a7}
.hw-grid.mode-critic .hw-chip{border-color:#ef9a9a;box-shadow:inset 0 0 0 1px #ef9a9a}
.hw-grid.mode-praise .hw-chip:active,.hw-grid.mode-critic .hw-chip:active{transform:scale(.92)}
/* 谈心谈话 */
.chat-item{position:relative;border:1.5px solid #eef1f6;border-radius:12px;padding:11px 12px;margin-bottom:9px;background:#fff;cursor:pointer;transition:.15s}
.chat-item:active{background:#f7f9ff}
.chat-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.chat-date{margin-left:auto;color:#94a3b8;font-size:11.5px}
.chat-text{font-size:13.5px;line-height:1.65;margin-top:5px;color:#334155;white-space:pre-wrap;word-break:break-word}
.chat-del{position:absolute;right:10px;bottom:8px;color:#ef5350;font-size:12px;cursor:pointer;padding:2px 6px}
/* 快捷入口 */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border-radius:14px;padding:12px 4px;box-shadow:0 2px 10px rgba(15,23,42,.06);text-decoration:none;color:var(--ink);font-size:11.5px;font-weight:700;cursor:pointer}
.quick a .qi{font-size:22px}
.quick a:active{transform:scale(.96)}
/* 更新横幅 */
#upd{display:none;position:fixed;left:0;right:0;top:0;z-index:120;background:linear-gradient(135deg,#e53935,#ff8a65);color:#fff;text-align:center;padding:11px;font-weight:800;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.3);font-size:14px}
#upd small{display:block;font-weight:500;opacity:.92;font-size:11px;margin-top:2px}
/* 随机点名 弹层 */
#randMask{position:fixed;inset:0;background:linear-gradient(135deg,rgba(30,58,138,.94),rgba(109,40,217,.94));z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff}
#randMask.show{display:flex;animation:up .25s ease both}
#randName{font-size:62px;font-weight:900;letter-spacing:4px;text-shadow:0 6px 26px rgba(0,0,0,.4);line-height:1.1}
#randName.pop{animation:pop .42s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
#randSub{margin-top:16px;font-size:14px;opacity:.85}
#randClose{position:absolute;top:18px;right:22px;font-size:30px;cursor:pointer;opacity:.85}
/* 课程表 */
.subj-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.subj-chips .sc{display:inline-flex;align-items:center;gap:3px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;color:var(--ink);transition:.15s}
.subj-chips .sc:active{transform:scale(.95)}
.tt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;position:relative}
.tt-grid{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
.tt-grid th,.tt-grid td{border:1px solid #e6ebf2;padding:0}
.tt-grid th{background:#f1f5f9;font-size:12px;color:var(--mut);font-weight:700;padding:7px 4px}
.tt-grid .pr{background:#f8fafc;font-size:11.5px;color:var(--mut);font-weight:700;white-space:nowrap;min-width:52px;text-align:left;padding:6px 7px}
.tt-cell{width:64px;min-height:42px;padding:5px 3px;cursor:pointer;border-radius:7px;font-size:12.5px;font-weight:800;line-height:1.1;transition:.15s;color:#fff;text-align:center}
.tt-cell .tch{display:block;font-size:9px;font-weight:600;opacity:.92;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-cell.empty{background:#f6f8fb;color:#cbd5e1;font-weight:600}
.tt-cell.dim{opacity:.3}
.tt-cell.hot{box-shadow:0 0 0 3px var(--c1);transform:scale(1.05)}
.tt-cell:active{transform:scale(.96)}
.tt-grid th.today{background:#fee2e2;color:#dc2626;box-shadow:inset 0 -3px 0 #ef4444}
.tt-cell.now{box-shadow:0 0 0 3px #ef4444;outline:2.5px solid #ef4444;z-index:4}
.tt-grid .pr small{display:block;font-weight:600;color:#9aa7b8;font-size:9px;margin-top:1px}
.tt-nowline{position:absolute;left:0;height:0;border-top:2.5px solid #ef4444;z-index:6;pointer-events:none;display:none;box-shadow:0 0 6px rgba(239,68,68,.6)}
.tt-nowline span{position:absolute;left:2px;top:-10px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
/* 7天窄列模式：整周一屏放下，无需横向滚动 */
.tt-grid.narrow .tt-cell{width:43px;font-size:11px;padding:4px 2px}
.tt-grid.narrow .tch{font-size:8px}
.tt-grid.narrow .pr{min-width:44px;font-size:10.5px;padding:5px 5px}
#ttModal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:210;display:none;align-items:center;justify-content:center;padding:18px}
#ttModal.show{display:flex}
.ttcard{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:340px;box-shadow:0 12px 40px rgba(15,23,42,.3)}
</style>
</head>
<body>

<!-- 更新横幅 -->
<div id="upd" onclick="location.reload(true)">🎉 发现新版本，点击此处立即刷新<small>继续用旧版也可，但建议刷新体验最新功能</small></div>

<!-- 随机点名 抽取弹层 -->
<div id="randMask"><span id="randClose" onclick="randClose()">✕</span><div id="randName">准备</div><div id="randSub">点击下方按钮开始随机点名</div></div>

<!-- 课程表 单元格编辑弹窗 -->
<div id="ttModal"><div class="ttcard">
  <div class="ttbody"></div>
  <div style="text-align:right;margin-top:10px;padding-top:8px;border-top:1px solid #eef1f6"><span style="color:#94a3b8;font-size:13px;cursor:pointer" onclick="document.getElementById('ttModal').classList.remove('show')">取消</span></div>
</div></div>

<!-- 主应用 -->
<div id="app">
  <header>
    <div class="t1">高三16班 · 班级工作台</div>
    <div class="t2" id="hSub"></div>
    <div id="examBar"></div>
    <div id="subnav"></div>
  </header>
  <main id="main"></main>
  <div id="toast"></div>
  <footer id="foot"></footer>
  <nav id="tabbar"></nav>

  const end=new Uint8Array([0x50,0x4b,0x05,0x06,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cenLen),...u32(offset),0,0]);
  const total=parts.reduce((a,c)=>a+c.length,0)+cenLen+end.length;
  const out=new Uint8Array(total); let pos=0;
  parts.forEach(c=>{out.set(c,pos);pos+=c.length;}); central.forEach(c=>{out.set(c,pos);pos+=c.length;}); out.set(end,pos);
  const b=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const u=URL.createObjectURL(b), a=document.createElement("a"); a.href=u; a.download=filename; a.click(); URL.revokeObjectURL(u);
}

/* ---------- 培优补差（卡片化：计数紧跟姓名 + 备注 + 记录） ---------- */
function pyCard(x){
  const P=LS("g16_py",{})[x.n]||{peiyou:0,bucha:0,note:"",log:[]};
  const py=P.peiyou||0, bc=P.bucha||0, note=P.note||"", log=P.log||[];
  const lab=t=>t==="peiyou"?"培优":"补差";
  const ct=(t,v)=>`<div class="py-ct"><span class="lab">${lab(t)}</span><button class="mini" onclick="event.stopPropagation();pyAdd('${x.n}','${t}',-1)" title="−1">−</button><b>${v}</b><button class="mini" onclick="event.stopPropagation();pyAdd('${x.n}','${t}',1)" title="+1">＋</button></div>`;
  const logTxt=log.length?log.slice().reverse().slice(0,4).map(e=>`<span class="lg">${(e.t||"").slice(5)} ${lab(e.type)}</span>`).join("")+(log.length>4?`<span class="lg">…共${log.length}次</span>`:""):'<span style="color:#b6c0cf">暂无记录，点"＋"即记一次</span>';
  return `<div class="py-card">
    <div class="py-h">
      <div class="py-name" onclick="jumpStu('${x.n}')">${x.n}${x.m?' <span title="目标生">⭐</span>':""} ${weakIco(x.w)}</div>
      <div class="py-st" style="background:${eC(x.e)}">${EDGE[x.e]}</div>
    </div>
    <div class="py-weak">薄弱科：${x.w&&x.w.length?x.w.join("、"):"—"}</div>
    <div class="py-counts">${ct("peiyou",py)}${ct("bucha",bc)}</div>
    <input class="sel py-note" placeholder="📌 备注（如：本周重点抓数学，已约家长）" value="${esc(note)}" onchange="pyNote('${x.n}',this.value)">
    <div class="py-log">📒 记录：${logTxt}</div>
  </div>`;
}
function pyAdd(name,type,delta){
  const P=LS("g16_py",{}); if(!P[name])P[name]={peiyou:0,bucha:0,note:"",log:[]};
  const o=P[name]; o[type]=Math.max(0,(o[type]||0)+delta); o.log=o.log||[];
  if(delta>0)o.log.push({t:todayStr(),type});
  else if(delta<0){for(let i=o.log.length-1;i>=0;i--){if(o.log[i].type===type){o.log.splice(i,1);break;}}}
  LSset("g16_py",P); refresh();
}
function pyNote(name,v){const P=LS("g16_py",{});if(!P[name])P[name]={peiyou:0,bucha:0,note:"",log:[]};P[name].note=v;LSset("g16_py",P);toast("📌 备注已保存");}

  else h+=`<div style="overflow-x:auto"><table><tr><th>姓名</th><th>培优</th><th>补差</th><th>合计</th></tr>${rows.map(r=>`<tr class="rowc" onclick="jumpStu('${r.n}')"><td><b>${r.n}</b></td><td style="color:#e65100;font-weight:800">${r.py}</td><td style="color:#e65100;font-weight:800">${r.bc}</td><td style="font-weight:800">${r.tot}</td></tr>`).join("")}</table></div>`;
  h+=`</div>`;
  return h;
}

function vWeak(){

let ROLL_DATE=todayStr();

/* ---------- 作业统计 ---------- */
function vHomework(){
  let HW=LS("g16_hw",[]);
  const isPraise=HW_MODE==="praise", isCritic=HW_MODE==="critic";
  let h=`<div class="card"><h3>📝 作业登记</h3>
    <div class="toolbar">
      <input class="sel" id="hwDate" type="date" value="${todayStr()}">
      <select class="sel" id="hwSub">${["语文","数学","英语","物理","化学","地理","其他"].map(s=>`<option>${s}</option>`).join("")}</select>

    </div></div>`;
  h+=`<div class="card"><h3>👆 点击学生做什么</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="bigbtn" style="${(!isPraise&&!isCritic)?'background:var(--c1);color:#fff;border-color:var(--c1)':''}" onclick="setHWMode('normal')">✅ 记交作业</button>
      <button class="bigbtn" style="${isPraise?'background:#2e7d32;color:#fff;border-color:#2e7d32':'color:#2e7d32;border-color:#a5d6a7'}" onclick="setHWMode('praise')">👍 表扬+2</button>
      <button class="bigbtn" style="${isCritic?'background:#c62828;color:#fff;border-color:#c62828':'color:#c62828;border-color:#ef9a9a'}" onclick="setHWMode('critic')">👎 批评−2</button>
    </div>
    <div class="note" style="margin-top:8px">${isPraise?"当前【表扬】：点学生姓名即 +2 分，计入积分·表扬。":isCritic?"当前【批评】：点学生姓名即 −2 分，计入积分·批评。":"当前【记作业】：点学生姓名切换已交 / 未交（绿色=已交，仅变色不加符号）。要改表扬批评分值请到「积分」页。"}</div></div>`;
  if(!HW.length) h+=`<div class="empty">暂无作业记录，先添加一条。</div>`;
  HW.slice().reverse().forEach(it=>{
    const done=new Set(it.done||[]);const total=stu().length, sub=done.size;
    const undone=stu().map(s=>s.n).filter(n=>!done.has(n));
    const gridCls=isPraise?"mode-praise":isCritic?"mode-critic":"";
    h+=`<div class="card" style="padding:13px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div style="font-size:15px"><b>${it.date}</b> · ${it.subject} · ${it.content||"(无内容)"}</div>
        <div style="font-size:14px;color:${sub===total?'var(--ok)':'var(--c2)'};font-weight:800;white-space:nowrap">${sub}/${total}</div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="bigbtn" style="background:#e8f5e9;border-color:#43a047;color:#2e7d32" onclick="hwAllDone(${it.id})">✅ 全部已交</button>
        <button class="bigbtn" style="background:#fff" onclick="hwClear(${it.id})">🧹 全部未交</button>
        ${undone.length?`<button class="bigbtn" style="background:#ffebee;border-color:#ef5350;color:#c62828" onclick="hwPenalty(${it.id})">未交${undone.length}人 · 扣分</button>`:''}
        <button class="bigbtn" style="background:#fff;color:#ef5350;border-color:#fecaca;flex:0;min-width:72px" onclick="hwDel(${it.id})">删除</button>
      </div>
      <div class="hw-grid ${gridCls}">`;
    stu().forEach(s=>{
      const on=done.has(s.n);
      const cls=isPraise?"hw-chip":isCritic?"hw-chip":(on?"hw-chip done":"hw-chip");
      const fn=isPraise?`hwPraise('${s.n}')`:isCritic?`hwCritic('${s.n}')`:`hwToggle(${it.id},'${s.n}')`;
      h+=`<span class="${cls}" onclick="${fn}">${s.n}</span>`;
    });
    h+=`</div>`;
    if(it.penalty) h+=`<div style="font-size:12px;color:var(--mut);margin-top:8px">已执行未交扣分：${it.penalty} 分/人</div>`;
    h+=`</div>`;
  });
  if(HW.length){
    const stat=stu().map(s=>{let j=0;HW.forEach(it=>(it.done||[]).includes(s.n)&&j++);return {n:s.n,j};}).sort((a,b)=>a.j-b.j);
    const penMap={};LS("g16_pt",[]).forEach(e=>{if(e.source==="hw"&&e.hwId!=null)penMap[e.name]=(penMap[e.name]||0)+e.delta;});
    h+=`<div class="card"><h3>📊 学生作业完成统计（应交 ${HW.length} 次）</h3><div style="overflow-x:auto"><table><tr><th>姓名</th><th>已交</th><th>未交</th><th>完成率</th><th>作业扣分</th></tr>`;
    stat.forEach(x=>{const rate=Math.round(x.j/HW.length*100);const pen=penMap[x.n]||0;h+=`<tr><td><b>${x.n}</b></td><td style="color:var(--ok)">${x.j}</td><td style="color:${x.j<HW.length?'var(--red)':'var(--mut)'}">${HW.length-x.j}</td><td>${rate}%</td><td style="color:${pen<0?'var(--red)':'var(--mut)'}">${pen||0}</td></tr>`;});
    h+=`</table></div></div>`;
  }
  h+=`<div class="toolbar" style="margin-top:6px"><button class="sel" onclick="exportExcel()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:46px">⬇ 导出Excel</button><label class="sel" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;text-align:center;min-height:46px">⬆ 恢复<input type="file" accept="application/json" style="display:none" onchange="importBackup(this)"></label></div>`;
  return h;
}
function hwDel(id){if(!confirm("确定删除该作业记录？"))return;LSset("g16_hw",LS("g16_hw",[]).filter(x=>x.id!==id));refresh();}
function hwAdd(){const date=document.getElementById("hwDate").value||todayStr();const subject=document.getElementById("hwSub").value;const content=document.getElementById("hwContent").value.trim();if(!content){alert("请填写作业内容");return;}const HW=LS("g16_hw",[]);HW.push({id:Date.now(),date,subject,content,due:"",done:[]});LSset("g16_hw",HW);toast("📝 作业已添加");refresh();}
function hwToggle(id,name){const HW=LS("g16_hw",[]);const it=HW.find(x=>x.id===id);if(!it)return;it.done=it.done||[];const i=it.done.indexOf(name);if(i>=0)it.done.splice(i,1);else it.done.push(name);LSset("g16_hw",HW);refresh();}
function hwAllDone(id){const HW=LS("g16_hw",[]);const it=HW.find(x=>x.id===id);if(!it)return;it.done=stu().map(s=>s.n);LSset("g16_hw",HW);toast("✅ 已全部标记已交");refresh();}
function hwClear(id){const HW=LS("g16_hw",[]);const it=HW.find(x=>x.id===id);if(!it)return;it.done=[];LSset("g16_hw",HW);toast("🧹 已全部标记未交");refresh();}
function setHWMode(m){HW_MODE=(HW_MODE===m)?"normal":m;refresh();}
function ptPush(name,delta,source,reason){const PT=LS("g16_pt",[]);PT.push({id:Date.now()+Math.floor(Math.random()*1e6),name,delta,reason,source});LSset("g16_pt",PT);}
function hwPraise(name){ptPush(name,2,"praise","作业表扬");toast("👍 "+name+" +2");refresh();}
function hwCritic(name){ptPush(name,-2,"critic","作业批评");toast("👎 "+name+" −2");refresh();}
function toast(msg){const t=document.getElementById("toast");if(!t)return;t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1200);}
function hwPenalty(id){
  const HW=LS("g16_hw",[]);const it=HW.find(x=>x.id===id);if(!it)return;
  const done=new Set(it.done||[]);
  const undone=stu().map(s=>s.n).filter(n=>!done.has(n));
  if(!undone.length){alert("全部已交，无需扣分");return;}
  const def=it.penalty||-2;
  const pen=parseInt(prompt(`「${it.date} ${it.subject}」未交 ${undone.length} 人。每人扣几分？（负数，如 -2）`,String(def)),10);
  if(isNaN(pen))return;
  let PT=LS("g16_pt",[]).filter(e=>!(e.source==="hw"&&e.hwId===id));
  undone.forEach(n=>PT.push({id:Date.now()+Math.floor(Math.random()*1e6),name:n,delta:pen,reason:`${it.date} ${it.subject}作业未交`,source:"hw",hwId:id}));
  LSset("g16_pt",PT);
  it.penalty=pen;LSset("g16_hw",HW);refresh();
}
/* 导出全部 5 类本地数据为 Excel（多 sheet，人读友好，可直接打印/发给年级） */
function exportExcel(){
  const names=stu().map(s=>s.n);
  const HW=LS("g16_hw",[]), PT=LS("g16_pt",[]), ROLL=LS("g16_roll",{}), PY=LS("g16_py",{}), CH=LS("g16_chat",[]), REC=LS("g16_recite",[]);
  const lab2=t=>t==="peiyou"?"培优":"补差";
  const hwRows=[["日期","科目","作业内容","应交","已交","未交","已交名单","未交名单","未交扣分"]];
  HW.forEach(it=>{const done=new Set(it.done||[]),total=names.length,undone=names.filter(n=>!done.has(n));
    hwRows.push([it.date,it.subject,it.content||"",total,done.size,total-done.size,names.filter(n=>done.has(n)).join("、"),undone.join("、"),it.penalty||""]);});
  const ptRows=[["姓名","分值(+/-)","事由","来源"]];
  PT.forEach(e=>ptRows.push([e.name,e.delta,e.reason||"",SRC[e.source]||e.source]));
  const bal={};names.forEach(n=>bal[n]=0);PT.forEach(e=>{if(bal[e.name]!=null)bal[e.name]+=e.delta;});
  const ptSum=[["姓名","当前积分"]];Object.entries(bal).sort((a,b)=>b[1]-a[1]).forEach(([n,v])=>ptSum.push([n,v]));
  const rollRows=[["日期","姓名","状态"]];
  Object.keys(ROLL).sort().forEach(d=>{const m=ROLL[d];names.forEach(n=>{if(m[n])rollRows.push([d,n,ST[m[n]]?ST[m[n]].s:m[n]]);});});
  const pyRows=[["姓名","培优次数","补差次数","备注","辅导记录"]];
  names.forEach(n=>{const P=PY[n]||{peiyou:0,bucha:0,note:"",log:[]};const log=(P.log||[]).map(e=>`${e.t} ${lab2(e.type)}`).join(" | ");
    pyRows.push([n,P.peiyou||0,P.bucha||0,P.note||"",log]);});
  const chatRows=[["日期","姓名","类型","内容","是否需回访"]];
  CH.forEach(c=>chatRows.push([c.date,c.name,c.type,c.text||"",c.follow?"是":""]));
  const recRows=[["日期","科目","抽背内容","应交","已背","未背","已背名单","未背名单"]];
  REC.forEach(it=>{const done=new Set(it.done||[]);recRows.push([it.date,it.subject,it.content||"",names.length,done.size,names.length-done.size,names.filter(n=>done.has(n)).join("、"),names.filter(n=>!done.has(n)).join("、")]);});
  xlsxDownload(`高三16班_班级数据_${todayStr()}.xlsx`,[
    {name:"作业记录",rows:hwRows},{name:"积分明细",rows:ptRows},{name:"积分汇总",rows:ptSum},
    {name:"点名记录",rows:rollRows},{name:"培优补差",rows:pyRows},{name:"谈心记录",rows:chatRows},{name:"抽背记录",rows:recRows}
  ]);
  toast("📊 Excel 已导出（7 个工作表）");
}
/* 导出 JSON 备份（机读，用于换机/恢复，与 Excel 并存） */
function exportJsonBackup(){const d={hw:LS("g16_hw",[]),pt:LS("g16_pt",[]),roll:LS("g16_roll",{}),py:LS("g16_py",{}),chat:LS("g16_chat",[]),recite:LS("g16_recite",[]),tt:getTT()};download(`高三16班_数据备份_${todayStr()}.json`,JSON.stringify(d,null,2));}
/* 导入 JSON 备份恢复全部 6 类数据 */
function importBackup(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.hw)LSset("g16_hw",d.hw);if(d.pt)LSset("g16_pt",d.pt);if(d.roll)LSset("g16_roll",d.roll);if(d.py)LSset("g16_py",d.py);if(d.chat)LSset("g16_chat",d.chat);if(d.recite)LSset("g16_recite",d.recite);if(d.tt)LSset("g16_tt",d.tt);alert("导入成功（作业/积分/点名/培优/谈心/抽背/课表）");refresh();}catch(e){alert("导入失败：文件格式错误");}};r.readAsText(f);}

/* ---------- 抽背登记（仿作业：添加任务→点学生切换已背/未背，绿=已背） ---------- */
function vRecite(){
  let REC=LS("g16_recite",[]);
  let h=`<div class="card"><h3>📚 抽背登记</h3>
    <div class="toolbar">
      <input class="sel" id="recDate" type="date" value="${todayStr()}">
      <select class="sel" id="recSub">${SUBS.map(s=>`<option>${s}</option>`).join("")}</select>
      <input class="sel" id="recContent" placeholder="抽背内容，如：背诵《赤壁赋》全文" style="flex:2;min-width:160px">
      <button class="sel" style="background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:none;font-weight:700;cursor:pointer;min-height:46px" onclick="recAdd()">＋ 添加抽背</button>
    </div></div>`;
  if(!REC.length) h+=`<div class="empty">暂无抽背任务，先添加一条。</div>`;
  REC.slice().reverse().forEach(it=>{
    const done=new Set(it.done||[]);const total=stu().length, sub=done.size;
    h+=`<div class="card" style="padding:13px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div style="font-size:15px"><b>${it.date}</b> · ${it.subject} · ${it.content||"(无内容)"}</div>
        <div style="font-size:14px;color:${sub===total?'var(--ok)':'var(--c2)'};font-weight:800;white-space:nowrap">${sub}/${total}</div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="bigbtn" style="background:#e8f5e9;border-color:#43a047;color:#2e7d32" onclick="recAllDone(${it.id})">✅ 全部已背</button>
        <button class="bigbtn" style="background:#fff" onclick="recClear(${it.id})">🧹 全部未背</button>
        <button class="bigbtn" style="background:#fff;color:#ef5350;border-color:#fecaca;flex:0;min-width:72px" onclick="recDel(${it.id})">删除</button>
      </div>
      <div class="hw-grid">`;
    stu().forEach(s=>{const on=done.has(s.n);h+=`<span class="hw-chip${on?" done":""}" onclick="recToggle(${it.id},'${s.n}')">${s.n}</span>`;});
    h+=`</div></div>`;
  });
  if(REC.length){
    const stat=stu().map(s=>{let j=0;REC.forEach(it=>(it.done||[]).includes(s.n)&&j++);return {n:s.n,j};}).sort((a,b)=>b.j-a.j);
    h+=`<div class="card"><h3>📊 学生抽背统计（共 ${REC.length} 次）</h3><div style="overflow-x:auto"><table><tr><th>姓名</th><th>已背</th><th>未背</th><th>通过率</th></tr>`;
    stat.forEach(x=>{const rate=Math.round(x.j/REC.length*100);h+=`<tr><td><b>${x.n}</b></td><td style="color:var(--ok)">${x.j}</td><td style="color:${x.j<REC.length?'var(--red)':'var(--mut)'}">${REC.length-x.j}</td><td>${rate}%</td></tr>`;});
    h+=`</table></div></div>`;
  }
  h+=`<div class="toolbar" style="margin-top:6px"><button class="sel" onclick="exportExcel()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:46px">⬇ 导出Excel</button><label class="sel" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;text-align:center;min-height:46px">⬆ 恢复<input type="file" accept="application/json" style="display:none" onchange="importBackup(this)"></label></div>`;
  return h;
}
function recAdd(){const date=document.getElementById("recDate").value||todayStr();const subject=document.getElementById("recSub").value;const content=document.getElementById("recContent").value.trim();if(!content){alert("请填写抽背内容");return;}const REC=LS("g16_recite",[]);REC.push({id:Date.now(),date,subject,content,done:[]});LSset("g16_recite",REC);toast("📚 抽背已添加");refresh();}
function recToggle(id,name){const REC=LS("g16_recite",[]);const it=REC.find(x=>x.id===id);if(!it)return;it.done=it.done||[];const i=it.done.indexOf(name);if(i>=0)it.done.splice(i,1);else it.done.push(name);LSset("g16_recite",REC);refresh();}
function recAllDone(id){const REC=LS("g16_recite",[]);const it=REC.find(x=>x.id===id);if(!it)return;it.done=stu().map(s=>s.n);LSset("g16_recite",REC);toast("✅ 已全部标记已背");refresh();}
function recClear(id){const REC=LS("g16_recite",[]);const it=REC.find(x=>x.id===id);if(!it)return;it.done=[];LSset("g16_recite",REC);toast("🧹 已全部标记未背");refresh();}
function recDel(id){if(!confirm("确定删除该抽背任务？"))return;LSset("g16_recite",LS("g16_recite",[]).filter(x=>x.id!==id));refresh();}

let RAND_DRAWN=new Set(); let RAND_NOREP=true;
function vRandomRoll(){
  const names=stu().map(s=>s.n);
  let h=`<div class="card" style="text-align:center;padding:22px 14px">
    <div style="font-size:22px;margin-bottom:4px">🎲</div>

    <button class="bigbtn" style="background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:none;font-weight:800;font-size:18px;min-height:62px;width:100%" onclick="randDraw()">🎲 开始随机点名</button>
    <div style="margin-top:14px;display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px">
      <label style="display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" id="randNoRep" ${RAND_NOREP?"checked":""} onchange="RAND_NOREP=this.checked;RAND_DRAWN.clear();refresh()" style="accent-color:var(--c1)"> 不重复（抽过的本轮不再抽）</label>
    </div>
    <div style="margin-top:10px;font-size:13px;color:var(--mut)">本轮已抽 <b style="color:var(--c1)">${RAND_DRAWN.size}</b> 人 · 共 ${names.length} 人</div>
  </div>`;
  if(RAND_DRAWN.size){
    h+=`<div class="card"><h3>📋 本轮已抽名单</h3><div class="rand-list" style="display:flex;flex-wrap:wrap;gap:6px">`;
    RAND_DRAWN.forEach(n=>{h+=`<span class="chip" style="background:#eef2ff;border-color:#c7d2fe;color:#3b4cca" onclick="jumpStu('${n}')">${n}</span>`;});
    h+=`</div><div style="margin-top:10px"><button class="sel" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:42px" onclick="RAND_DRAWN.clear();refresh()">🔄 重置本轮</button></div></div>`;
  }
  h+=`<div class="toolbar" style="margin-top:6px"><button class="sel" onclick="exportExcel()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:46px">⬇ 导出Excel</button></div>`;
  return h;
}
function randDraw(){
  const names=stu().map(s=>s.n);
  let pool=names;
  if(RAND_NOREP){
    pool=names.filter(n=>!RAND_DRAWN.has(n));
    if(!pool.length){RAND_DRAWN.clear();pool=names;toast("🔄 已全部抽完，开始新的一轮");}
  }
  const mask=document.getElementById("randMask");
  const nmEl=document.getElementById("randName");
  const subEl=document.getElementById("randSub");
  mask.classList.add("show");nmEl.classList.remove("pop");subEl.textContent="随机抽取中…";
  let tick=setInterval(()=>{nmEl.textContent=pool[Math.floor(Math.random()*pool.length)];},60);
  const stop=setTimeout(()=>{
    clearInterval(tick);
    const pick=pool[Math.floor(Math.random()*pool.length)];
    nmEl.textContent=pick;nmEl.classList.add("pop");
    subEl.textContent=`已抽到 ${RAND_DRAWN.size+1} 人次`;
    RAND_DRAWN.add(pick);
    refresh();
  },1500);
  mask._tick=tick;mask._stop=stop;
}
function randClose(){const mask=document.getElementById("randMask");clearInterval(mask._tick);clearTimeout(mask._stop);mask.classList.remove("show");}

  "周四":{"早1":{subj:"语文",teacher:"陆蕊"},"早2":{subj:"英语",teacher:"钟新"},"第1节":{subj:"英语",teacher:"钟新"},"第2节":{subj:"英语",teacher:"钟新"},"第3节":{subj:"物理",teacher:"孙威"},"第4节":{subj:"化学",teacher:"蔡子恒"},"午练":{subj:"地理",teacher:"王馨珧"},"第5节":{subj:"数学",teacher:"王子艳"},"第6节":{subj:"语文",teacher:"陆蕊"},"第7节":{subj:"地理",teacher:"王馨珧"},"第8节":{subj:"英语",teacher:"钟新"},"晚1":{subj:"数学",teacher:"王子艳"},"晚2":{subj:"数学",teacher:"王子艳"},"晚3":{subj:"数学",teacher:"王子艳"},"晚4":{subj:"地理",teacher:"王馨珧"},"晚5":{subj:"化学",teacher:"蔡子恒"}},
  "周五":{"早1":{subj:"英语",teacher:"钟新"},"早2":{subj:"语文",teacher:"陆蕊"},"第1节":{subj:"英语",teacher:"钟新"},"第2节":{subj:"语文",teacher:"陆蕊"},"第3节":{subj:"数学",teacher:"王子艳"},"第4节":{subj:"地理",teacher:"王馨珧"},"午练":{subj:"数学",teacher:"王子艳"},"第5节":{subj:"体育",teacher:"许一凡"},"第6节":{subj:"化学",teacher:"蔡子恒"},"第7节":{subj:"物理",teacher:"孙威"},"第8节":{subj:"语文",teacher:"陆蕊"},"晚1":{subj:"语文",teacher:"陆蕊"},"晚2":{subj:"物理",teacher:"孙威"},"晚3":{subj:"化学",teacher:"蔡子恒"},"晚4":{subj:"物理",teacher:"孙威"},"晚5":{subj:"地理",teacher:"王馨珧"}}
};
(function(){const z={};TT_PERIODS.forEach(p=>z[p]={subj:"自习",teacher:""});["周六","周日"].forEach(d=>TT_DEF[d]=JSON.parse(JSON.stringify(z)));})();
function ttDefault(){const grid={};
  TT_DAYS.forEach(d=>{grid[d]={};TT_PERIODS.forEach(p=>grid[d][p]=null);});
  Object.entries(TT_DEF).forEach(([d,ps])=>Object.entries(ps).forEach(([p,c])=>{grid[d][p]={subj:c.subj,teacher:c.teacher||""};}));
  return {days:TT_DAYS.slice(0),periods:TT_PERIODS,grid};}
function getTT(){let t=LS("g16_tt",null);
  if(t&&t.grid&&t.periods&&t.days&&t.days.length){
    if(t.periods.length!==TT_PERIODS.length){const d=ttDefault();LSset("g16_tt",d);return d;} /* 节次结构升级，自动刷新为最新课表 */
    let ch=false; /* 迁移：补齐缺失天（如周六周日）与缺失节次 */
    TT_DAYS.forEach(d=>{if(!t.days.includes(d)){t.days.push(d);t.grid[d]={};TT_PERIODS.forEach(p=>{if(!t.grid[d][p])t.grid[d][p]=null;});ch=true;}});
    TT_PERIODS.forEach(p=>{if(!t.periods.includes(p)){t.periods.push(p);ch=true;}});
    if(ch)LSset("g16_tt",t);
    return t;
  }
  const d=ttDefault();LSset("g16_tt",d);return d;}
/* 计算当前时间所在：今天星期、当前节次、状态（in/between/before/after） */
function ttNowInfo(){const now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
  const DOW=["周日","周一","周二","周三","周四","周五","周六"];const today=DOW[now.getDay()];
  let cur=-1,status="rest";
  for(let i=0;i<TT_PERIODS.length;i++){const[s,e]=TT_TIMES[TT_PERIODS[i]];if(nowMin>=s&&nowMin<=e){cur=i;status="in";break;}}
  if(cur<0){const f=TT_TIMES[TT_PERIODS[0]][0],l=TT_TIMES[TT_PERIODS[TT_PERIODS.length-1]][1];
    status=nowMin<f?"before":nowMin>l?"after":"between";}
  return {nowMin,today,cur,status};}
let TT_FOCUS=null;
function vTimetable(){
  const t=getTT();const ni=ttNowInfo();
  const fmt=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
  const subs=[...SUBS,...TT_EXTRA];
  let h=`<div class="card"><h3>🗓 课程表</h3>
    <div class="note" style="margin-bottom:8px">点单元格可编辑科目与任课教师；点上方学科标签可<b>高亮聚焦</b>该学科全部课程。红色横线为<b>当前时间定位线</b>。数据自动保存在本设备，<b>老师可直接手改</b>。</div>
    <div class="subj-chips">`;
  subs.forEach(s=>{const col=SCOL[s]||"#94a3b8";const on=TT_FOCUS===s;h+=`<span class="sc ${on?'on':''}" style="${on?`background:${col};border-color:${col}`:''}" onclick="ttFocus('${s}')">${s}</span>`;});
  h+=`<span class="sc" style="${TT_FOCUS?'background:var(--c1);color:#fff;border-color:var(--c1)':''}" onclick="ttFocus(null)">${TT_FOCUS?'✕ 取消聚焦':'全部'}</span></div>`;
  h+=`<div class="tt-wrap"><table class="tt-grid${t.days.length>5?" narrow":""}"><tr><th class="pr"></th>${t.days.map(d=>`<th class="${d===ni.today?'today':''}">${d}</th>`).join("")}</tr>`;
  t.periods.forEach((p,pi)=>{
    const tm=TT_TIMES[p]?fmt(TT_TIMES[p][0]):"";
    h+=`<tr><td class="pr">${p}<small>${tm}</small></td>`;
    t.days.forEach(d=>{
      const cell=t.grid[d]&&t.grid[d][p];
      const subj=cell?cell.subj:null;
      const dim=TT_FOCUS&&TT_FOCUS!==subj?"dim":"";
      const hot=TT_FOCUS&&TT_FOCUS===subj?"hot":"";
      const now=(d===ni.today&&pi===ni.cur)?"now":"";
      if(!subj)h+=`<td><div class="tt-cell empty ${dim} ${now}" onclick="ttEdit('${d}','${p}')">—</div></td>`;
      else{h+=`<td><div class="tt-cell ${dim} ${hot} ${now}" style="background:${SCOL[subj]||"#94a3b8"}" onclick="ttEdit('${d}','${p}')">${subj}<span class="tch">${cell.teacher||""}</span></div></td>`;}
    });
    h+=`</tr>`;
  });
  h+=`</table><div id="ttNowLine" class="tt-nowline"><span></span></div></div></div>`;
  h+=`<div class="toolbar" style="margin-top:8px">
    <button class="sel" onclick="ttCopyDay()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:44px">📋 复制某天</button>
    <button class="sel" onclick="ttReset()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:44px">🔄 清空重排</button>
    <button class="sel" onclick="exportExcel()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;min-height:44px">⬇ 导出Excel</button>
  </div>`;
  return h;
}
/* 在课表渲染后，按当前时间画出红色定位线（横贯全表，定位“现在”） */
function ttDrawNow(){
  const wrap=document.querySelector(".tt-wrap");if(!wrap)return;
  const tbl=wrap.querySelector(".tt-grid");if(!tbl)return;
  const rows=[...tbl.querySelectorAll("tr")];if(rows.length<2)return;
  const line=document.getElementById("ttNowLine");if(!line)return;
  const wr=wrap.getBoundingClientRect();
  const top=y=>y.getBoundingClientRect().top-wr.top+wrap.scrollTop;
  const first=rows[1],last=rows[rows.length-1];
  const yTop=top(first),yBot=top(last)+last.getBoundingClientRect().height;
  const ni=ttNowInfo();
  const f=TT_TIMES[TT_PERIODS[0]][0],l=TT_TIMES[TT_PERIODS[TT_PERIODS.length-1]][1];
  let frac=(ni.nowMin-f)/(l-f);frac=Math.max(0,Math.min(1,frac));
  line.style.top=(yTop+frac*(yBot-yTop))+"px";
  line.style.width=tbl.offsetWidth+"px";
  const hh=String(Math.floor(ni.nowMin/60)).padStart(2,"0"),mm=String(ni.nowMin%60).padStart(2,"0");
  const tag=ni.status==="before"?"今日未开始":ni.status==="after"?"今日已结束":ni.status==="between"?`课间 ${hh}:${mm}`:`现在 ${hh}:${mm}`;
  line.querySelector("span").textContent=tag;
  line.style.display="block";
}
function ttFocus(sub){TT_FOCUS=(TT_FOCUS===sub)?null:sub;refresh();}
function ttEdit(d,p){const t=getTT();const cur=(t.grid[d]&&t.grid[d][p])||{};const m=document.getElementById("ttModal");
  const opts=[...SUBS,...TT_EXTRA].map(s=>`<option ${cur.subj===s?"selected":""}>${s}</option>`).join("");
  m.querySelector(".ttbody").innerHTML=`
    <div style="font-size:15px;font-weight:800;margin-bottom:12px">${d} · ${p}</div>
    <div style="display:flex;flex-direction:column;gap:9px">
      <select class="sel" id="ttSubSel">${opts}</select>
      <input class="sel" id="ttTch" placeholder="任课教师（可选）" value="${esc(cur.teacher||"")}">
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="bigbtn" style="flex:1;background:#fff;color:#ef5350;border-color:#fecaca" onclick="ttClearCell('${d}','${p}')">清空</button>
      <button class="bigbtn" style="flex:2;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:none;font-weight:700" onclick="ttSaveCell('${d}','${p}')">保存</button>
    </div>`;
  m.classList.add("show");
}
function ttSaveCell(d,p){const subj=document.getElementById("ttSubSel").value;const teacher=document.getElementById("ttTch").value.trim();const t=getTT();if(!t.grid[d])t.grid[d]={};if(subj==="空")t.grid[d][p]=null;else t.grid[d][p]={subj,teacher};LSset("g16_tt",t);document.getElementById("ttModal").classList.remove("show");toast("🗓 已保存");refresh();}
function ttClearCell(d,p){const t=getTT();if(t.grid[d])t.grid[d][p]=null;LSset("g16_tt",t);document.getElementById("ttModal").classList.remove("show");refresh();}
function ttReset(){if(!confirm("确定清空整张课程表？"))return;const d=ttDefault();LSset("g16_tt",d);TT_FOCUS=null;refresh();}
function ttCopyDay(){const t=getTT();const from=prompt("复制哪一天？（如：周一）",t.days[0]||"周一");if(!from||!t.grid[from]){alert("未找到该天");return;}const to=prompt("复制到哪一天？（如：周二）",t.days[1]||"周二");if(!to||!t.grid[to]){alert("未找到目标天");return;}t.grid[to]=JSON.parse(JSON.stringify(t.grid[from]));LSset("g16_tt",t);toast(`已复制 ${from} → ${to}`);refresh();}

/* ---------- 自动更新校验（保证打开即最新） ---------- */
async function checkUpdate(){
  try{
    const r=await fetch("version.json?_="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const d=await r.json();
    if(d.build && d.build!==BUILD){
      const el=document.getElementById("upd");
      if(d.note)el.querySelector("small").textContent=d.note;
      el.style.display="block";
    }
  }catch(e){/* 离线 / 本地文件，忽略 */}
}

window.addEventListener("DOMContentLoaded",boot);
