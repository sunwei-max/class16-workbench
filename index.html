<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>高三16班 · 班级工作台</title>
<style>
:root{
  --c1:#1e3a8a; --c2:#6d28d9; --bg:#eef2f7; --card:#ffffff; --ink:#1a2233; --mut:#64748b;
  --yi:#43a047; --ben:#1e88e5; --up:#FFD54F; --down:#FF8A65; --no:#cfd8dc;
  --red:#e53935; --ok:#2e7d32;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
/* ---------- 头部 ---------- */
header{background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 100%);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:30;box-shadow:0 4px 20px rgba(30,58,138,.35)}
header .t1{font-size:20px;font-weight:800;letter-spacing:1px}
header .t2{font-size:12px;opacity:.85;margin-top:3px}
nav{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none;padding-bottom:2px}
nav::-webkit-scrollbar{display:none}
nav button{flex-shrink:0;border:none;background:rgba(255,255,255,.15);color:#fff;padding:8px 13px;border-radius:999px;font-size:13.5px;cursor:pointer;transition:.2s;white-space:nowrap}
nav button.on{background:#fff;color:var(--c1);font-weight:800}
#examBar{display:flex;gap:6px;overflow-x:auto;margin-top:9px;scrollbar-width:none}
#examBar::-webkit-scrollbar{display:none}
#examBar button{flex-shrink:0;border:none;background:rgba(255,255,255,.18);color:#fff;padding:5px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap;border:1.5px solid transparent}
#examBar button.on{background:#fff;color:var(--c1);font-weight:800}
main{max-width:920px;margin:0 auto;padding:14px 12px 40px}
/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card h3::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--c1),var(--c2))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.kpi .v{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .l{font-size:12px;color:var(--mut);margin-top:3px}
.kpi .d{font-size:11px;margin-top:2px;color:var(--ok);font-weight:700}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;margin:3px;cursor:pointer;border:1.5px solid transparent}
.bar{height:10px;border-radius:5px;background:#e8edf5;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .6s}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1.5px solid #e8edf5;white-space:nowrap;font-size:12px}
td{padding:9px 6px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
tr.rowc{cursor:pointer;transition:.15s}
tr.rowc:hover{background:#f5f7ff}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;color:#123}
.wb{display:inline-block;width:17px;height:17px;line-height:15px;text-align:center;border-radius:4px;font-size:10px;font-weight:800;color:#fff;margin-right:3px}
.tag-up{color:var(--ok);font-weight:800}
.tag-down{color:var(--red);font-weight:800}
input.sel,select.sel{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;background:#fff}
select.sel{min-width:96px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar input,.toolbar select{flex:1;min-width:120px}
.sec-title{font-size:13px;color:var(--mut);margin:14px 2px 8px;font-weight:700}
.empty{color:#94a3b8;text-align:center;padding:30px 0;font-size:14px}
.note{font-size:12px;color:var(--mut);line-height:1.6}
/* 座位 */
.seat-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.seat-grid2{display:grid;grid-template-columns:46px repeat(9,1fr);gap:5px;min-width:520px}
.seat-grid-v{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;min-width:520px}
.seat-label{display:flex;align-items:center;justify-content:center;background:#4f4f4f;color:#fff;font-weight:700;font-size:11px;border-radius:6px;min-height:50px}
.seat-label-col{display:flex;align-items:center;justify-content:center;background:#4f4f4f;color:#fff;font-weight:700;font-size:11px;border-radius:6px;min-height:26px}
.front-banner{text-align:center;font-size:13px;font-weight:700;color:#64748b;background:#eef2f7;border-radius:8px;padding:6px;margin-bottom:8px}
.podium-span{grid-column:span 7;background:#334155;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:8px;font-size:14px;min-height:44px}
.seat{border-radius:8px;padding:5px 2px;text-align:center;cursor:pointer;border:2px solid #94a3b8;position:relative;min-height:50px;display:flex;flex-direction:column;justify-content:center}
.seat .nm{font-size:12.5px;font-weight:800;line-height:1.1}
.seat .wk{font-size:9px;margin-top:2px;letter-spacing:1px}
.seat .zz{position:absolute;top:-6px;right:-6px;width:16px;height:16px;background:var(--red);color:#fff;border-radius:50%;font-size:9px;line-height:16px;font-weight:800}
.seat.empty-s{border:2px dashed #cbd5e1;background:#fff;color:#94a3b8;font-size:11px;cursor:default}
.front-seat{min-height:44px}
.seat.big{min-height:56px}
.blackboard{text-align:center;color:#64748b;font-size:12px;margin-top:8px;letter-spacing:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:3px;border:1px solid #94a3b8}
/* 学科 */
.subj-card{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.subj-card .ic{width:44px;height:44px;border-radius:12px;color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.subj-card .bd{flex:1;min-width:0}
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px}
.dist i{height:100%}
/* 通报 */
.report{background:linear-gradient(180deg,#fffdf5,#fff);border:1.5px solid #f2e8c9}
.report .rh{text-align:center;padding:8px 0 4px}
.report .rh .a{font-size:18px;font-weight:900;letter-spacing:2px}
.report .rh .b{font-size:12px;color:var(--mut);margin-top:4px}
.report p{font-size:14px;line-height:1.9;margin:10px 0;text-indent:2em}
.report .names{background:#faf7ec;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px;line-height:2}
.report .names b{color:#9a6b00}
footer{text-align:center;color:#94a3b8;font-size:11px;padding:16px 0 6px}
a{color:var(--c1)}
.lb{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;background:#f1f5f9;color:var(--ink);cursor:pointer;border:1.5px solid #e2e8f0;margin:3px}
</style>
</head>

  </header>
  <main id="main"></main>

</div>

function vOverview(){
  const s=EX().stats;
  const kpi=(v,l,d)=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div>${d||""}</div>`;
  const rate=(v,t)=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:4px"><span>${t}</span><b>${v}</b></div><div class="bar"><i style="width:${v}"></i></div></div>`;
  let h=`<div class="grid3">
    ${kpi(s.n,"参考人数")}
    ${kpi(s.avg,"班级均分",`<div class="d">较期初 ${s.avg>=s.avgQ?"+":""}${(s.avg-s.avgQ).toFixed(1)}</div>`)}
    ${kpi(s.benyi,"达本一")}
    ${kpi(s.benke,"达本科")}
    ${kpi(s.critUp.length+s.critDown.length,"本一临界生")}
    ${kpi(s.focus.length,"重点关注(≥2弱)")}
  </div>`;
  h+=`<div class="card"><h3>达线率</h3>${rate((s.benyi/s.n*100).toFixed(1),"一本率 %")}${rate((s.benke/s.n*100).toFixed(1),"本科率 %")}</div>`;
  h+=`<div class="card"><h3>班均分：期初 → ${CUR_EXAM}</h3>
    <div style="display:flex;align-items:center;gap:10px;margin:6px 0"><span style="width:74px;font-size:12px;color:var(--mut)">期初联考</span><div class="bar" style="flex:1"><i style="width:${s.avgQ/s.maxAvg*100}%;background:#b0bec5"></i></div><b>${s.avgQ}</b></div>
    <div style="display:flex;align-items:center;gap:10px;margin:6px 0"><span style="width:74px;font-size:12px;color:var(--mut)">${CUR_EXAM}</span><div class="bar" style="flex:1"><i style="width:${s.avg/s.maxAvg*100}%"></i></div><b>${s.avg}</b></div></div>`;
  h+=`<div class="card"><h3>本一临界生（重点帮扶）</h3>${(s.critUp.concat(s.critDown)).map(n=>`<span class="chip" style="background:${eC(byN(n).e)}" onclick="jumpStu('${n}')">${n}</span>`).join("")||'<div class="empty">无</div>'}</div>`;
  h+=`<div class="card"><h3>重点关注名单（≥2科班内后1/4）</h3>${s.focus.map(n=>`<span class="chip" style="background:#fff;border-color:var(--red);color:var(--red)" onclick="jumpStu('${n}')">${n} ${weakIco(byN(n).w)}</span>`).join("")||'<div class="empty">无</div>'}</div>`;
  h+=`<div class="card"><h3>分布一览</h3>${Object.keys(EDGE).map(k=>`<div style="display:flex;align-items:center;gap:8px;margin:5px 0"><span style="width:104px;font-size:12px">${badge(k)}</span><div class="bar" style="flex:1"><i style="width:${(s.byEdge[k]||0)/s.n*100}%;background:${eC(k)==="#ffffff"?"#e2e8f0":eC(k)}"></i></div><b style="width:24px;text-align:right">${s.byEdge[k]||0}</b></div>`).join("")}</div>`;
  return h;
}

let SC={q:"",f:"all",sort:"r"};
function vScores(){
  let list=stu().filter(s=>SC.f==="all"||s.e===SC.f);

  const cmp={r:(a,b)=>a.r-b.r,z:(a,b)=>(b.z??-1)-(a.z??-1),l:(a,b)=>(a.l??9e4)-(b.l??9e4),p:(a,b)=>(b.p??-999)-(a.p??-999)};
  list=list.slice().sort(cmp[SC.sort]);
  let h=`<div class="card"><div class="toolbar">
    <input class="sel" placeholder="🔍 搜索姓名" value="${SC.q}" oninput="SC.q=this.value;go('sc');document.querySelector('main .card input').focus()">
    <select class="sel" onchange="SC.f=this.value;go('sc')">
      <option value="all" ${SC.f==="all"?"selected":""}>全部状态</option>
      ${Object.keys(EDGE).map(k=>`<option value="${k}" ${SC.f===k?"selected":""}>${EDGE[k]}</option>`).join("")}
    </select>
    <select class="sel" onchange="SC.sort=this.value;go('sc')">
      <option value="r" ${SC.sort==="r"?"selected":""}>按班名</option>
      <option value="z" ${SC.sort==="z"?"selected":""}>按总分</option>
      <option value="l" ${SC.sort==="l"?"selected":""}>按理科名次</option>
      <option value="p" ${SC.sort==="p"?"selected":""}>按进步幅度</option>
    </select></div>
  <div style="overflow-x:auto"><table><tr><th>#</th><th>姓名</th><th>总分</th><th>班名</th><th>理科名</th><th>状态</th><th>薄弱</th><th>vs期初</th></tr>`;
  list.forEach((s,i)=>{
    h+=`<tr class="rowc" onclick="jumpStu('${s.n}')"><td>${i+1}</td><td><b>${s.n}</b>${s.m?' <span title="目标生">⭐</span>':""}</td><td><b>${s.z??"—"}</b></td><td>${s.r??"—"}</td><td>${s.l??"—"}</td><td>${badge(s.e)}</td><td>${weakIco(s.w)}</td><td>${progTag(s.p)}</td></tr>`;
  });
  return h+"</table></div></div>";
}

  </div>`;

      <div class="bar" style="height:12px;position:relative"><i style="width:${pct}%;background:${weak?'linear-gradient(90deg,#ff8a65,#e53935)':'linear-gradient(90deg,var(--c1),var(--c2))'}"></i>
      <span style="position:absolute;top:-3px;left:${apct}%;width:2px;height:18px;background:#334155"></span></div></div>`;
  });
  h+=`</div>`;
  h+=`<div class="card"><h3>期初 → ${CUR_EXAM} 轨迹</h3>
    <table><tr><th></th><th>总分</th><th>班名</th></tr>

  return h;
}

  st.rows.forEach(r=>{h+=`<div class="seat-label">${r[0]}</div>`;r.slice(1).forEach((n,i)=>{h+=`<div style="${aisle(i+1)}">${n?seatCell(n):'<div class="seat empty-s">空座</div>'}</div>`;});});

    h+=`</table></div></div>`;
  }
  h+=`<div class="toolbar" style="margin-top:6px"><button class="sel" onclick="hwExport()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer">⬇ 导出备份</button><label class="sel" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;text-align:center">⬆ 导入<input type="file" accept="application/json" style="display:none" onchange="hwImport(this)"></label></div>`;
  return h;
}
function hwAdd(){const date=document.getElementById("hwDate").value||todayStr();const subject=document.getElementById("hwSub").value;const content=document.getElementById("hwContent").value.trim();if(!content){alert("请填写作业内容");return;}const HW=LS("g16_hw",[]);HW.push({id:Date.now(),date,subject,content,due:"",done:[]});LSset("g16_hw",HW);go("hw");}
function hwToggle(id,name){const HW=LS("g16_hw",[]);const it=HW.find(x=>x.id===id);if(!it)return;it.done=it.done||[];const i=it.done.indexOf(name);if(i>=0)it.done.splice(i,1);else it.done.push(name);LSset("g16_hw",HW);go("hw");}
function hwDel(id){if(!confirm("确定删除该作业记录？"))return;LSset("g16_hw",LS("g16_hw",[]).filter(x=>x.id!==id));go("hw");}
function hwExport(){const d={hw:LS("g16_hw",[]),pt:LS("g16_pt",[]),roll:LS("g16_roll",{})};download("ban16_作业积分点名备份.json",JSON.stringify(d,null,2));}
function hwImport(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.hw)LSset("g16_hw",d.hw);if(d.pt)LSset("g16_pt",d.pt);if(d.roll)LSset("g16_roll",d.roll);alert("导入成功");go(CUR);}catch(e){alert("导入失败：文件格式错误");}};r.readAsText(f);}

/* ---------- 积分 ---------- */
function vPoints(){
  let PT=LS("g16_pt",[]);
  const bal={};stu().forEach(s=>bal[s.n]=0);PT.forEach(e=>{if(bal[e.name]!=null)bal[e.name]+=e.delta;});
  const board=Object.entries(bal).sort((a,b)=>b[1]-a[1]);
  let h=`<div class="card"><h3>💯 班级积分</h3>
    <div class="toolbar">
      <select class="sel" id="ptName">${stu().map(s=>`<option>${s.n}</option>`).join("")}</select>
      <input class="sel" id="ptDelta" type="number" placeholder="分值(+/-)" style="max-width:96px">
      <input class="sel" id="ptReason" placeholder="事由，如：作业优秀">
      <button class="sel" style="background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:none;font-weight:700;cursor:pointer" onclick="ptAdd()">+ 记录</button>
    </div></div>`;
  h+=`<div class="card"><h3>🏅 积分排行榜</h3><div style="overflow-x:auto"><table><tr><th>#</th><th>姓名</th><th>积分</th></tr>`;
  board.forEach(([n,v],i)=>{h+=`<tr><td>${i+1}</td><td><b>${n}</b></td><td style="font-weight:800;color:${v>0?'var(--ok)':v<0?'var(--red)':'var(--ink)'}">${v>0?'+':''}${v}</td></tr>`;});
  h+=`</table></div></div>`;
  h+=`<div class="card"><h3>🧾 最近记录</h3>`;
  if(!PT.length)h+=`<div class="empty">暂无积分记录</div>`;
  PT.slice().reverse().slice(0,30).forEach(e=>{h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px solid #f1f5f9"><div><b>${e.name}</b> <span style="color:var(--mut);font-size:12px">${e.reason||""}</span></div><div style="display:flex;gap:10px;align-items:center"><span style="font-weight:800;color:${e.delta>0?'var(--ok)':'var(--red)'}">${e.delta>0?'+':''}${e.delta}</span><span style="color:#ef5350;cursor:pointer;font-size:12px" onclick="ptDel(${e.id})">删</span></div></div>`;});
  h+=`</div>`;
  h+=`<div class="toolbar" style="margin-top:6px"><button class="sel" onclick="hwExport()" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer">⬇ 导出备份</button><label class="sel" style="background:#fff;border:1.5px solid #e2e8f0;cursor:pointer;text-align:center">⬆ 导入<input type="file" accept="application/json" style="display:none" onchange="ptImport(this)"></label></div>`;
  return h;
}
function ptAdd(){const name=document.getElementById("ptName").value;const delta=parseInt(document.getElementById("ptDelta").value,10);const reason=document.getElementById("ptReason").value.trim();if(!name||isNaN(delta)||delta===0){alert("请选择学生并填写非零分值");return;}const PT=LS("g16_pt",[]);PT.push({id:Date.now(),name,delta,reason});LSset("g16_pt",PT);go("pt");}
function ptDel(id){LSset("g16_pt",LS("g16_pt",[]).filter(e=>e.id!==id));go("pt");}
function ptImport(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.pt)LSset("g16_pt",d.pt);if(d.hw)LSset("g16_hw",d.hw);if(d.roll)LSset("g16_roll",d.roll);alert("导入成功");go(CUR);}catch(e){alert("导入失败");}};r.readAsText(f);}

/* 启动 */
window.addEventListener("DOMContentLoaded",boot);
</script>
</body>
